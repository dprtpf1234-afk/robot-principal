    updateTraffic(dt);

    // 말 걸 대상 찾기
    target = frozen ? null : findTarget();
    hooks.targetChanged && hooks.targetChanged(target);
    if (!frozen && (consume('e') || consume('enter')) && target) hooks.interact(target);
    if (frozen) { pressed.e = false; pressed.enter = false; pressed.space = modal ? false : pressed.space; }

    updateCamera(dt);
    hooks.tick && hooks.tick(dt);
  }

  function updateNpc(n, dt) {
    if (n.role !== 'ambient' || !n.wander) return;
    if (n.talking > 0) { n.talking -= dt; n.moving = false; return; }
    n.t -= dt;
    if (n.t <= 0) {
      if (n.moving) { n.moving = false; n.t = 1 + Math.random() * 3; }
      else {
        const d = ['up', 'down', 'left', 'right'][Math.floor(Math.random() * 4)];
        n.dir = d; n.moving = true; n.t = 0.5 + Math.random() * 1.5;
        n.vx = d === 'left' ? -1 : d === 'right' ? 1 : 0;
        n.vy = d === 'up' ? -1 : d === 'down' ? 1 : 0;
      }
    }
    if (n.moving) {
      const z = n.zone, sp = 26 * dt;
      const nx = n.x + n.vx * sp, ny = n.y + n.vy * sp;
      if (nx < z.x * T + 4 || nx > (z.x + z.w) * T - 4 || ny < z.y * T + 6 || ny > (z.y + z.h) * T) { n.moving = false; n.t = 0.5; return; }
      const ox = n.x, oy = n.y;
      moveEntity(n, n.vx * sp, n.vy * sp, 4, 3);
      if (n.x === ox && n.y === oy) { n.moving = false; n.t = 0.3; }
      n.anim += dt * 6;
    }
  }

  function findTarget() {
    let best = null, bd = Infinity;
    for (const n of npcs) {
      const d = Math.hypot(n.x - player.x, (n.y - player.y) * 1.2);
      const score = n.role === 'ambient' ? d : d * 0.4;
      if (d < TALK_RANGE && score < bd) { best = { type: 'npc', npc: n }; bd = score; }
    }
    for (const o of map.objects) {
      if (!o.interact || o.hidden) continue;
      const h = o.hit;
      const cx = Math.max(h.x, Math.min(player.x, h.x + h.w));
      const cy = Math.max(h.y - 6, Math.min(player.y - 4, h.y + h.h));
      const d = Math.hypot(cx - player.x, cy - (player.y - 4)) + 4;
      // 단서·사물은 지나가는 친구보다 먼저 고른다 (미션 NPC보다는 나중)
      const score = o.interact.type === 'sign' || o.interact.type === 'mirror' ? d : d * 0.5;   // 팻말은 사람보다 나중
      if (d < 18 && score < bd) { best = { type: 'obj', obj: o }; bd = score; }
    }
    return best;
  }

  function clickWorld(wx, wy) {
    let hit = null;
    for (const n of npcs) {
      if (wx >= n.x - 8 && wx <= n.x + 8 && wy >= n.y - 18 && wy <= n.y + 2) hit = { type: 'npc', npc: n };
    }
    if (!hit) {
      for (const o of map.objects) {
        if (o.interact && !o.hidden && wx >= o.x && wx <= o.x + o.w && wy >= o.y && wy <= o.y + o.h) hit = { type: 'obj', obj: o };
      }
    }
    if (!hit) return;
    const hx = hit.npc ? hit.npc.x : hit.obj.hit.x + hit.obj.hit.w / 2;
    const hy = hit.npc ? hit.npc.y : hit.obj.hit.y + hit.obj.hit.h;
    if (Math.hypot(hx - player.x, hy - player.y) > 44) { hooks.toast('조금 더 가까이 가서 말을 걸어 보세요!'); return; }
    hooks.interact(hit);
  }

  function facePlayer(n) {
    const dx = player.x - n.x, dy = player.y - n.y;
    n.dir = Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 'left' : 'right') : (dy < 0 ? 'up' : 'down');
    n.talking = 2.5; n.moving = false;
  }

  function snapCamera() {
    if (!map || !player) return;
    cam.x = clampCam(player.x - VW / 2, map.w * T, VW);
    cam.y = clampCam(player.y - 8 - VH / 2, map.h * T, VH);
  }
  function updateCamera(dt) {
    const tx = clampCam(player.x - VW / 2, map.w * T, VW);
    const ty = clampCam(player.y - 8 - VH / 2, map.h * T, VH);
    const k = Math.min(1, dt * 8);
    cam.x += (tx - cam.x) * k; cam.y += (ty - cam.y) * k;
  }
  function clampCam(v, world, view) {
    if (world <= view) return (world - view) / 2;
    return Math.max(0, Math.min(world - view, v));
  }

  // ---------------- 그리기 ----------------
  function render() {
    sg.setTransform(1, 0, 0, 1, 0, 0);
    sg.fillStyle = '#2a2533';
    sg.fillRect(0, 0, screen.width, screen.height);
    if (!map || !player) return;

    const cx = Math.round(cam.x), cy = Math.round(cam.y);
    bg.fillStyle = '#2a2533';
    bg.fillRect(0, 0, VW, VH);
    bg.drawImage(mapCache[map.id], -cx, -cy);

    // 바닥에 붙은 사물 먼저
    const flat = [], items = [];
    for (const o of map.objects) {
      if (o.hidden) continue;
      if (!o.solid) flat.push(o); else items.push({ y: o.y + o.h, o });
    }
    for (const o of flat) bg.drawImage(o.img, Math.round(o.x - cx), Math.round(o.y - cy));
    drawTraffic(cx, cy);
    for (const n of npcs) items.push({ y: n.y, n });
    items.push({ y: player.y + 0.5, p: true });
    items.sort((a, b) => a.y - b.y);

    const st = hooks.status ? hooks.status() : {};
    for (const it of items) {
      if (it.o) {
        bg.drawImage(it.o.img, Math.round(it.o.x - cx), Math.round(it.o.y - cy));
        if (st.sparkle && st.sparkle(it.o)) sparkle(it.o.x + it.o.w / 2 - cx, it.o.y - cy + 2);
      } else if (it.n) drawNpc(it.n, cx, cy, st);
      else drawPlayer(cx, cy);
    }
    for (const o of flat) if (st.sparkle && st.sparkle(o)) sparkle(o.x + o.w / 2 - cx, o.y - cy + 4);

    drawDark(cx, cy, st);
    applyLighting(cx, cy, st);
    drawConfetti(cx, cy);

    // 버퍼를 화면에 확대
    const s = scale;
    const ui = dpr;   // 글자 최소 크기용 (CSS 픽셀 → 기기 픽셀)
    sg.imageSmoothingEnabled = false;
    sg.drawImage(buffer, 0, 0, VW, VH, 0, 0, VW * s, VH * s);

    // 글자 (화면 해상도로 선명하게)
    sg.textAlign = 'center';
    sg.textBaseline = 'middle';
    for (const b of map.buildings) {
      if (!b.signRect) continue;
      text(b.name, (b.signRect.x + b.signRect.w / 2 - cam.x) * s, (b.signRect.y + 6 - cam.y) * s, 7 * s, '#3a2c1a', null, true);
    }
    for (const l of map.labels) {
      textTag(l.text, (l.x - cam.x) * s, (l.y - cam.y) * s, Math.max(5.2 * s, 11 * ui));
    }
    for (const n of npcs) {
      if (n.role === 'ambient') continue;
      if (n.role === 'friend' && !(st.known && st.known(n))) continue;
      textTag(n.name, (n.x - cam.x) * s, (n.y - 22 - cam.y) * s - Math.max(0, 10 * ui - 4.6 * s) * 0.6, Math.max(4.6 * s, 10 * ui), n.role === 'mission' ? '#fff3c4' : n.role === 'side' ? '#d9f2ff' : n.role === 'friend' ? '#e6ffd9' : n.role === 'teacher' ? '#f1e2ff' : '#eee');
    }
    const tag = hooks.playerTag ? hooks.playerTag() : null;
    if (tag && !(target && Math.abs(targetPoint(target).x - player.x) < 30)) {
      textTag(tag, (player.x - cam.x) * s, (player.y - 24 - player.z - cam.y) * s - Math.max(0, 10 * ui - 4.6 * s) * 0.6, Math.max(4.2 * s, 10 * ui), '#ffe9a8', 'rgba(30,24,40,0.6)');
    }
    if (target && !touchMode) {
      const p = targetPoint(target);
      const verb = target.type === 'npc' ? '대화하기' : '살펴보기';
      textTag('E  ' + verb, (p.x - cam.x) * s, (p.y - cam.y) * s - Math.max(0, 12 * ui - 5 * s), Math.max(5 * s, 12 * ui), '#ffffff', '#3c6bd8');
    }

    if (fade > 0) {
      sg.fillStyle = `rgba(20,16,28,${fade})`;
      sg.fillRect(0, 0, screen.width, screen.height);
    }
    const gt = hooks.guide ? hooks.guide() : null;
    if (gt && !fade) drawGuide(gt, s, ui);
    drawMinimap();
  }

  // 노란 별 길잡이: 목표가 화면 안이면 그 위에, 밖이면 화면 가장자리에서 방향을 가리킨다
  function drawGuide(gt, s, ui) {
    const W = screen.width, H = screen.height;
    let x = (gt.x - cam.x) * s, y = (gt.y - cam.y) * s;
    const side = document.querySelector('.hud-side');
    const rightPad = side ? (side.offsetWidth + 24) * ui : 260 * ui;
    const L = 40 * ui, R = W - 40 * ui, Tp = 120 * ui, B = H - 60 * ui;
    const inside = x > L && x < W - 30 * ui && y > Tp && y < B;
    const bob = Math.sin(time * 5) * 4 * ui;
    if (inside) {
      if (gt.kind === 'npc') return;          // NPC 머리 위에는 이미 ! 표시가 있다
      star(x, y - 16 * ui + bob, 11 * ui);
      return;
    }
    // 화면 중심에서 목표 쪽으로 가장자리에 붙인다 (오른쪽 위 미니맵 자리는 피한다)
    const cx = W / 2, cy = H / 2;
    const dx = x - cx, dy = y - cy;
    let k = 1;
    if (dx > 0) k = Math.min(k, (R - cx) / dx);
    if (dx < 0) k = Math.min(k, (L - cx) / dx);
    if (dy > 0) k = Math.min(k, (B - cy) / dy);
    if (dy < 0) k = Math.min(k, (Tp - cy) / dy);
    let ex = cx + dx * k, ey = cy + dy * k;
    if (ex > W - rightPad && ey < (side ? side.offsetHeight * ui + 40 * ui : 300 * ui)) ey = Math.max(ey, side.offsetHeight * ui + 40 * ui);
    const ang = Math.atan2(dy, dx);
    // 화살표
    sg.save();
    sg.translate(ex, ey); sg.rotate(ang);
    sg.fillStyle = '#ffd84a'; sg.strokeStyle = '#2b2233'; sg.lineWidth = 3 * ui;
    sg.beginPath(); sg.moveTo(30 * ui, 0); sg.lineTo(16 * ui, -10 * ui); sg.lineTo(16 * ui, 10 * ui); sg.closePath();
    sg.stroke(); sg.fill();
    sg.restore();
    star(ex, ey, 14 * ui + Math.sin(time * 5) * 1.5 * ui);
  }
  function star(x, y, r) {
    sg.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r;
      sg.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    sg.closePath();
    sg.fillStyle = '#ffd84a'; sg.strokeStyle = '#2b2233'; sg.lineWidth = Math.max(2, r * 0.22);
    sg.lineJoin = 'round'; sg.stroke(); sg.fill();
  }

  // ---------------- 어두운 방 (정전된 창고) ----------------
  // 방 안은 거의 보이지 않고, 손전등이 있으면 플레이어 주변과 바라보는 쪽만 밝다.
  let darkCanvas = null, dkg = null;
  function inDark(x, y) {
    return (map.darkZones || []).some(z => x > z.x * T - 6 && x < (z.x + z.w) * T + 6 && y > z.y * T - 4 && y < (z.y + z.h) * T + 18);
  }
  function drawDark(cx, cy, st) {
    if (!map.darkZones || !map.darkZones.length) return;
    if (!darkCanvas) { darkCanvas = document.createElement('canvas'); dkg = darkCanvas.getContext('2d'); }
    if (darkCanvas.width !== VW || darkCanvas.height !== VH) { darkCanvas.width = VW; darkCanvas.height = VH; }
    dkg.globalCompositeOperation = 'source-over';
    dkg.clearRect(0, 0, VW, VH);
    dkg.fillStyle = 'rgba(3, 4, 12, 0.97)';
    for (const z of map.darkZones) dkg.fillRect(z.x * T - cx, z.y * T - cy - 6, z.w * T, z.h * T + 6);
    if (inDark(player.x, player.y)) {
      const lit = !!st.flashlight;
      dkg.globalCompositeOperation = 'destination-out';
      const hole = (x, y, r, a) => {
        const gr = dkg.createRadialGradient(x, y, 0, x, y, r);
        gr.addColorStop(0, `rgba(0,0,0,${a})`); gr.addColorStop(0.6, `rgba(0,0,0,${a * 0.85})`); gr.addColorStop(1, 'rgba(0,0,0,0)');
        dkg.fillStyle = gr; dkg.fillRect(x - r, y - r, r * 2, r * 2);
      };
      const px = player.x - cx, py = player.y - 8 - cy;
      if (lit) {
        hole(px, py, 26, 1);
        const d = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] }[player.dir];
        hole(px + d[0] * 26, py + d[1] * 22, 30, 1);
      } else hole(px, py, 11, 0.8);
    }
    bg.drawImage(darkCanvas, 0, 0);
    // 불빛이 가까이 가면 찾을 물건 위에 별이 떠오른다 (멀리 있으면 안 보인다)
    if (inDark(player.x, player.y) && st.flashlight && st.sparkle) {
      const d = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] }[player.dir];
      const lx = player.x + d[0] * 20, ly = player.y - 8 + d[1] * 18;
      for (const o of map.objects) {
        if (o.hidden || !st.sparkle(o) || !inDark(o.x + o.w / 2, o.y + o.h)) continue;
        const ox = o.x + o.w / 2, oy = o.y + o.h / 2;
        const dist = Math.hypot(ox - lx, oy - ly), R = 64;
        if (dist > R) continue;
        darkStar(ox - cx, o.y - cy - 2, Math.min(1, (R - dist) / 24));
      }
    }
  }
  function darkStar(x, y, a) {
    const k = (Math.sin(time * 5) + 1) / 2, r = 7 + k * 2;
    const gr = bg.createRadialGradient(x, y, 0, x, y, r * 2.2);
    gr.addColorStop(0, `rgba(255,236,120,${0.55 * a})`); gr.addColorStop(1, 'rgba(255,236,120,0)');
    bg.fillStyle = gr; bg.fillRect(x - r * 2.2, y - r * 2.2, r * 4.4, r * 4.4);
    bg.fillStyle = `rgba(255,224,74,${a})`;
    bg.beginPath();
    for (let i = 0; i < 10; i++) {
      const ang = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r;
      bg.lineTo(Math.round(x + Math.cos(ang) * rr), Math.round(y + Math.sin(ang) * rr));
    }
    bg.closePath(); bg.fill();
    bg.strokeStyle = `rgba(150,100,0,${a})`; bg.lineWidth = 1; bg.stroke();
  }

  // ---------------- 학교 밖 도로의 자동차 ----------------
  // map.traffic = [{ pts: [[x, y], ...] (px), gap: [최소, 최대] 초 }]  차는 선을 따라 달리다 끝에서 사라진다.
  const CAR_COLORS = ['#f4f4f4', '#2b2b33', '#9aa0a8', '#c4463a', '#3d6fe9', '#e8e8e8', '#5a6b7a', '#ffd23a'];
  let cars = [], carImgs = null, trafficMap = null;
  function laneLen(l) {
    if (l.len) return l.len;
    l.seg = []; l.len = 0;
    for (let i = 1; i < l.pts.length; i++) { const d = Math.hypot(l.pts[i][0] - l.pts[i - 1][0], l.pts[i][1] - l.pts[i - 1][1]); l.seg.push(d); l.len += d; }
    return l.len;
  }
  function lanePos(l, s) {
    let i = 0;
    while (i < l.seg.length - 1 && s > l.seg[i]) { s -= l.seg[i]; i++; }
    const [x0, y0] = l.pts[i], [x1, y1] = l.pts[i + 1], k = Math.min(1, s / l.seg[i]);
    return { x: x0 + (x1 - x0) * k, y: y0 + (y1 - y0) * k, a: Math.atan2(y1 - y0, x1 - x0) };
  }
  function updateTraffic(dt) {
    if (!map || !map.traffic) { cars = []; return; }
    if (trafficMap !== map) {
      // 맵에 들어올 때 도로마다 차를 몇 대 미리 깔아 둔다
      trafficMap = map; cars = [];
      if (!carImgs) carImgs = CAR_COLORS.map(c => Sprites.makeCarTop(c));
      for (const l of map.traffic) {
        laneLen(l); l.next = 1 + Math.random() * 3;
        for (let s = Math.random() * 120; s < l.len; s += 140 + Math.random() * 160) cars.push({ l, s, v: 34 + Math.random() * 14, img: carImgs[Math.floor(Math.random() * carImgs.length)] });
      }
    }
    for (const l of map.traffic) {
      l.next -= dt;
      if (l.next <= 0) {
        l.next = l.gap[0] + Math.random() * (l.gap[1] - l.gap[0]);
        if (!cars.some(c => c.l === l && c.s < 40)) cars.push({ l, s: 0, v: 34 + Math.random() * 14, img: carImgs[Math.floor(Math.random() * carImgs.length)] });
      }
    }
    // 앞차와 너무 가까우면 속도를 줄인다
    for (const c of cars) {
      const ahead = cars.filter(o => o.l === c.l && o.s > c.s).reduce((m2, o) => Math.min(m2, o.s - c.s), Infinity);
      const v = ahead < 34 ? 0 : ahead < 60 ? c.v * 0.5 : c.v;
      c.s += v * dt;
    }
    cars = cars.filter(c => c.s < c.l.len);
  }
  function drawTraffic(cx, cy) {
    if (!map || !map.traffic || trafficMap !== map) return;
    for (const c of cars) {
      const p = lanePos(c.l, c.s);
      const x = p.x - cx, y = p.y - cy;
      if (x < -30 || y < -30 || x > VW + 30 || y > VH + 30) continue;
      bg.save();
      bg.translate(Math.round(x), Math.round(y));
      bg.rotate(p.a + Math.PI / 2);
      bg.drawImage(c.img, -7, -12);
      bg.restore();
    }
  }

  // ---------------- 축하 꽃가루 ----------------
  function celebrate(x, y) {
    const cols = ['#ffd84a', '#ff6b8b', '#5ad6ff', '#7be07b', '#ffffff', '#b98cff'];
    for (let i = 0; i < 90; i++) {
      const a = Math.random() * Math.PI * 2, v = 30 + Math.random() * 70;
      confetti.push({ x, y: y - 10, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 80, life: 2.5 + Math.random() * 1.5, c: cols[i % cols.length], s: Math.random() < 0.5 ? 1 : 2 });
    }
  }
  function updateConfetti(dt) {
    if (!confetti.length) return;
    for (const p of confetti) { p.vy += 120 * dt; p.vx *= 0.99; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
    confetti = confetti.filter(p => p.life > 0);
  }
  function drawConfetti(cx, cy) {
    for (const p of confetti) { bg.fillStyle = p.c; bg.fillRect(Math.round(p.x - cx), Math.round(p.y - cy), p.s, p.s + (p.life * 10 % 2 > 1 ? 1 : 0)); }
  }

  // ---------------- 시간대 조명 (낮·노을·밤·새벽) ----------------
  let lightCanvas = null, lg = null;
  function applyLighting(cx, cy, st) {
    const ph = DayNight.phase();
    if (ph === 'day') return;
    const out = map.id === 'outdoor';
    if (ph === 'dawn' || ph === 'sunset') {
      bg.save();
      bg.globalCompositeOperation = 'multiply';
      bg.fillStyle = ph === 'sunset' ? (out ? '#ffb48a' : '#ffe3cf') : (out ? '#ffd2c8' : '#fff0ea');
      bg.fillRect(0, 0, VW, VH);
      bg.restore();
      return;
    }
    // 밤: 실내는 불이 켜져 있어 조금만 어둡게
    if (!out) { bg.fillStyle = 'rgba(20, 24, 70, 0.14)'; bg.fillRect(0, 0, VW, VH); return; }
    if (!lightCanvas) { lightCanvas = document.createElement('canvas'); lg = lightCanvas.getContext('2d'); }
    if (lightCanvas.width !== VW || lightCanvas.height !== VH) { lightCanvas.width = VW; lightCanvas.height = VH; }
    lg.globalCompositeOperation = 'source-over';
    lg.clearRect(0, 0, VW, VH);
    lg.fillStyle = 'rgba(6, 10, 38, 0.66)';
    lg.fillRect(0, 0, VW, VH);
    lg.globalCompositeOperation = 'destination-out';
    const hole = (x, y, r, a) => {
      const gr = lg.createRadialGradient(x, y, 0, x, y, r);
      gr.addColorStop(0, `rgba(0,0,0,${a})`); gr.addColorStop(1, 'rgba(0,0,0,0)');
      lg.fillStyle = gr; lg.fillRect(x - r, y - r, r * 2, r * 2);
    };
    hole(player.x - cx, player.y - 8 - cy, 78, 0.95);
    for (const n of npcs) {
      const mk = st.markFor ? st.markFor(n) : null;
      if (mk === '!' || mk === '?') hole(n.x - cx, n.y - 12 - cy, 30, 0.8);
    }
    for (const o of map.objects) if (st.sparkle && st.sparkle(o) && !inDark(o.x + o.w / 2, o.y + o.h)) hole(o.x + o.w / 2 - cx, o.y + o.h / 2 - cy, 22, 0.7);
    bg.drawImage(lightCanvas, 0, 0);
    // 건물 창문에 불 켜기
    for (const b of map.buildings) {
      (b.windows || []).forEach((w, i) => {
        if (((i * 7919 + b.x * 31) % 10) < 3) return;   // 일부 창문은 꺼 둔다
        const x = w.x - cx, y = w.y - cy;
        if (x < -12 || y < -12 || x > VW + 12 || y > VH + 12) return;
        bg.fillStyle = 'rgba(255, 214, 110, 0.18)'; bg.fillRect(x - 3, y - 3, w.w + 6, w.h + 6);
        bg.fillStyle = '#ffd36b'; bg.fillRect(x, y, w.w, w.h);
        bg.fillStyle = '#fff1b8'; bg.fillRect(x, y, 3, 2);
      });
    }
  }

  function targetPoint(t) {
    if (t.type === 'npc') return { x: t.npc.x, y: t.npc.y - 31 };
    return { x: t.obj.x + t.obj.w / 2, y: t.obj.y - 6 };
  }

  function drawShadow(x, y, w) {
    bg.fillStyle = 'rgba(0,0,0,0.22)';
    bg.beginPath();
    bg.ellipse(x, y, w, w * 0.4, 0, 0, Math.PI * 2);
    bg.fill();
  }

  function drawNpc(n, cx, cy, st) {
    const x = Math.round(n.x - cx), y = Math.round(n.y - cy);
    drawShadow(x, y - 1, 5);
    if (n.role === 'robot') {
      bg.drawImage(st.robotFixed ? robotImgs.fixed : robotImgs.broken, x - 8, y - 16);
    } else {
      const f = n.moving ? Math.floor(n.anim) % 2 : 0;
      bg.drawImage(n.frames[n.dir][f], x - 8, y - 16);
    }
    const mark = st.markFor ? st.markFor(n) : null;
    if (mark === 'new') {
      // 아직 도감에 없는 친구: 말풍선
      const by = y - 27 + Math.round(Math.sin(time * 3 + n.x) * 1);
      bg.fillStyle = '#ffffff'; bg.fillRect(x - 4, by, 9, 6); bg.fillRect(x - 3, by - 1, 7, 8); bg.fillRect(x - 1, by + 7, 2, 1);
      bg.fillStyle = '#2b2233'; bg.fillRect(x - 2, by + 3, 1, 1); bg.fillRect(x, by + 3, 1, 1); bg.fillRect(x + 2, by + 3, 1, 1);
    } else if (mark) {
      const by = y - 30 + Math.round(Math.sin(time * 5) * 1.5);
      bg.fillStyle = mark === '!' ? '#ffd84a' : '#7fd3ff';
      bg.fillRect(x - 3, by - 1, 7, 9);
      bg.fillStyle = '#2b2233';
      if (mark === '!') { bg.fillRect(x, by + 1, 1, 4); bg.fillRect(x, by + 6, 1, 1); }
      else { bg.fillRect(x - 1, by + 1, 3, 1); bg.fillRect(x + 1, by + 2, 1, 2); bg.fillRect(x, by + 4, 1, 1); bg.fillRect(x, by + 6, 1, 1); }
    }
  }

  function drawPlayer(cx, cy) {
    const x = Math.round(player.x - cx), y = Math.round(player.y - cy);
    drawShadow(x, y - 1, Math.max(3, 5 - player.z / 10));
    const f = player.moving ? Math.floor(player.anim) % 2 : 0;
    const img = player.frames[player.dir][f];
    const top = y - 16 - Math.round(player.z);
    if (player.spin > 0) {
      const a = (1 - player.spin / SPIN_TIME) * Math.PI * 2;
      bg.save();
      bg.translate(x, top + 8);
      bg.rotate(a);
      bg.drawImage(img, -8, -8);
      bg.restore();
    } else {
      bg.drawImage(img, x - 8, top);
    }
  }

  function sparkle(x, y) {
    const k = (Math.sin(time * 6) + 1) / 2;
    bg.fillStyle = `rgba(255,240,140,${0.5 + k * 0.5})`;
    const s = 1 + Math.round(k * 2);
    bg.fillRect(Math.round(x) - s, Math.round(y) - 4, s * 2 + 1, 1);
    bg.fillRect(Math.round(x), Math.round(y) - 4 - s, 1, s * 2 + 1);
  }

  function text(str, x, y, size, color, stroke, bold) {
    sg.font = `${bold ? 700 : 600} ${Math.round(size)}px "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif`;
    if (stroke) { sg.lineWidth = size / 4; sg.strokeStyle = stroke; sg.strokeText(str, x, y); }
    sg.fillStyle = color;
    sg.fillText(str, x, y);
  }
  function textTag(str, x, y, size, color = '#ffffff', bgc = 'rgba(30,24,40,0.72)') {
    sg.font = `700 ${Math.round(size)}px "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif`;
    const w = sg.measureText(str).width + size * 0.9;
    const h = size * 1.5;
    sg.fillStyle = bgc;
    roundRect(x - w / 2, y - h / 2, w, h, h / 3);
    sg.fillStyle = color;
    sg.fillText(str, x, y + size * 0.05);
  }
  function roundRect(x, y, w, h, r) {
    sg.beginPath();
    sg.moveTo(x + r, y); sg.arcTo(x + w, y, x + w, y + h, r); sg.arcTo(x + w, y + h, x, y + h, r);
    sg.arcTo(x, y + h, x, y, r); sg.arcTo(x, y, x + w, y, r); sg.closePath(); sg.fill();
  }

  return {
    init, newGame, stop, facePlayer, zoom, zoomInfo, celebrate, inDark,
    setSpeed(k) { speedK = k || 1; },
    setLook(charIdx) { if (player) player.frames = Sprites.makeChar(Sprites.PLAYER_PALETTES[charIdx]); },
    // 이어하기: 저장된 맵·위치로 옮긴다
    restore(mapId, x, y) { if (!maps[mapId]) return; loadMap(mapId); player.x = x; player.y = y; snapCamera(); fade = 1; fadeDir = -1; },
    refreshMinimap() { for (const k in mmCache) delete mmCache[k]; },
    get map() { return map; },
    get maps() { return maps; },
    get player() { return player; },
    get npcsAll() { return allNpcs; },
    isTouch: () => touchMode,
    setTouch: v => { touchMode = v; },
    clearInput: clearPressed,
    // 테스트용
    _teleport(mapId, tx, ty) { loadMap(mapId); player.x = tx * T + 8; player.y = ty * T + 12; safePos = null; snapCamera(); },
    _press(k) { pressed[k] = true; }
  };
})();

// ===== ui.js =====
// 화면 위에 겹쳐 보이는 HTML 화면들: 시작, 대화창, 퀴즈, 수첩, 랭킹, 클리어, 안내
const UI = (() => {
  const $ = id => document.getElementById(id);
  let dialogState = null;
  let modalStack = 0;
  let closedAt = 0;

  function modalOpen() {
    return !!dialogState || modalStack > 0 || performance.now() - closedAt < 220;
  }
  function markClosed() {
    closedAt = performance.now();
    setTimeout(() => Game.clearInput(), 0);
  }

  // ---------- 대화창 ----------
  function dialog(lines, onDone) {
    if (!lines || !lines.length) { onDone && onDone(); return; }
    const el = $('dialog');
    dialogState = { lines, i: 0, shown: 0, full: '', onDone, timer: null };
    el.classList.remove('hidden');
    showLine();
  }
  function showLine() {
    const st = dialogState;
    const line = st.lines[st.i];
    $('dlgWho').textContent = line.who || '';
    $('dlgWho').style.display = line.who ? '' : 'none';
    st.full = line.text;
    st.shown = 0;
    $('dlgText').textContent = '';
    $('dlgNext').style.visibility = 'hidden';
    clearInterval(st.timer);
    st.timer = setInterval(() => {
      st.shown += 2;
      $('dlgText').textContent = st.full.slice(0, st.shown);
      if (st.shown % 6 === 0) Sound.sfx('talk');
      if (st.shown >= st.full.length) { clearInterval(st.timer); $('dlgNext').style.visibility = 'visible'; }
    }, 30);
  }
  function advance() {
    const st = dialogState;
    if (!st) return;
    if (st.shown < st.full.length) {
      st.shown = st.full.length;
      clearInterval(st.timer);
      $('dlgText').textContent = st.full;
      $('dlgNext').style.visibility = 'visible';
      return;
    }
    st.i++;
    if (st.i < st.lines.length) { showLine(); return; }
    clearInterval(st.timer);
    $('dialog').classList.add('hidden');
    dialogState = null;
    markClosed();
    st.onDone && st.onDone();
  }

  // ---------- 공용 패널 ----------
  function openPanel(html, cls) {
    const el = $('modal');
    $('modalBody').innerHTML = html;
    $('modalBody').className = 'panel ' + (cls || '');
    el.classList.remove('hidden');
    modalStack = 1;
    return $('modalBody');
  }
  function closePanel() {
    $('modal').classList.add('hidden');
    $('modalBody').innerHTML = '';
    modalStack = 0;
    markClosed();
  }

  // ---------- 힌트 ----------
  // hint = { label(): string, use(): boolean, bought: boolean, text: string, effect?: fn }
  function hintArea(hint) {
    if (!hint) return '';
    return `<div class="hint-area"><button type="button" class="hint-btn" id="hintBtn">💡 힌트 <small id="hintLab"></small></button><div class="hint-text hidden" id="hintText"></div></div>`;
  }
  function bindHint(body, hint) {
    if (!hint) return;
    const btn = body.querySelector('#hintBtn');
    const show = () => {
      btn.disabled = true;
      body.querySelector('#hintLab').textContent = '사용함';
      if (hint.text) { const t = body.querySelector('#hintText'); t.textContent = hint.text; t.classList.remove('hidden'); }
      hint.effect && hint.effect(body);
    };
    body.querySelector('#hintLab').textContent = hint.label();
    if (hint.bought) return show();
    btn.addEventListener('click', () => { if (hint.use()) { Sound.sfx('pick'); show(); } });
  }

  // ---------- 퀴즈 ----------
  // q: { format: 'choice'|'text'|'ox', question, choices, correct, answers, explain }
  function quiz(q, who, h) {
    let html = `<div class="quiz-who">${Util.esc(who)}</div>`;
    if (h.progress) {
      const { i, n } = h.progress;
      html += `<div class="quiz-prog"><span>문제 <b>${i + 1}</b> / ${n}</span><span class="dots">${Array.from({ length: n }, (_, k) => `<i class="${k < i ? 'ok' : k === i ? 'cur' : ''}"></i>`).join('')}</span></div>`;
      if (h.rule) html += `<div class="quiz-rule">${Util.esc(h.rule)}</div>`;
    }
    html += `<div class="quiz-q">${Util.esc(q.question)}</div>`;
    html += hintArea(h.hint);
    let order = [];
    if (q.format === 'choice') {
      order = Util.shuffle(q.choices.map((c, i) => i).filter(i => q.choices[i] && String(q.choices[i]).trim()));
      html += '<div class="choices">' + order.map((ci, k) =>
        `<button class="choice" data-i="${ci}"><span class="num">${k + 1}</span>${Util.esc(q.choices[ci])}</button>`).join('') + '</div>';
    } else if (q.format === 'ox') {
      html += '<div class="ox"><button class="choice oxbtn" data-v="O">O</button><button class="choice oxbtn" data-v="X">X</button></div>';
    } else {
      html += `<form class="answer" autocomplete="off"><input id="quizInput" type="text" maxlength="20" placeholder="정답을 입력하세요" enterkeyhint="done"><button type="submit" class="primary">확인</button></form>`;
    }
    html += '<div class="quiz-feedback" id="quizFb"></div><div class="explain hidden" id="quizEx"></div><div class="row end" id="quizRow"><button class="ghost" id="quizClose">나중에 풀기</button></div>';
    const body = openPanel(html, 'quiz');
    body.dataset.qi = h.progress ? h.progress.i : 0;
    bindHint(body, h.hint);
    const fb = $('quizFb');
    let done = false;
    const result = ok => {
      if (done) return;
      if (ok) {
        done = true;
        Sound.sfx('correct');
        body.querySelectorAll('.choice, .answer button, .answer input, #hintBtn').forEach(el => { el.disabled = true; });
        const next = () => { if (!h.keepOpen) closePanel(); h.onCorrect(); };
        if (q.explain) {
          fb.textContent = '정답!';
          fb.className = 'quiz-feedback ok';
          const ex = $('quizEx');
          ex.innerHTML = `<b>해설</b> ${Util.esc(q.explain)}`;
          ex.classList.remove('hidden');
          $('quizRow').innerHTML = `<button class="primary" id="quizNext">${h.keepOpen ? '다음 문제 ▶' : '확인'}</button>`;
          $('quizNext').addEventListener('click', next);
          setTimeout(() => { const b = $('quizNext'); if (b && !Game.isTouch()) b.focus(); }, 30);
        } else {
          fb.textContent = h.keepOpen ? '정답! 다음 문제로~' : '정답!';
          fb.className = 'quiz-feedback ok';
          setTimeout(next, h.keepOpen ? 700 : 650);
        }
      } else {
        Sound.sfx('wrong');
        fb.className = 'quiz-feedback bad';
        body.classList.remove('shake'); void body.offsetWidth; body.classList.add('shake');
        if (h.reset) {
          // 틀리면 1번 문제부터 다시
          done = true;
          fb.textContent = h.restartLine || '틀렸어요! 처음부터 다시!';
          body.querySelectorAll('.choice, .answer button, .answer input').forEach(el => { el.disabled = true; });
          setTimeout(() => { if ($('modalBody') === body && modalStack) h.reset(); }, 1400);
        } else {
          fb.textContent = h.wrongLine();
        }
      }
    };
    body.querySelectorAll('.choice').forEach(b => b.addEventListener('click', () => {
      if (q.format === 'ox') result(Util.normalize(b.dataset.v) === Util.normalize(q.answers[0]));
      else {
        const ok = Number(b.dataset.i) === Number(q.correct);
        if (!ok) b.classList.add('wrong');
        result(ok);
      }
    }));
    const form = body.querySelector('form');
    if (form) {
      const input = $('quizInput');
      form.addEventListener('submit', e => {
        e.preventDefault();
        const v = Util.normalize(input.value);
        if (!v) return;
        result(q.answers.some(a => Util.normalize(a) === v));
        if (!done) input.select();
      });
      setTimeout(() => { if (!Game.isTouch()) input.focus(); }, 50);
    }
    $('quizClose').addEventListener('click', () => { closePanel(); h.onClose && h.onClose(); });
    body._keys = e => {
      if (done) { if ((e.key === 'Enter' || e.key === ' ') && $('quizNext')) { e.preventDefault(); $('quizNext').click(); } return; }
      if (q.format === 'choice' && /^[1-4]$/.test(e.key)) {
        const btn = body.querySelectorAll('.choice')[Number(e.key) - 1];
        if (btn && !btn.disabled) btn.click();
      }
      if (q.format === 'ox' && /^[oOxXㅐㅌ]$/.test(e.key)) {
        const v = /[oOㅐ]/.test(e.key) ? 'O' : 'X';
        body.querySelector(`.oxbtn[data-v="${v}"]`).click();
      }
    };
  }

  // 문제 힌트 효과: 객관식은 오답 2개 지우기, 주관식은 첫 글자, OX는 설명
  function quizHintEffect(q) {
    return body => {
      const t = body.querySelector('#hintText');
      if (q.format === 'choice') {
        const wrong = Util.shuffle(Array.from(body.querySelectorAll('.choice')).filter(b => Number(b.dataset.i) !== Number(q.correct))).slice(0, 2);
        wrong.forEach(b => { b.disabled = true; b.classList.add('gone'); });
        t.textContent = '오답 2개를 지웠어요!';
      } else if (q.format === 'text') {
        const a = String(q.answers[0] || '');
        t.textContent = `정답은 ${a.length}글자, 첫 글자는 "${a[0] || ''}"예요.`;
      } else {
        t.textContent = q.hintText || '천천히 다시 읽어 보고, 우리 생활에서 어떻게 해야 안전하고 바른지 생각해 보세요.';
      }
      t.classList.remove('hidden');
    };
  }

  // 여러 문제를 한 번에 맞혀야 하는 퀴즈 (틀리면 처음부터, 문제는 다시 뽑는다)
  function quizSet(list, who, h) {
    let cur = list;
    const run = i => quiz(cur[i], who, {
      progress: { i, n: cur.length }, rule: h.rule, restartLine: h.restartLine, wrongLine: h.wrongLine,
      keepOpen: i < cur.length - 1,
      hint: h.hintFor ? h.hintFor(cur[i]) : null,
      onCorrect: () => (i + 1 < cur.length ? run(i + 1) : h.onCorrect()),
      reset: () => { if (h.repick) cur = h.repick(); run(0); },
      onClose: h.onClose
    });
    run(0);
  }

  // ---------- 알림 ----------
  let toastTimer = null;
  function toast(msg) {
    const el = $('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
  }

  // ---------- 상단 정보 ----------
  function hud(s) {
    $('hudTime').innerHTML = `<small>${s.label}</small>${s.time}`;
    $('hudTime').parentElement.classList.toggle('warn', !!s.warn);
    $('hudPlace').textContent = s.place;
    const mi = s.mission || { html: '', pill: '' };
    const key = mi.html + '|' + mi.pill;
    const box = $('hudNext');
    if (box.dataset.key !== key) {
      box.dataset.key = key;
      box.innerHTML = `<span class="star"></span><span class="mtext">${mi.html}</span>${mi.pill ? `<span class="mpill">${mi.pill}</span>` : ''}`;
    }
    const parts = $('hudParts');
    const pk = s.parts + '/' + s.total + '/' + s.tokens;
    if (parts.dataset.n !== pk) {
      parts.dataset.n = pk;
      parts.innerHTML = `<span class="tok" title="힌트 토큰">💡${s.tokens}</span>` + Array.from({ length: s.total }, (_, i) => `<span class="slot ${i < s.parts ? 'on' : ''}"></span>`).join('');
    }
  }
  function setTalkButton(label) {
    const b = $('btnTalk');
    if (label) { b.textContent = label; b.classList.remove('off'); }
    else { b.textContent = '대화'; b.classList.add('off'); }
  }
  function setSoundButton(muted) {
    const icon = '<svg viewBox="0 0 20 20"><path d="M3 7h4l5-4v14l-5-4H3z" fill="currentColor"/>' +
      (muted ? '<path d="M14 7l5 6M19 7l-5 6" stroke="currentColor" stroke-width="2.2"/>' : '<path d="M14.5 6.5a5 5 0 010 7M16.5 4a8.5 8.5 0 010 12" fill="none" stroke="currentColor" stroke-width="2"/>') + '</svg>';
    for (const id of ['btnSound', 'btnSoundTitle']) {
      const b = $(id);
      if (!b) continue;
      b.innerHTML = icon + (id === 'btnSoundTitle' ? (muted ? '소리 꺼짐' : '소리 켜짐') : '');
      b.title = muted ? '소리 켜기' : '소리 끄기';
      b.classList.toggle('muted', muted);
    }
  }

  // ---------- 도감 ----------
  function dex(entries, known, total) {
    const n = entries.filter(e => known.has(e.id)).length;
    const html = `<div class="dex-head"><h2>학교 도감 ${n}/${total}</h2><div class="dex-bar"><span style="width:${Math.round(n / total * 100)}%"></span></div></div>
      <p class="muted small" style="margin:0 0 8px">학교에서 만난 사람과 이야기하면 도감에 등록돼요. 말풍선이 떠 있는 친구는 아직 못 만난 친구예요.</p>
      <div class="dex-grid">${entries.map((e, i) => known.has(e.id)
        ? `<div class="dex-card"><canvas data-i="${i}" width="16" height="16"></canvas><div><div class="nm">${Util.esc(e.name)}</div><div class="pl">${Util.esc(e.place)}</div></div><div class="pf">${Util.esc(e.profile || '')}</div></div>`
        : `<div class="dex-card unknown"><canvas data-i="${i}" data-dark="1" width="16" height="16"></canvas><div><div class="nm">???</div><div class="pl">${Util.esc(e.place)} 어딘가</div></div><div class="pf">아직 만나지 못했어요.</div></div>`).join('')}</div>
      <div class="row end"><button class="primary" id="dexClose">닫기</button></div>`;
    const body = openPanel(html, 'dexp');
    body.querySelectorAll('canvas').forEach(c => {
      const e = entries[Number(c.dataset.i)];
      const g = c.getContext('2d');
      g.imageSmoothingEnabled = false;
      const img = e.id === 'robot' ? Sprites.makeRobot(false) : (e.npc && e.npc.frames ? e.npc.frames.down[0] : null);
      if (!img) return;
      g.drawImage(img, 0, 0);
      if (c.dataset.dark) { g.globalCompositeOperation = 'source-in'; g.fillStyle = '#6b5f4a'; g.fillRect(0, 0, 16, 16); }
    });
    $('dexClose').addEventListener('click', closePanel);
  }

  // ---------- 수첩 ----------
  function notebook(nb) {
    const E = Util.esc;
    const sec = (title, items, empty) =>
      `<h3>${title}</h3>` + (items.length ? '<ul>' + items.map(i => `<li>${i}</li>`).join('') + '</ul>' : `<p class="muted">${empty}</p>`);
    const html = `<h2>탐험 수첩</h2>
      <div class="nb-top"><span class="nb-chip">💡 힌트 토큰 <b>${nb.tokens}</b>개</span><span class="nb-chip">🌼 ${E(nb.collectName)} <b>${nb.stars}</b>/${nb.starTotal}</span>${nb.penalty ? `<span class="nb-chip bad">벌점 +${Math.round(nb.penalty / 60000)}분</span>` : ''}</div>
      ${sec('모은 부품 (' + nb.parts.length + '/' + nb.total + ')', nb.parts.map(p => E(p)), '아직 모은 부품이 없어요.')}
      ${sec('가방', nb.items.map(it => `<b>${E(it.name)}</b> · ${E(it.desc)}`), '아직 가방이 비어 있어요.')}
      ${sec('찾은 단서·쪽지', nb.clues.map(c => E(c)), '아직 찾은 단서가 없어요.')}
      ${sec('받은 힌트', nb.hints.map(h => `<b>${E(h.title)}</b> · ${E(h.text)}`), '서브 미션을 깨거나 💡 힌트를 쓰면 여기에 적혀요.')}
      <div class="row end"><button class="primary" id="nbClose">닫기</button></div>`;
    openPanel(html, 'notebook');
    $('nbClose').addEventListener('click', closePanel);
  }

  // ---------- i 팻말 ----------
  function sign(title, text) {
    openPanel(`<div class="sign-head"><span class="sign-i">i</span><h2>${Util.esc(title)}</h2></div><div class="sign-text">${Util.esc(text)}</div><div class="row end"><button class="primary" id="sgClose">닫기</button></div>`, 'signp');
    $('sgClose').addEventListener('click', closePanel);
  }

  // ---------- 미션 순서도 ----------
  // nodes: [[{ id, label, state: 'done'|'open'|'lock', focus }]]
  let flowKey = '';
  function flow(stages, onPick) {
    const key = JSON.stringify(stages);
    if (key === flowKey) return;
    flowKey = key;
    const el = $('flowList');
    el.innerHTML = stages.map((st, si) => `${si ? '<div class="fl-arrow">▼</div>' : ''}<div class="fl-stage ${st.length > 1 ? 'multi' : ''}">${st.map(n =>
      `<button type="button" class="fl-node ${n.state} ${n.focus ? 'focus' : ''}" data-id="${n.id}"><span class="fl-ic">${n.state === 'done' ? '✓' : n.state === 'lock' ? '🔒' : n.icon || '!'}</span><span class="fl-lab">${Util.esc(n.label)}</span></button>`).join('')}</div>`).join('');
    el.querySelectorAll('.fl-node').forEach(b => b.addEventListener('click', () => onPick(b.dataset.id)));
  }

  // ---------- 고르기 창 (이어하기 등) ----------
  function choose(title, msg, buttons) {
    openPanel(`<h2>${Util.esc(title)}</h2><p>${msg}</p><div class="row center">${buttons.map((b, i) => `<button class="${b.cls || 'ghost'}" data-b="${i}">${Util.esc(b.label)}</button>`).join('')}</div>`, 'confirm');
    $('modalBody').querySelectorAll('[data-b]').forEach(el => el.addEventListener('click', () => { closePanel(); buttons[Number(el.dataset.b)].cb(); }));
  }

  // ---------- 랭킹 ----------
  async function ranking(group, onClose) {
    const f = { g: group || 'low', mode: 'all' };
    const render = async () => {
      const rows = await Store.getRanking(f.g, 30, { mode: f.mode });
      const what = '모든 미션을 깨는 데 걸린 시간 (학생별 최고 기록)';
      const body = rows.length
        ? '<table class="rank"><thead><tr><th>순위</th><th>이름</th><th>모드</th><th>기록</th></tr></thead><tbody>' +
          rows.map(r => `<tr class="${r.rank <= 3 ? 'top' + r.rank : ''}"><td>${r.rank <= 3 ? ['🥇', '🥈', '🥉'][r.rank - 1] : r.rank}</td><td>${Util.esc(r.label)}</td><td class="mode">${r.mode === 'm10' ? '10분' : '30분'}</td><td>${Util.formatTime(r.bestMs)}</td></tr>`).join('') +
          '</tbody></table>'
        : '<p class="muted center empty">아직 기록이 없어요. 첫 번째 주인공이 되어 보세요!</p>';
      const seg = (key, items) => `<div class="rk-seg" data-k="${key}">${items.map(([v, l]) => `<button data-v="${v}" class="${String(f[key]) === String(v) ? 'on' : ''}">${l}</button>`).join('')}</div>`;
      const html = `<h2>명예의 전당</h2>
        <div class="tabs rk-group">${[['low', '저학년 <small>1~3학년</small>'], ['high', '고학년 <small>4~6학년</small>']].map(([v, l]) => `<button data-g="${v}" class="${f.g === v ? 'on' : ''}">${l}</button>`).join('')}</div>
        <div class="rk-row"><span class="rk-lab">모드</span>${seg('mode', [['all', '전체'], ['m30', '30분 미션'], ['m10', '10분 미션']])}</div>
        <p class="rk-what">${what}</p>
        <div class="rank-wrap">${body}</div>
        ${Store.mode === 'local' ? '<p class="muted small">시험 버전: 지금은 이 기기에서 한 기록만 보여요.</p>' : ''}
        <div class="row end"><button class="primary" id="rkClose">닫기</button></div>`;
      openPanel(html, 'ranking');
      const body2 = $('modalBody');
      body2.querySelectorAll('.rk-group button').forEach(b => b.addEventListener('click', () => { f.g = b.dataset.g; render(); }));
      body2.querySelectorAll('.rk-seg').forEach(sg => sg.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
        f[sg.dataset.k] = b.dataset.v;
        render();
      })));
      $('rkClose').addEventListener('click', () => { closePanel(); onClose && onClose(); });
    };
    render();
  }

  // ---------- 캐릭터 소개 ----------
  function character(img, name, modeLabel, onOk, total) {
    const html = `<h2>${Util.esc(name)} 탐험가, 준비됐나요?</h2>
      <div class="char-box"><canvas id="charPreview" width="16" height="16"></canvas></div>
      <p class="center">${Util.esc(modeLabel)} · 로봇 교장선생님의 부품 ${total || 7}개를 모아 재부팅해 주세요!</p>
      <div class="howto">
        <div><b>이동</b> ${Game.isTouch() ? '왼쪽 아래 조이스틱' : '방향키'}</div>
        <div><b>점프</b> ${Game.isTouch() ? '점프 버튼' : '스페이스바'} · 공중에서 한 번 더 누르면 한 바퀴!</div>
        <div><b>대화</b> ${Game.isTouch() ? '가까이 가서 대화 버튼' : '가까이 가서 E키 또는 클릭'}</div>
        <div><b>길 찾기</b> 왼쪽 순서도에서 미션을 누르면 노란 별이 안내해요</div>
      </div>
      <div class="row center"><button class="primary big" id="charOk">탐험 시작!</button></div>`;
    openPanel(html, 'character');
    const c = $('charPreview');
    const g = c.getContext('2d');
    g.imageSmoothingEnabled = false;
    g.drawImage(img, 0, 0);
    $('charOk').addEventListener('click', () => { closePanel(); onOk(); });
  }

  // ---------- 클리어 ----------
  function clear(res, h) {
    const explore = res.status === 'explore';
    const rewards = (res.rewards || []).map(r => `<span class="nb-chip">${Util.esc(r)}</span>`).join('');
    const html = `<div class="confetti-top">🎉</div><h2 class="center">미션 클리어! 로봇 교장선생님을 구했어요!</h2>
      <div class="result">
        <div class="muted">${Util.esc(res.modeLabel || '')}</div>
        <div class="big-time">${res.durationMs != null ? Util.formatTime(res.durationMs) : '--:--'}</div>
        ${res.penaltyMs ? `<div class="muted small">힌트 벌점 +${Math.round(res.penaltyMs / 60000)}분 포함</div>` : ''}
        ${explore ? '<p class="muted">탐험 모드 기록은 랭킹에 오르지 않아요. 30분·10분 미션에 도전해 보세요!</p>' : `
        <div>내 최고 기록 <b>${res.bestMs != null ? Util.formatTime(res.bestMs) : '--:--'}</b></div>
        <div>${Util.esc(Util.groupLabel(res.group))} · ${Util.esc(res.modeLabel || '')} 순위 <b>${res.rank != null ? res.rank + '위' : '-'}</b> <span class="muted">(${res.total}명 중)</span></div>`}
        ${res.status === 'offline' ? '<p class="bad">서버에 연결하지 못해 이번 기록은 랭킹에 오르지 못했어요.</p>' : res.status !== 'cleared' && !explore ? '<p class="bad">기록 확인에 실패해 랭킹에 오르지 못했어요.</p>' : ''}
        ${rewards ? `<div class="rewards">${rewards}</div>` : ''}
      </div>
      <div class="row center"><button class="ghost" id="clHome">처음으로</button><button class="ghost" id="clRank">랭킹 보기</button><button class="primary" id="clAgain">다시 도전</button></div>`;
    openPanel(html, 'clear');
    $('clHome').addEventListener('click', () => { closePanel(); h.onHome(); });
    $('clRank').addEventListener('click', () => { closePanel(); h.onRanking(); });
    $('clAgain').addEventListener('click', () => { closePanel(); h.onAgain(); });
  }

  function timeUp(info, h) {
    const html = `<h2>시간 종료!</h2>
      <div class="result">
        <div class="muted">${Util.esc(info.modeLabel)}</div>
        <div class="big-time">${info.parts} / ${info.total}</div>
        <div>부품을 ${info.parts}개 모았어요. 조금만 더 하면 로봇 교장선생님을 구할 수 있어요!</div>
      </div>
      <div class="row center"><button class="ghost" id="tuHome">처음으로</button><button class="primary" id="tuAgain">다시 도전</button></div>`;
    openPanel(html, 'clear');
    $('tuHome').addEventListener('click', () => { closePanel(); h.onHome(); });
    $('tuAgain').addEventListener('click', () => { closePanel(); h.onAgain(); });
  }

  function closeAll() {
    if (dialogState) { clearInterval(dialogState.timer); dialogState = null; $('dialog').classList.add('hidden'); }
    if (modalStack) closePanel();
  }

  function confirmBox(msg, onYes) {
    openPanel(`<p class="center">${Util.esc(msg)}</p><div class="row center"><button class="ghost" id="cfNo">취소</button><button class="primary" id="cfYes">확인</button></div>`, 'confirm');
    $('cfNo').addEventListener('click', closePanel);
    $('cfYes').addEventListener('click', () => { closePanel(); onYes(); });
  }

  // 키보드: 대화 넘기기, 퀴즈 숫자키
  window.addEventListener('keydown', e => {
    if (dialogState && (e.key === ' ' || e.key === 'Enter' || e.key === 'e' || e.key === 'E')) {
      e.preventDefault();
      advance();
      return;
    }
    const body = $('modalBody');
    if (modalStack && body && body._keys && !(e.target && e.target.tagName === 'INPUT')) body._keys(e);
    if (modalStack && e.key === 'Escape') {
      const close = body.querySelector('#quizClose, #nbClose, #rkClose, #dexClose, #mgClose, #sgClose');
      if (close) close.click();
    }
  });

  function bind() {
    $('dialog').addEventListener('click', advance);
  }

  return { modalOpen, dialog, quiz, quizSet, quizHintEffect, hintArea, bindHint, openPanel, notebook, sign, flow, choose, toast, hud, setTalkButton, setSoundButton, dex, ranking, character, clear, timeUp, closeAll, confirmBox, closePanel, bind, isDialog: () => !!dialogState };
})();

// ===== minigames.js =====
// 미니게임 화면: AI 이름표 고치기, 암호 풀기, 로봇 코딩, 정렬 자물쇠, 전구 블록코딩
// 모두 같은 틀(누가 · 제목 · 설명 · 힌트 · 게임 · 결과 · 버튼)을 쓴다.
// h = { hint, onSuccess, onClose }  (hint는 UI.hintArea 참고)
const Mini = (() => {
  const E = Util.esc;
  const $ = id => document.getElementById(id);

  function frame(cls, who, title, intro, inner, h, extraBtns) {
    const html = `<div class="quiz-who">${E(who)}</div>
      <h2 class="mg-title">${E(title)}</h2>
      <p class="mg-intro">${E(intro)}</p>
      ${UI.hintArea(h.hint)}
      <div class="mg-body">${inner}</div>
      <div class="quiz-feedback" id="mgFb"></div>
      <div class="row mg-btns">${extraBtns || ''}<span class="sp"></span><button class="ghost" id="mgClose">나중에 하기</button></div>`;
    const body = UI.openPanel(html, 'mini mg-' + cls);
    UI.bindHint(body, h.hint);
    $('mgClose').addEventListener('click', () => { UI.closePanel(); h.onClose && h.onClose(); });
    return body;
  }
  function fb(text, ok) {
    const el = $('mgFb');
    if (!el) return;
    el.textContent = text;
    el.className = 'quiz-feedback ' + (ok ? 'ok' : 'bad');
    if (!ok) {
      const body = $('modalBody');
      body.classList.remove('shake'); void body.offsetWidth; body.classList.add('shake');
    }
  }
  function success(text, h, delay) {
    Sound.sfx('correct');
    fb(text, true);
    document.querySelectorAll('#modalBody button').forEach(b => { b.disabled = true; });
    setTimeout(() => { UI.closePanel(); h.onSuccess(); }, delay || 1300);
  }

  // ---------- 1) AI 이름표 고치기 (라벨링) ----------
  function label(d, who, h) {
    const labels = d.items.map(it => it.s);
    const card = (it, i) => `<button type="button" class="lb-card" data-i="${i}"><span class="emo">${it.e}</span><span class="lb-tag t${labels[i]}">${E(d.cats[labels[i]])}</span></button>`;
    const inner = `<div class="lb-legend">${d.cats.map((c, k) => `<span class="lb-tag t${k}">${E(c)}</span>`).join('')}<span class="muted small">이름표를 누르면 바뀌어요</span></div>
      <div class="lb-grid">${d.items.map(card).join('')}</div>
      <div class="lb-train hidden" id="lbTrain"><span>AI가 학습하는 중…</span><div class="bar"><i></i></div></div>`;
    const body = frame('label', who, 'AI 다시 학습시키기', d.intro, inner, h, '<button class="primary" id="lbGo">학습시키기</button>');
    body.querySelector('.lb-grid').addEventListener('click', e => {
      const b = e.target.closest('.lb-card');
      if (!b || b.disabled) return;
      const i = Number(b.dataset.i);
      labels[i] = (labels[i] + 1) % d.cats.length;
      b.outerHTML = card(d.items[i], i);
      Sound.sfx('talk');
      $('mgFb').textContent = '';
    });
    $('lbGo').addEventListener('click', () => {
      const wrong = d.items.filter((it, i) => labels[i] !== it.a).length;
      $('lbGo').disabled = true;
      $('lbTrain').classList.remove('hidden');
      setTimeout(() => {
        if (!$('lbTrain')) return;
        $('lbTrain').classList.add('hidden');
        $('lbGo').disabled = false;
        if (!wrong) return success(`AI 시험 결과: ${d.items.length}문제 모두 정답! AI가 제대로 배웠어요.`, h);
        Sound.sfx('wrong');
        fb(d.cats.length <= 2 ? `아직 틀린 이름표가 ${wrong}개 있어요. 틀린 데이터로 배운 AI는 틀리게 판단해요!` : `AI 시험 점수: ${d.items.length - wrong}/${d.items.length}점. 이름표를 다시 꼼꼼히 확인해 보세요.`, false);
      }, 1000);
    });
  }

  // ---------- 2) 암호 풀기 ----------
  function code(d, who, h) {
    const binary = typeof d.table[0].k === 'number';
    const slots = d.code.map(() => null);
    const sigHtml = c => binary
      ? `<div class="cd-sig bin">${c.split('').map(b => `<i class="${b === '1' ? 'on' : ''}"></i>`).join('')}<small>${c}</small></div>`
      : `<div class="cd-sig sym s${symIdx(c)}">${E(c)}</div>`;
    function symIdx(c) { return d.table.findIndex(t => t.k === c); }
    const render = () => {
      $('cdSlots').innerHTML = d.code.map((c, i) => `<div class="cd-col">${sigHtml(c)}<div class="cd-slot ${slots[i] ? 'fill' : ''} ${slots.indexOf(null) === i ? 'cur' : ''}">${slots[i] ? E(slots[i]) : '?'}</div></div>`).join('');
    };
    const inner = `${binary ? '<div class="cd-place">전구 자리값: <b>8</b> · <b>4</b> · <b>2</b> · <b>1</b></div>' : ''}
      <div class="cd-slots" id="cdSlots"></div>
      <div class="cd-table-title">암호표</div>
      <div class="cd-table">${d.table.map((t, i) => `<button type="button" class="cd-key" data-v="${E(t.v)}"><span class="k ${binary ? '' : 'sym s' + i}">${E(t.k)}</span><span class="eq">=</span><span class="v">${E(t.v)}</span></button>`).join('')}</div>`;
    frame('code', who, '암호 신호 풀기', d.intro, inner, h, '<button class="ghost" id="cdBack">⌫ 지우기</button><button class="primary" id="cdGo">확인</button>');
    render();
    document.querySelector('.cd-table').addEventListener('click', e => {
      const b = e.target.closest('.cd-key');
      if (!b) return;
      const i = slots.indexOf(null);
      if (i < 0) return;
      slots[i] = b.dataset.v;
      Sound.sfx('talk');
      $('mgFb').textContent = '';
      render();
    });
    $('cdBack').addEventListener('click', () => {
      let i = slots.indexOf(null); i = i < 0 ? slots.length - 1 : i - 1;
      if (i >= 0) { slots[i] = null; render(); }
    });
    $('cdGo').addEventListener('click', () => {
      if (slots.includes(null)) return fb('빈칸을 모두 채워 주세요.', false);
      if (slots.join('') === d.answer) return success(`신호 해독 성공! "${d.answer}"`, h);
      Sound.sfx('wrong');
      fb('암호가 맞지 않아요. 신호를 하나씩 다시 확인해 보세요.', false);
    });
  }

  // ---------- 3) 로봇 코딩 ----------
  const DIRS = { up: [0, -1, '↑'], down: [0, 1, '↓'], left: [-1, 0, '←'], right: [1, 0, '→'] };
  function robot(d, who, h) {
    const prog = [];
    let pos = d.start.slice(), running = false;
    const isWall = (x, y) => x < 0 || y < 0 || x >= d.w || y >= d.h || d.walls.some(w => w[0] === x && w[1] === y);
    const drawGrid = (bump) => {
      let html = '';
      for (let y = 0; y < d.h; y++) for (let x = 0; x < d.w; x++) {
        const wall = d.walls.some(w => w[0] === x && w[1] === y);
        const here = pos[0] === x && pos[1] === y;
        const goal = d.goal[0] === x && d.goal[1] === y;
        html += `<div class="rb-cell ${wall ? 'wall' : ''} ${here && bump ? 'bump' : ''}">${here ? '🤖' : goal ? '⚙️' : ''}</div>`;
      }
      const g = $('rbGrid');
      if (g) g.innerHTML = html;
    };
    const drawProg = () => {
      $('rbProg').innerHTML = prog.length
        ? prog.map((b, i) => `<button type="button" class="rb-blk" data-i="${i}">${DIRS[b.d][2]}${d.repeat ? `<small>×${b.n}</small>` : ''}</button>`).join('')
        : '<span class="muted small">아래 화살표를 눌러 블록을 놓아요</span>';
      $('rbCount').textContent = `${prog.length}/${d.max}`;
    };
    const inner = `<div class="rb-wrap"><div class="rb-grid" id="rbGrid" style="grid-template-columns:repeat(${d.w}, 1fr)"></div>
      <div class="rb-side"><div class="rb-label">내 코드 <span id="rbCount"></span></div><div class="rb-prog" id="rbProg"></div>
      <div class="rb-pal">${['up', 'left', 'down', 'right'].map(k => `<button type="button" class="rb-add" data-d="${k}">${DIRS[k][2]}</button>`).join('')}</div>
      ${d.repeat ? '<p class="muted small">놓은 블록을 누르면 반복 횟수가 바뀌어요 (×1 → ×5)</p>' : '<p class="muted small">놓은 블록을 누르면 지워져요</p>'}</div></div>`;
    frame('robot', who, '로봇 코딩', d.intro, inner, h, '<button class="ghost" id="rbClear">모두 지우기</button><button class="primary" id="rbRun">▶ 실행</button>');
    drawGrid(); drawProg();
    document.querySelector('.rb-pal').addEventListener('click', e => {
      const b = e.target.closest('.rb-add');
      if (!b || running) return;
      if (prog.length >= d.max) return fb(`블록은 ${d.max}개까지만 놓을 수 있어요.${d.repeat ? ' 블록을 눌러 반복 횟수를 늘려 보세요!' : ''}`, false);
      prog.push({ d: b.dataset.d, n: 1 });
      Sound.sfx('talk'); $('mgFb').textContent = '';
      drawProg();
    });
    $('rbProg').addEventListener('click', e => {
      const b = e.target.closest('.rb-blk');
      if (!b || running) return;
      const i = Number(b.dataset.i);
      if (d.repeat) prog[i].n = prog[i].n % 5 + 1; else prog.splice(i, 1);
      Sound.sfx('talk');
      drawProg();
    });
    $('rbClear').addEventListener('click', () => { if (running) return; prog.length = 0; pos = d.start.slice(); drawGrid(); drawProg(); $('mgFb').textContent = ''; });
    $('rbRun').addEventListener('click', () => {
      if (running || !prog.length) return;
      const steps = [];
      prog.forEach(b => { for (let k = 0; k < b.n; k++) steps.push(b.d); });
      running = true;
      pos = d.start.slice(); drawGrid();
      document.querySelectorAll('.rb-add, #rbClear, #rbRun').forEach(b => { b.disabled = true; });
      let i = 0;
      const end = (ok, msg) => {
        running = false;
        if (ok) return success(msg, h);
        Sound.sfx('wrong');
        fb(msg, false);
        setTimeout(() => { if (!$('rbGrid')) return; pos = d.start.slice(); drawGrid(); document.querySelectorAll('.rb-add, #rbClear, #rbRun').forEach(b => { b.disabled = false; }); }, 900);
      };
      const tick = () => {
        if (!$('rbGrid')) return;
        if (i >= steps.length) {
          return pos[0] === d.goal[0] && pos[1] === d.goal[1] ? end(true, '도착! 로봇이 부품을 집었어요.') : end(false, '로봇이 부품까지 가지 못했어요. 코드를 고쳐 볼까요?');
        }
        const [dx, dy] = DIRS[steps[i++]];
        const nx = pos[0] + dx, ny = pos[1] + dy;
        if (isWall(nx, ny)) { drawGrid(true); return end(false, '쾅! 벽에 부딪혔어요. 코드를 고쳐 볼까요?'); }
        pos = [nx, ny];
        Sound.sfx('talk');
        drawGrid();
        if (pos[0] === d.goal[0] && pos[1] === d.goal[1] && i === steps.length) return setTimeout(tick, 200);
        setTimeout(tick, 260);
      };
      setTimeout(tick, 250);
    });
  }

  // ---------- 4) 정렬 자물쇠 ----------
  function sort(d, who, h) {
    let picked = [];
    const draw = () => {
      $('stSlots').innerHTML = d.cards.map((c, i) => `<div class="st-slot ${picked[i] != null ? 'fill' : ''}">${picked[i] != null ? E(d.cards[picked[i]].t) : i + 1}</div>`).join('<span class="st-arrow">→</span>');
      document.querySelectorAll('.st-card').forEach(b => { b.disabled = picked.includes(Number(b.dataset.i)); });
    };
    const inner = `<div class="st-lock">🔒 작은 값 → 큰 값</div><div class="st-slots" id="stSlots"></div>
      <div class="st-cards">${d.cards.map((c, i) => `<button type="button" class="st-card" data-i="${i}">${E(c.t)}</button>`).join('')}</div>`;
    frame('sort', who, '숫자 자물쇠 열기', d.intro, inner, h, '<button class="ghost" id="stClear">다시 하기</button>');
    draw();
    document.querySelector('.st-cards').addEventListener('click', e => {
      const b = e.target.closest('.st-card');
      if (!b || b.disabled) return;
      picked.push(Number(b.dataset.i));
      Sound.sfx('talk'); $('mgFb').textContent = '';
      draw();
      if (picked.length === d.cards.length) {
        const ok = picked.every((ci, k) => k === 0 || d.cards[picked[k - 1]].v <= d.cards[ci].v);
        if (ok) return success('딸깍! 자물쇠가 열렸어요.', h);
        Sound.sfx('wrong');
        fb('자물쇠가 안 열려요. 작은 값부터 다시 눌러 보세요.', false);
        setTimeout(() => { picked = []; if ($('stSlots')) draw(); }, 900);
      }
    });
    $('stClear').addEventListener('click', () => { picked = []; draw(); $('mgFb').textContent = ''; });
  }

  // ---------- 5) 전구 블록코딩 ----------
  function runBulbs(d) {
    const on = new Array(d.n).fill(false);
    let p = 0;
    const ex = list => { for (const c of list) { if (c.op === 'on') { if (p < d.n) on[p] = true; } else if (c.op === 'next') p++; else if (c.op === 'repeat') for (let i = 0; i < c.n; i++) ex(c.body); } };
    ex(d.program);
    return on;
  }
  function blocksHtml(list) {
    return list.map(c => c.op === 'repeat'
      ? `<div class="bk rep"><div class="bk-head">반복하기 <b>${c.n}</b>번</div><div class="bk-inner">${blocksHtml(c.body)}</div></div>`
      : `<div class="bk ${c.op}">${c.op === 'on' ? '💡 전구 켜기' : '➡ 다음 칸으로'}</div>`).join('');
  }
  function bulbs(d, who, h) {
    const mine = new Array(d.n).fill(false);
    const answer = runBulbs(d);
    const inner = `<div class="bk-wrap"><div class="bk-code"><div class="bk start">▶ 시작 (1번 칸)</div>${blocksHtml(d.program)}</div>
      <div class="bk-right"><div class="rb-label">켜질 전구를 눌러 표시하세요</div>
      <div class="bulbs">${mine.map((v, i) => `<button type="button" class="bulb" data-i="${i}"><i></i><small>${i + 1}</small></button>`).join('')}</div></div></div>`;
    frame('bulbs', who, '단말기: 전구 블록코딩', d.intro, inner, h, '<button class="primary" id="bkGo">확인</button>');
    document.querySelector('.bulbs').addEventListener('click', e => {
      const b = e.target.closest('.bulb');
      if (!b) return;
      const i = Number(b.dataset.i);
      mine[i] = !mine[i];
      b.classList.toggle('on', mine[i]);
      Sound.sfx('talk'); $('mgFb').textContent = '';
    });
    $('bkGo').addEventListener('click', () => {
      if (mine.every((v, i) => v === answer[i])) return success('삐빅! 정답! 단말기가 열리고 AI 칩이 나왔어요.', h, 1500);
      Sound.sfx('wrong');
      fb('단말기: 결과가 달라요. 코드를 위에서부터 한 줄씩 다시 따라가 보세요.', false);
    });
  }

  return { label, code, robot, sort, bulbs, runBulbs };
})();

// ===== admin.js =====
// 관리자 화면 (주소 끝에 #admin)
// 기록 조회·CSV 다운로드·삭제, 랭킹 초기화, 퀴즈·대사 수정
const Admin = (() => {
  const $ = id => document.getElementById(id);
  let authed = false;
  let work = null;      // 수정 중인 콘텐츠
  let group = 'low';
  let tab = 'records';

  function root() { return $('admin'); }
  function show(html) { root().innerHTML = html; root().classList.remove('hidden'); }

  async function open() {
    Game.stop();
    if (authed) return main();
    const has = await Store.adminHasPassword();
    show(`<div class="admin-login">
      <h2>관리자</h2>
      ${has ? '<p>관리자 비밀번호를 입력하세요.</p>' : '<p>처음 들어오셨어요. 사용할 관리자 비밀번호를 정해 주세요. (4자 이상)</p>'}
      <form id="admForm" autocomplete="off">
        <input type="password" id="admPw" placeholder="비밀번호" autocomplete="new-password">
        ${has ? '' : '<input type="password" id="admPw2" placeholder="비밀번호 다시 입력" autocomplete="new-password">'}
        <button class="primary" type="submit">${has ? '들어가기' : '비밀번호 정하기'}</button>
      </form>
      <p class="bad" id="admErr"></p>
      <button class="ghost" id="admBack">게임으로 돌아가기</button>
    </div>`);
    $('admBack').addEventListener('click', close);
    $('admForm').addEventListener('submit', async e => {
      e.preventDefault();
      const pw = $('admPw').value;
      if (!has) {
        if (pw.length < 4) return ($('admErr').textContent = '4자 이상으로 정해 주세요.');
        if (pw !== $('admPw2').value) return ($('admErr').textContent = '두 비밀번호가 달라요.');
        await Store.adminSetPassword(pw);
        authed = true;
        return main();
      }
      if (await Store.adminCheck(pw)) { authed = true; main(); }
      else $('admErr').textContent = '비밀번호가 맞지 않아요.';
    });
    setTimeout(() => $('admPw').focus(), 30);
  }

  function close() {
    root().classList.add('hidden');
    root().innerHTML = '';
    if (location.hash === '#admin') history.replaceState(null, '', location.pathname + location.search);
    App.toStart();
  }

  async function main() {
    show(`<div class="admin">
      <header><h2>관리자 · 로봇 교장선생님 구하기!</h2><button class="ghost" id="admOut">나가기</button></header>
      <nav class="tabs"><button data-t="records">기록 조회</button><button data-t="content">퀴즈·대사 수정</button><button data-t="reset">랭킹 초기화</button></nav>
      <section id="admBody"></section>
    </div>`);
    $('admOut').addEventListener('click', () => { authed = false; close(); });
    root().querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => { tab = b.dataset.t; renderTab(); }));
    renderTab();
  }

  function renderTab() {
    root().querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
    if (tab === 'records') records();
    else if (tab === 'content') contentEditor();
    else resetTab();
  }

  // ---------- 기록 ----------
  async function records() {
    const all = await Store.adminListRecords();
    const body = $('admBody');
    const f = { g: '', grade: '', cls: '' };
    const draw = () => {
      const rows = all.filter(r => (!f.g || Util.gradeGroup(r.grade) === f.g) && (!f.grade || r.grade == f.grade) && (!f.cls || r.cls == f.cls))
        .sort((a, b) => a.grade - b.grade || a.cls - b.cls || a.num - b.num);
      $('recTable').innerHTML = rows.length ? `<table class="rec"><thead><tr><th>학년</th><th>반</th><th>번호</th><th>이름</th><th>최고 기록</th><th>도전</th><th>클리어</th><th>마지막 도전</th><th></th></tr></thead><tbody>` +
        rows.map(r => `<tr><td>${r.grade}</td><td>${r.cls}</td><td>${r.num}</td><td>${Util.esc(r.name)}</td><td>${r.bestMs != null ? Util.formatTime(r.bestMs) : '-'}</td><td>${r.tries}</td><td>${r.clears}</td><td>${r.lastAt ? new Date(r.lastAt).toLocaleString('ko-KR') : '-'}</td><td><button class="danger small" data-del="${r.id}">삭제</button></td></tr>`).join('') +
        '</tbody></table>' : '<p class="muted">기록이 없어요.</p>';
      $('recCount').textContent = `${rows.length}명`;
      $('recTable').querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', async () => {
        const r = all.find(x => x.id === Number(b.dataset.del));
        ask(`${r.grade}학년 ${r.cls}반 ${r.num}번 ${r.name} 학생의 기록을 모두 지울까요?`, async () => {
          await Store.adminDeletePlayer(r.id);
          records();
        });
      }));
      body._rows = rows;
    };
    body.innerHTML = `<div class="filters">
        <select id="fG"><option value="">전체</option><option value="low">저학년</option><option value="high">고학년</option></select>
        <select id="fGrade"><option value="">모든 학년</option>${[1, 2, 3, 4, 5, 6].map(i => `<option value="${i}">${i}학년</option>`).join('')}</select>
        <select id="fCls"><option value="">모든 반</option>${Array.from({ length: 10 }, (_, i) => `<option value="${i + 1}">${i + 1}반</option>`).join('')}</select>
        <span id="recCount" class="muted"></span>
        <button class="primary" id="csvBtn">CSV 다운로드</button>
        <button class="ghost" id="csvCopy">표 복사 (엑셀에 붙여넣기)</button>
        <span id="csvMsg" class="ok"></span>
      </div><div id="recTable" class="table-wrap"></div>
      ${Store.mode === 'local' ? '<p class="muted small">시험 버전: 이 기기(브라우저)에 저장된 기록만 보여요. 서버를 연결하면 모든 기기의 기록이 모입니다.</p>' : ''}`;
    $('fG').addEventListener('change', e => { f.g = e.target.value; draw(); });
    $('fGrade').addEventListener('change', e => { f.grade = e.target.value; draw(); });
    $('fCls').addEventListener('change', e => { f.cls = e.target.value; draw(); });
    const table = () => {
      const head = ['학년', '반', '번호', '이름', '최고 기록', '최고 기록(초)', '도전 횟수', '클리어 횟수', '마지막 도전'];
      return [head].concat(body._rows.map(r => [r.grade, r.cls, r.num, r.name, r.bestMs != null ? Util.formatTime(r.bestMs) : '', r.bestMs != null ? (r.bestMs / 1000).toFixed(1) : '', r.tries, r.clears, r.lastAt ? new Date(r.lastAt).toLocaleString('ko-KR') : '']));
    };
    $('csvCopy').addEventListener('click', async () => {
      const tsv = table().map(l => l.join('\t')).join('\n');
      try { await navigator.clipboard.writeText(tsv); $('csvMsg').textContent = '복사했어요! 엑셀에 붙여넣으세요.'; }
      catch (e) { $('csvMsg').textContent = '복사가 막혀 있어요. CSV 다운로드를 이용해 주세요.'; }
    });
    $('csvBtn').addEventListener('click', async () => {
      const csv = '﻿' + table().map(l => l.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\r\n');
      const filename = `로봇교장구하기_기록_${new Date().toISOString().slice(0, 10)}.csv`;
      // claude.ai에 올린 페이지에서는 플랫폼 저장 기능을 쓰고, 그 밖에서는 일반 다운로드
      if (window.claude && window.claude.use) {
        try {
          const dl = await window.claude.use('downloads');
          if (dl) { await dl.save({ filename, data: csv }); $('csvMsg').textContent = ''; return; }
        } catch (e) { $('csvMsg').textContent = '다운로드가 취소됐어요.'; return; }
      }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
      a.download = filename;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    });
    draw();
  }

  // ---------- 초기화 ----------
  function resetTab() {
    $('admBody').innerHTML = `<div class="reset-box">
      <p>모든 학생의 기록과 랭킹을 지웁니다. 되돌릴 수 없어요.</p>
      <p>계속하려면 아래 칸에 <b>초기화</b>라고 입력하세요.</p>
      <input id="resetIn" placeholder="초기화">
      <button class="danger" id="resetBtn">랭킹 초기화</button>
      <p id="resetMsg"></p></div>`;
    $('resetBtn').addEventListener('click', async () => {
      if ($('resetIn').value.trim() !== '초기화') { $('resetMsg').textContent = '"초기화"를 정확히 입력해 주세요.'; return; }
      await Store.adminResetAll();
      $('resetMsg').textContent = '모든 기록을 지웠어요.';
      $('resetIn').value = '';
    });
  }

  // ---------- 퀴즈·대사 수정 ----------
  const KIND_LABEL = { quiz: '퀴즈형', explore: '탐색+퀴즈', label: '미니게임 · AI 이름표', code: '미니게임 · 암호', robot: '미니게임 · 로봇 코딩', sort: '탐색+정렬', dark: '어두운 창고 + 전구 코딩' };
  const GAME_KEY = { label: 'label', code: 'code', robot: 'robot', sort: 'sort', dark: 'bulbs' };
  const POOL_MIN = { quiz: 3, explore: 2, reboot: 3 };

  async function contentEditor() {
    if (!work) work = Util.clone(await Store.getContent());
    const g = group, GL = g === 'low' ? '저학년' : '고학년';
    const E = Util.esc;
    const ta = (path, arr, rows) => `<textarea data-path="${path}" data-kind="lines" rows="${rows || Math.max(2, arr.length)}">${E(arr.join('\n'))}</textarea>`;
    const inp = (path, v, kind) => `<input data-path="${path}" data-kind="${kind || 'str'}" value="${E(v == null ? '' : v)}">`;
    const txt = (path, v, rows) => `<textarea data-path="${path}" data-kind="str" rows="${rows || 2}">${E(v || '')}</textarea>`;

    // 문제 하나 편집
    const qEdit = (p, q, title, delPath) => {
      let h = `<div class="q-edit"><div class="q-no">${title}${delPath ? ` <button class="ghost small" data-del-q="${delPath}">이 문제 지우기</button>` : ''}</div>
        <label>형식 <select data-path="${p}.format" data-kind="str" data-rerender="1">
          <option value="choice" ${q.format === 'choice' ? 'selected' : ''}>객관식</option>
          <option value="text" ${q.format === 'text' ? 'selected' : ''}>주관식</option>
          <option value="ox" ${q.format === 'ox' ? 'selected' : ''}>OX</option></select></label>
        <label>문제 ${txt(p + '.question', q.question)}</label>`;
      if (q.format === 'choice') {
        const ch = q.choices.length ? q.choices : ['', '', '', ''];
        h += '<div class="choices-edit">' + [0, 1, 2, 3].map(k => `<label class="ch"><input type="radio" name="r_${p}" data-path="${p}.correct" data-kind="num" value="${k}" ${Number(q.correct) === k ? 'checked' : ''}> 정답 ` +
          `<input data-path="${p}.choices.${k}" data-kind="str" value="${E(ch[k] || '')}" placeholder="보기 ${k + 1}"></label>`).join('') + '</div>';
      } else if (q.format === 'ox') {
        h += `<label>정답 <select data-path="${p}.answers" data-kind="ox"><option value="O" ${q.answers[0] === 'O' ? 'selected' : ''}>O</option><option value="X" ${q.answers[0] === 'X' ? 'selected' : ''}>X</option></select></label>`;
      } else {
        h += `<label>정답 (여러 개면 쉼표로 구분) ${inp(p + '.answers', q.answers.join(', '), 'csv')}</label>`;
      }
      h += `<label>해설 (맞힌 뒤 보여 줘요) ${txt(p + '.explain', q.explain, 2)}</label>`;
      return h + '</div>';
    };
    const poolEdit = (p, list, min, label) => `<h4>${label} <span class="muted small">(${list.length}개 · 이 중에서 무작위로 나와요, 최소 ${min}개)</span></h4>` +
      list.map((q, qi) => qEdit(`${p}.${qi}`, q, `문제 ${qi + 1}`, list.length > min ? `${p}.${qi}` : null)).join('') +
      `<div class="row"><button class="ghost small" data-add-q="${p}">+ 문제 추가</button></div>`;

    const missionCards = work.missions.map((m, i) => {
      const P = `missions.${i}`;
      let body = '';
      if (m.kind === 'quiz') body = poolEdit(`${P}.pool.${g}`, m.pool[g], POOL_MIN.quiz, `${GL} 문제 풀`);
      if (m.kind === 'explore') {
        body = `<label>단서 (한 줄에 하나, ${m.clues[g].length}개 유지) ${ta(`${P}.clues.${g}`, m.clues[g])}</label>` +
          `<h4>${GL} 단서로 푸는 문제 (항상 1번으로 나와요)</h4>` + qEdit(`${P}.first.${g}`, m.first[g], '단서 문제') +
          poolEdit(`${P}.pool.${g}`, m.pool[g], POOL_MIN.explore, `${GL} 문제 풀 (2개가 무작위로 나와요)`);
      }
      if (m.kind === 'sort') body = `<label>단서 (한 줄에 하나, ${m.clues[g].length}개 유지) ${ta(`${P}.clues.${g}`, m.clues[g])}</label>`;
      if (m.kind === 'dark') body = `<label>창고 쪽지 (한 줄에 하나, 3개 유지) ${ta(`${P}.notes.${g}`, m.notes[g], 3)}</label>`;
      const gk = GAME_KEY[m.kind];
      if (gk) body += `<label>${GL} 미니게임 설정 (고급: JSON 형식, 잘 모르면 그대로 두세요) <textarea class="json" data-path="${P}.${gk}.${g}" data-kind="json" rows="6">${E(JSON.stringify(m[gk][g], null, 1))}</textarea></label>`;
      return `<details class="card" ${i === 0 ? 'open' : ''}><summary>${m.order}. ${E(m.npc)} <span class="muted">· ${KIND_LABEL[m.kind]} · ${E(m.short)} · ${E(m.part)}</span></summary>
        <div class="grid2"><label>NPC 이름 ${inp(`${P}.npc`, m.npc)}</label><label>주는 부품 ${inp(`${P}.part`, m.part)}</label></div>
        <div class="grid2"><label>순서도에 보일 장소 이름 ${inp(`${P}.short`, m.short)}</label><label>${GL} 힌트 (💡 버튼) ${inp(`${P}.hint.${g}`, m.hint[g])}</label></div>
        <label>시작 대사 (한 줄에 한 마디) ${ta(`${P}.start`, m.start)}</label>
        <label>완료 대사 ${ta(`${P}.end`, m.end)}</label>${body}</details>`;
    }).join('');

    const R = work.reboot;
    const rebootCard = `<details class="card"><summary>마지막 · 로봇 교장선생님 재부팅 <span class="muted">· OX 3문제</span></summary>
      <label>재부팅 전 대사 ${ta('reboot.start', R.start)}</label>${poolEdit(`reboot.pool.${g}`, R.pool[g], POOL_MIN.reboot, `${GL} 재부팅 문제 풀`)}</details>`;

    const sideCards = work.sides.map((s, i) => `<details class="card"><summary>서브 ${s.id}. ${E(s.npc)} <span class="muted">· 힌트 토큰 +${s.reward || 2} · ${s.hintFor}번 미션 비밀 힌트</span></summary>
        <label>NPC 이름 ${inp(`sides.${i}.npc`, s.npc)}</label>
        <label>시작 대사 ${ta(`sides.${i}.start`, s.start)}</label>
        <label>완료 대사 ${ta(`sides.${i}.end`, s.end)}</label>
        ${s.kind === 'collect' ? '<p class="muted small">반창고 3개 모으기 미션 (문제 없음)</p>' : `<label>문제 ${txt(`sides.${i}.question`, s.question)}</label>
        <label>정답 ${s.kind === 'ox' ? '(O 또는 X)' : '(여러 개면 쉼표로 구분)'} ${inp(`sides.${i}.answers`, s.answers.join(', '), 'csv')}</label>`}
        <label>${GL} 비밀 힌트 ${inp(`sides.${i}.hint.${g}`, s.hint[g])}</label></details>`).join('');

    const signCards = `<details class="card"><summary>i 팻말 내용</summary>${Object.keys(work.signs).map(k => `<div class="q-edit"><label>제목 ${inp(`signs.${k}.title`, work.signs[k].title)}</label><label>내용 ${txt(`signs.${k}.text`, work.signs[k].text, 4)}</label></div>`).join('')}</details>`;

    const amb = { outdoor: '바깥', hall: '복도', classroom: '교실', cafeteria: '급식실' };
    const etcCards = `<details class="card"><summary>기본 정보 · 수집품 · 잠긴 문</summary>
        <label>첫 화면 오른쪽 아래 만든이 ${inp('credit', work.credit)}</label>
        <div class="grid2"><label>수집품 이름 ${inp('collect.name', work.collect.name)}</label><label>다 모으면 받는 배지 ${inp('collect.badge', work.collect.badge)}</label></div>
        <div class="grid2"><label>수집품 칭호 ${inp('collect.title', work.collect.title)}</label><label>도감 완성 칭호 ${inp('dexTitle', work.dexTitle)}</label></div>
        ${Object.keys(work.locks).map(k => `<label>잠긴 문 안내 · ${E(work.items[k].name)} ${inp('locks.' + k, work.locks[k])}</label>`).join('')}
      </details>
      <details class="card"><summary>분위기 NPC 대사</summary>${Object.keys(amb).map(k => `<label>${amb[k]} (한 줄에 하나) ${ta('ambient.' + k, work.ambient[k], 4)}</label>`).join('')}</details>
      <details class="card"><summary>오프닝·엔딩·공통 대사</summary>
        <label>문제 규칙 안내 (퀴즈 창 위쪽) ${inp('common.rule', work.common.rule || '')}</label>
        <label>틀렸을 때 (처음부터 다시) ${inp('common.restart', work.common.restart || '')}</label>
        <label>아직 차례가 아닐 때 ({next} = 먼저 만나야 할 NPC) ${inp('common.notYet', work.common.notYet)}</label>
        <label>이미 끝낸 NPC ${inp('common.already', work.common.already)}</label>
        <label>단서를 덜 찾았을 때 ${inp('common.notReady', work.common.notReady)}</label>
        <label>오답일 때 (한 줄에 하나) ${ta('common.wrong', work.common.wrong)}</label>
        <p class="muted small">오프닝·엔딩 대사는 "이름: 대사" 형식으로 한 줄에 하나. {name} = 학생 이름</p>
        <label>오프닝 <textarea data-path="opening" data-kind="who-lines" rows="5">${E(work.opening.map(l => (l.who ? l.who + ': ' : '') + l.text).join('\n'))}</textarea></label>
        <label>엔딩 <textarea data-path="ending" data-kind="who-lines" rows="3">${E(work.ending.map(l => (l.who ? l.who + ': ' : '') + l.text).join('\n'))}</textarea></label>
      </details>`;

    $('admBody').innerHTML = `<div class="content-bar">
        <div class="tabs small"><button data-g="low" class="${g === 'low' ? 'on' : ''}">저학년 문제</button><button data-g="high" class="${g === 'high' ? 'on' : ''}">고학년 문제</button></div>
        <span id="saveMsg" class="muted"></span>
        <button class="ghost" id="cDefault">처음 값으로 되돌리기</button>
        <button class="primary" id="cSave">저장</button>
      </div>
      <p class="muted small">대사·NPC 이름은 저학년·고학년이 함께 써요. 문제·정답·단서·힌트·미니게임만 학년군별로 따로예요. 퀴즈는 문제 풀에서 무작위로 3개가 나오고, 틀리면 새로 뽑아 처음부터 풀어요. 저장하면 새로 시작하는 학생부터 바뀐 내용이 나와요.</p>
      <h3>메인 미션</h3>${missionCards}${rebootCard}<h3>서브 미션 (힌트 토큰 +2)</h3>${sideCards}<h3>기타</h3>${signCards}${etcCards}`;

    const body = $('admBody');
    const dirty = () => { $('saveMsg').textContent = '저장하지 않은 변경이 있어요'; $('saveMsg').className = 'muted'; };
    body.querySelectorAll('.content-bar .tabs button').forEach(b => b.addEventListener('click', () => { group = b.dataset.g; contentEditor(); }));
    body.querySelectorAll('[data-path]').forEach(el => {
      const ev = el.tagName === 'SELECT' || el.type === 'radio' ? 'change' : 'input';
      el.addEventListener(ev, () => {
        if (el.dataset.kind === 'json') {
          try { setPath(work, el.dataset.path, JSON.parse(el.value)); el.classList.remove('bad-json'); }
          catch (e) { el.classList.add('bad-json'); $('saveMsg').textContent = 'JSON 형식이 맞지 않아요 (빨간 칸)'; $('saveMsg').className = 'bad'; return; }
        } else setPath(work, el.dataset.path, parse(el));
        dirty();
        if (el.dataset.rerender) {
          const q = getPath(work, el.dataset.path.replace(/\.format$/, ''));
          if (q.format === 'choice' && q.choices.length < 4) q.choices = ['', '', '', ''];
          if (q.format === 'ox' && !/^[OX]$/.test(q.answers[0] || '')) q.answers = ['O'];
          if (q.format === 'text' && /^[OX]$/.test(q.answers[0] || '')) q.answers = [];
          contentEditor();
        }
      });
    });
    body.querySelectorAll('[data-add-q]').forEach(b => b.addEventListener('click', () => {
      getPath(work, b.dataset.addQ).push({ format: 'choice', question: '', choices: ['', '', '', ''], correct: 0, answers: [], explain: '' });
      dirty(); contentEditor();
    }));
    body.querySelectorAll('[data-del-q]').forEach(b => b.addEventListener('click', () => {
      const path = b.dataset.delQ, idx = Number(path.split('.').pop());
      getPath(work, path.split('.').slice(0, -1).join('.')).splice(idx, 1);
      dirty(); contentEditor();
    }));
    $('cSave').addEventListener('click', async () => {
      if (body.querySelector('.bad-json')) { $('saveMsg').textContent = 'JSON 형식이 맞지 않는 칸이 있어요.'; $('saveMsg').className = 'bad'; return; }
      const err = validate(work);
      if (err) { $('saveMsg').textContent = err; $('saveMsg').className = 'bad'; return; }
      await Store.adminSaveContent(work);
      $('saveMsg').textContent = '저장했어요!';
      $('saveMsg').className = 'ok';
    });
    $('cDefault').addEventListener('click', async () => {
      ask('퀴즈·대사를 모두 처음 값으로 되돌릴까요?', async () => {
        await Store.adminResetContent();
        work = Util.clone(DEFAULT_CONTENT);
        contentEditor();
      });
    });
  }

  // 브라우저 확인창(confirm)을 쓸 수 없는 곳이 있어 화면 안에 직접 띄운다
  function ask(msg, onYes) {
    const box = document.createElement('div');
    box.className = 'admin-ask';
    box.innerHTML = `<div class="panel"><p>${Util.esc(msg)}</p><div class="row end"><button class="ghost" data-a="no">취소</button><button class="danger" data-a="yes">확인</button></div></div>`;
    root().appendChild(box);
    box.addEventListener('click', e => {
      const a = e.target.dataset.a;
      if (!a) return;
      box.remove();
      if (a === 'yes') onYes();
    });
  }

  function parse(el) {
    const v = el.value;
    switch (el.dataset.kind) {
      case 'lines': return v.split('\n').map(s => s.trim()).filter(Boolean);
      case 'csv': return v.split(',').map(s => s.trim()).filter(Boolean);
      case 'num': return Number(v);
      case 'ox': return [v];
      case 'who-lines': return v.split('\n').map(s => s.trim()).filter(Boolean).map(s => {
        const m = s.match(/^([^:：]{1,12})[:：]\s*(.+)$/);
        return m ? { who: m[1].trim(), text: m[2] } : { who: '', text: s };
      });
      default: return v;
    }
  }
  function getPath(o, path) { return path.split('.').reduce((a, k) => a[k], o); }
  function setPath(o, path, v) {
    const ks = path.split('.');
    const lastK = ks.pop();
    const parent = ks.reduce((a, k) => a[k], o);
    parent[lastK] = v;
  }

  function checkQ(q, label) {
    if (!String(q.question || '').trim()) return `${label}가 비어 있어요.`;
    if (q.format === 'choice') {
      if (q.choices.filter(x => x && x.trim()).length < 2) return `${label}의 보기를 2개 이상 써 주세요.`;
      if (!q.choices[q.correct] || !q.choices[q.correct].trim()) return `${label}의 정답 보기를 골라 주세요.`;
    } else if (!q.answers.length) return `${label}의 정답을 써 주세요.`;
    return null;
  }
  function validate(c) {
    const GL = { low: '저학년', high: '고학년' };
    for (const m of c.missions) {
      if (!m.npc.trim()) return `${m.order}번 미션의 NPC 이름이 비어 있어요.`;
      if (!m.start.length || !m.end.length) return `${m.order}번 미션의 대사가 비어 있어요.`;
      for (const g of ['low', 'high']) {
        const L = `${m.order}번 미션 ${GL[g]}`;
        if (m.pool) {
          const min = POOL_MIN[m.kind];
          if (m.pool[g].length < min) return `${L} 문제 풀은 ${min}개 이상이어야 해요.`;
          for (let i = 0; i < m.pool[g].length; i++) { const e = checkQ(m.pool[g][i], `${L} 문제 ${i + 1}`); if (e) return e; }
        }
        if (m.first) { const e = checkQ(m.first[g], `${L} 단서 문제`); if (e) return e; }
        if (m.clues) {
          const need = DEFAULT_CONTENT.missions[m.order - 1].clues[g].length;
          if (m.clues[g].length !== need) return `${L} 단서는 ${need}개여야 해요. (맵에 단서 위치가 ${need}곳 있어요)`;
        }
        if (m.notes && m.notes[g].length !== 3) return `${L} 창고 쪽지는 3개여야 해요.`;
        const gk = GAME_KEY[m.kind], d = gk && m[gk][g];
        if (gk) {
          const bad = `${L} 미니게임 설정이 올바르지 않아요.`;
          if (!d || typeof d !== 'object') return bad;
          if (m.kind === 'label' && !(Array.isArray(d.cats) && Array.isArray(d.items) && d.items.every(it => it.a < d.cats.length && it.s < d.cats.length))) return bad;
          if (m.kind === 'code' && !(Array.isArray(d.table) && Array.isArray(d.code) && d.code.length === Array.from(String(d.answer)).length)) return bad + ' (code 개수와 answer 글자 수가 같아야 해요)';
