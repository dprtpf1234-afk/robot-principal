<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2a2533">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="로봇 교장">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap" rel="stylesheet">
<title>로봇 교장선생님 구하기! · 대교초등학교</title>
<style>
:root {
  color-scheme: light only;
  --ink: #2b2233; --paper: #fff8e7; --line: #2b2233; --accent: #3c6bd8; --accent2: #ffd84a;
  --ok: #2f9e44; --bad: #d6336c; --muted: #7a6f86;
  --title-font: "Do Hyeon", "Black Han Sans", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #2a2533; font-family: var(--font); color: var(--ink); }
body { user-select: none; -webkit-user-select: none; overscroll-behavior: none; }
canvas#game, #touchUI, #hud { touch-action: none; }
.panel, #admin, #entry, .entry-card { touch-action: pan-y; }
input, textarea, select { user-select: text; -webkit-user-select: text; font-family: var(--font); }
canvas#game { position: fixed; inset: 0; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
.hidden { display: none !important; }
button { font-family: var(--font); cursor: pointer; color: var(--ink); -webkit-text-fill-color: currentColor; }

/* 공통 버튼 */
.primary, .ghost, .danger {
  font-size: 16px; font-weight: 800; padding: 10px 18px; border: 3px solid var(--line); border-radius: 10px;
  box-shadow: 0 4px 0 var(--line); transition: transform .05s;
}
.primary { background: var(--accent2); color: var(--ink); }
.ghost { background: #fff; color: var(--ink); }
.danger { background: var(--bad); color: #fff; }
.primary:active, .ghost:active, .danger:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
button.small { font-size: 13px; padding: 5px 10px; box-shadow: 0 2px 0 var(--line); }
.big { font-size: 20px; padding: 12px 28px; }
.muted { color: var(--muted); }
.ok { color: var(--ok); font-weight: 800; }
.bad { color: var(--bad); font-weight: 800; }
.center { text-align: center; justify-content: center; }
.row { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
p.small, .small { font-size: 13px; }

/* 첫 화면 */
#title { position: fixed; inset: 0; z-index: 30; overflow: hidden; background: #5aa6ec; }
#titleCanvas { position: absolute; inset: 0; image-rendering: pixelated; }
.title-tools { position: absolute; top: max(14px, env(safe-area-inset-top)); right: max(14px, env(safe-area-inset-right)); z-index: 2; display: flex; gap: 8px; }
.fs-btn svg { width: 20px; height: 20px; display: block; }
.fs-btn { display: flex; align-items: center; gap: 6px;
  font-family: var(--title-font); font-size: 17px; color: #fff; background: #2f6ef0; border: 3px solid #1b2f6b; border-radius: 8px; padding: 6px 12px; box-shadow: 0 4px 0 #1b2f6b; }
.fs-ico { width: 14px; height: 14px; border: 2px dashed #fff; border-radius: 2px; display: inline-block; }
.fs-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #1b2f6b; }
.title-head { position: absolute; left: 0; right: 0; top: 4.5vh; display: flex; flex-direction: column; align-items: center; gap: 1.2vh; pointer-events: none; padding: 0 10px; }
.t-badge { font-family: var(--title-font); font-size: clamp(13px, 2.3vh, 22px); color: #3a2a00; background: #ffd84a; border: 3px solid #3a2a00; border-radius: 6px; padding: 3px 14px; box-shadow: 0 3px 0 #3a2a00; }
.t-logo { margin: 0; font-family: var(--title-font); font-weight: 400; color: #ffffff; text-align: center; line-height: 1.05;
  font-size: clamp(34px, min(11vh, 7.2vw), 112px); letter-spacing: .01em;
  text-shadow: 3px 0 0 #1b2f6b, -3px 0 0 #1b2f6b, 0 3px 0 #1b2f6b, 0 -3px 0 #1b2f6b, 3px 3px 0 #1b2f6b, -3px 3px 0 #1b2f6b, 3px -3px 0 #1b2f6b, -3px -3px 0 #1b2f6b,
    0 8px 0 #3a6fd8, 3px 8px 0 #1b2f6b, -3px 8px 0 #1b2f6b, 0 11px 0 #1b2f6b; }
.t-sub { font-family: var(--title-font); font-size: clamp(13px, 2.2vh, 22px); color: #fff; background: #20335c; border-radius: 6px; padding: 4px 14px; border: 2px solid #8fb0f0; }
.title-bottom { position: absolute; left: 0; right: 0; bottom: max(3.5vh, env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; gap: 8px; }
.t-start { font-family: var(--title-font); font-size: clamp(24px, 4.4vh, 44px); color: #fff; background: #2f6ef0; border: 4px solid #1b2f6b; border-radius: 10px;
  padding: 10px 0; width: min(340px, 60vw); box-shadow: 0 6px 0 #1b2f6b, inset 0 -6px 0 #2457c8; animation: pulse 1.6s ease-in-out infinite; }
.t-start:active { transform: translateY(4px); box-shadow: 0 2px 0 #1b2f6b; }
@keyframes pulse { 50% { transform: scale(1.04); } }
.visit-box { position: absolute; left: max(12px, env(safe-area-inset-left)); bottom: max(12px, env(safe-area-inset-bottom)); z-index: 2; background: rgba(32, 40, 70, .88); color: #fff; border: 2px solid #8fb0f0; border-radius: 8px; padding: 6px 12px; font-size: 14px; font-weight: 700; line-height: 1.5; }
.visit-box b { color: #ffd84a; font-size: 16px; font-variant-numeric: tabular-nums; }
.t-hint { font-size: 14px; font-weight: 700; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.45); }

/* 입장 정보 창 */
#entry { position: absolute; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center; background: rgba(20, 30, 60, .45); padding: 12px; overflow: auto; }
.entry-card { position: relative; width: min(520px, 100%); max-height: 100%; overflow: auto; background: var(--paper); border: 4px solid var(--line); border-radius: 14px; box-shadow: 0 8px 0 var(--line); padding: 16px 20px; display: grid; gap: 6px; }
.entry-close { position: absolute; top: 12px; right: 12px; font-weight: 800; font-size: 15px; background: #fff; border: 3px solid var(--line); border-radius: 8px; padding: 4px 10px; color: var(--ink); }
.e-school { font-size: 13px; color: var(--muted); font-weight: 700; }
.e-title { margin: 0; font-family: var(--title-font); font-weight: 400; font-size: 30px; line-height: 1.1; }
.e-sub { color: var(--accent); font-weight: 700; font-size: 15px; margin-bottom: 2px; }
.e-label { display: grid; gap: 5px; font-weight: 900; font-size: 14px; margin-top: 2px; }
div.e-label { display: block; }
.e-cols, .e-col { display: grid; gap: 6px; align-content: start; }
.e-label .muted { font-weight: 600; font-size: 12px; }
#gradeNote { display: inline; margin-left: 4px; }
.e-two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.entry-card input, .entry-card select { font-size: 17px; padding: 9px 10px; border: 3px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); width: 100%; font-weight: 600; }
.entry-card input:focus, .entry-card select:focus { outline: none; border-color: #f2b632; box-shadow: 0 0 0 3px #ffe8a3; }
.seg { display: grid; gap: 6px; }
.seg.six { grid-template-columns: repeat(6, 1fr); }
.seg.three { grid-template-columns: repeat(3, 1fr); }
.seg button { font-weight: 900; font-size: 15px; padding: 9px 4px; background: #fff; border: 3px solid #d8cba8; border-radius: 8px; color: var(--ink); }
.seg button.on { background: #4caf63; color: #fff; border-color: var(--line); box-shadow: 0 3px 0 var(--line); }
.avatars { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; }
@media (max-width: 480px) { .avatars { grid-template-columns: repeat(4, 1fr); } .seg .gr { display: none; } }
@media (max-width: 600px) { .title-head { top: 70px; } .t-logo { font-size: 30px; } .t-sub { font-size: 12px; } }
.avatars button { background: #fff; border: 3px solid #d8cba8; border-radius: 8px; padding: 4px 2px 3px; display: grid; justify-items: center; gap: 1px; color: var(--ink); font-weight: 800; font-size: 13px; }
.avatars button canvas { width: 36px; height: 36px; image-rendering: pixelated; }
.avatars button.on { background: #fff3c4; border-color: var(--line); box-shadow: 0 3px 0 var(--line); }
.mode-desc { margin: 0; font-size: 13px; color: #4a3f55; line-height: 1.45; min-height: 1.45em; }
#startErr { margin: 0; min-height: 0; font-size: 14px; }
#startErr:empty { display: none; }
.e-enter { font-family: var(--title-font); font-size: 30px; color: #fff; background: #2f6ef0; border: 4px solid var(--line); border-radius: 10px; padding: 8px; box-shadow: 0 5px 0 var(--line), inset 0 -5px 0 #2457c8; }
.e-enter:active, .e-rank:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.e-rank { font-weight: 900; font-size: 15px; background: #fff8e7; border: 3px solid var(--line); border-radius: 10px; padding: 9px; box-shadow: 0 4px 0 var(--line); color: var(--ink); }
#adminLink { text-align: center; font-size: 11px; color: #b9b0c4; }

/* 상단 정보 */
#hud { position: fixed; top: 0; left: 0; right: 0; z-index: 10; display: grid; grid-template-columns: auto 1fr auto; grid-template-areas: 'time next side'; align-items: start; gap: 8px; padding: 8px; padding-top: max(8px, env(safe-area-inset-top)); pointer-events: none; }
#hud > * { pointer-events: auto; }
.hud-left { grid-area: time; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
#hudNext { grid-area: next; }
.hud-side { grid-area: side; }
.hud-box { color: var(--ink); background: rgba(255, 248, 231, .95); border: 3px solid var(--line); border-radius: 10px; padding: 4px 10px; font-weight: 800; box-shadow: 0 3px 0 var(--line); }
#hudTime { font-size: 20px; font-variant-numeric: tabular-nums; line-height: 1.1; }
#hudTime small { display: block; font-size: 10px; color: var(--muted); }
.hud-box.warn { background: #ffd6e0; color: #b0123f; }
table.rank td.mode { color: var(--muted); font-size: 13px; }
#hudPlace { font-size: 11px; color: var(--muted); }
#hudNext { justify-self: center; align-self: start; max-width: 760px; margin-top: 4px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  background: rgba(36, 30, 52, .92); color: #fff; border: 3px solid #ffd84a; border-radius: 12px; padding: 7px 14px; box-shadow: 0 3px 0 #1a1526; font-size: 16px; font-weight: 700; }
#hudNext:empty { display: none; }
#hudNext .star { width: 22px; height: 22px; flex: none; background: #ffd84a; clip-path: polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%); }
#hudNext .mtext b { color: #ffd84a; }
#hudNext .mtext .cnt { display: inline-block; background: #ffd84a; color: #2b2233; border-radius: 6px; padding: 0 6px; margin-left: 4px; font-weight: 900; }
#hudNext .mpill { background: #ffd84a; color: #2b2233; border-radius: 8px; padding: 2px 10px; font-size: 13px; font-weight: 900; white-space: nowrap; }
.hud-right { display: flex; gap: 6px; align-items: center; }
.hud-side { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.map-panel { background: rgba(255, 248, 231, .95); border: 3px solid var(--line); border-radius: 10px; box-shadow: 0 3px 0 var(--line); padding: 5px; display: grid; gap: 5px; width: 220px; }
#minimap { display: block; width: 100%; max-height: 170px; image-rendering: pixelated; border-radius: 5px; background: #2a2533; }
.map-panel.folded #minimap { display: none; }
.map-ctrl { display: flex; align-items: center; gap: 5px; }
.map-ctrl #zoomLabel { min-width: 30px; text-align: center; font-weight: 900; font-size: 14px; color: var(--ink); }
.map-ctrl #mapToggle { margin-left: auto; font-size: 12px; padding: 4px 8px; }
.hud-btn.sq { width: 32px; height: 30px; padding: 0; font-size: 20px; line-height: 1; background: #2f6ef0; color: #fff; border-color: #1b2f6b; box-shadow: 0 3px 0 #1b2f6b; }
.hud-btn.sq:disabled { opacity: .4; }
.hud-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
#hudParts { display: flex; gap: 3px; }
#hudParts .slot { width: 12px; height: 12px; border: 2px solid var(--line); border-radius: 3px; background: #ddd2be; }
#hudParts .slot.on { background: var(--accent2); }
.hud-btn { font-size: 13px; font-weight: 800; padding: 6px 10px; border: 3px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); box-shadow: 0 3px 0 var(--line); white-space: nowrap; }
.hud-btn.muted { background: #ddd; color: var(--ink); }
.hud-btn.ico { width: 38px; height: 34px; padding: 0; display: grid; place-items: center; background: #2f6ef0; color: #fff; border-color: #1b2f6b; box-shadow: 0 3px 0 #1b2f6b; }
.hud-btn.ico svg { width: 18px; height: 18px; display: block; }
.hud-btn.ico.muted { background: #8a94a6; }
.side-btns { display: grid; grid-template-columns: 1fr auto; gap: 6px; width: 220px; }
.hud-btn.dex { background: #2f6ef0; color: #ffd84a; border-color: #1b2f6b; box-shadow: 0 3px 0 #1b2f6b; }
.hud-btn { height: 34px; }
/* 도감 */
.panel.dexp { width: min(860px, 100%); }
.dex-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; max-height: 58vh; overflow: auto; padding: 2px; }
.dex-card { background: #fff; border: 3px solid var(--line); border-radius: 10px; padding: 8px; display: grid; grid-template-columns: 44px 1fr; gap: 8px; align-items: start; }
.dex-card.unknown { background: #ece4d2; border-color: #c9bb98; color: var(--muted); }
.dex-card canvas { width: 44px; height: 44px; image-rendering: pixelated; background: #cfe8c4; border-radius: 6px; }
.dex-card.unknown canvas { background: #d8ccb0; }
.dex-card .nm { font-weight: 900; font-size: 14px; line-height: 1.25; }
.dex-card .pl { font-size: 11px; color: var(--accent); font-weight: 800; margin-top: 2px; }
.dex-card.unknown .pl { color: var(--muted); }
.dex-card .pf { grid-column: 1 / -1; font-size: 12px; line-height: 1.45; }
.dex-head { display: flex; align-items: baseline; gap: 10px; }
.dex-bar { flex: 1; height: 12px; border: 3px solid var(--line); border-radius: 6px; background: #fff; overflow: hidden; }
.dex-bar span { display: block; height: 100%; background: #4caf63; }


/* 미션 순서도 */
.flow-panel { background: rgba(255, 248, 231, .95); border: 3px solid var(--line); border-radius: 10px; box-shadow: 0 3px 0 var(--line); padding: 4px 6px 6px; width: 212px; }
.flow-toggle { display: block; width: 100%; text-align: left; background: none; border: 0; font-weight: 900; font-size: 13px; padding: 2px 2px 4px; color: var(--ink); }
.flow-panel.folded { width: auto; padding-bottom: 2px; }
.flow-panel.folded .flow-list { display: none; }
.flow-list { display: grid; gap: 1px; justify-items: stretch; }
.fl-stage { display: grid; gap: 3px; }
.fl-stage.multi { grid-template-columns: 1fr 1fr; }
.fl-arrow { text-align: center; font-size: 9px; line-height: 10px; color: var(--muted); }
.fl-node { display: flex; align-items: center; gap: 4px; padding: 4px 5px; border: 2px solid var(--line); border-radius: 7px; background: #fff; font-weight: 800; font-size: 12px; line-height: 1.15; text-align: left; color: var(--ink); min-width: 0; }
.fl-node .fl-lab { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fl-ic { flex: none; width: 17px; height: 17px; display: grid; place-items: center; border-radius: 50%; font-size: 11px; background: #ffd84a; border: 2px solid var(--line); }
.fl-node.done { background: #e2f5e2; color: #3c6b3c; }
.fl-node.done .fl-ic { background: var(--ok); color: #fff; }
.fl-node.lock { background: #ece6d8; color: #9a8f80; border-color: #c9bb98; }
.fl-node.lock .fl-ic { background: none; border-color: transparent; font-size: 10px; }
.fl-node.open { background: #fff7c9; }
.fl-node.focus { outline: 3px solid #2f6ef0; outline-offset: 1px; animation: flpulse 1.2s ease-in-out infinite; }
@keyframes flpulse { 50% { outline-color: #8fb0f0; } }
#hudParts .tok { font-size: 13px; font-weight: 900; margin-right: 4px; white-space: nowrap; }
.credit { position: absolute; right: max(12px, env(safe-area-inset-right)); bottom: max(12px, env(safe-area-inset-bottom)); z-index: 2; color: #fff; font-size: 12px; font-weight: 700; background: rgba(32, 40, 70, .7); border-radius: 6px; padding: 3px 9px; }
.credit:empty { display: none; }

/* 힌트·해설 */
.hint-area { margin: 0 0 10px; }
.hint-btn { font-weight: 900; font-size: 14px; padding: 5px 12px; border: 3px solid #b88a00; border-radius: 999px; background: #fff3c4; color: #5a4300; box-shadow: 0 2px 0 #b88a00; }
.hint-btn small { font-weight: 700; font-size: 12px; margin-left: 4px; }
.hint-btn:disabled { opacity: .75; box-shadow: none; }
.hint-text { margin-top: 6px; background: #fffbe6; border: 2px dashed #d9a400; border-radius: 8px; padding: 6px 10px; font-weight: 700; font-size: 14px; white-space: pre-line; }
.choice.gone { opacity: .3; text-decoration: line-through; }
.explain { margin-top: 6px; background: #eaf5ff; border: 2px solid #8fb0f0; border-radius: 8px; padding: 7px 10px; font-size: 15px; line-height: 1.5; font-weight: 600; }
.explain b { color: var(--accent); margin-right: 4px; }

/* 수첩·팻말 */
.nb-top { display: flex; gap: 6px; flex-wrap: wrap; }
.nb-chip { display: inline-block; background: #fff; border: 2px solid var(--line); border-radius: 999px; padding: 2px 10px; font-weight: 800; font-size: 13px; }
.nb-chip.bad { color: var(--bad); }
.sign-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.sign-head h2 { margin: 0; }
.sign-i { width: 30px; height: 30px; border-radius: 6px; background: #3c8de0; color: #fff; display: grid; place-items: center; font-weight: 900; font-family: Georgia, serif; font-size: 20px; border: 3px solid var(--line); }
.sign-text { white-space: pre-line; background: #fff; border: 3px solid var(--line); border-radius: 10px; padding: 12px 14px; font-size: 16px; line-height: 1.6; font-weight: 600; }
.ios-guide { display: grid; gap: 8px; text-align: left; }
.ios-guide b:first-child { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--accent2); border: 2px solid var(--line); margin-right: 6px; }
.ios-share { display: inline-block; border: 2px solid var(--accent); color: var(--accent); border-radius: 5px; padding: 0 5px; font-weight: 900; }
.rewards { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-top: 6px; }
.confetti-top { text-align: center; font-size: 34px; line-height: 1; animation: pop .6s ease-out; }
@keyframes pop { 0% { transform: scale(.2); } 70% { transform: scale(1.3); } 100% { transform: scale(1); } }

/* 미니게임 공통 */
.panel.mini { width: min(720px, 100%); }
.mg-title { margin: 0 0 4px !important; }
.mg-intro { margin: 0 0 8px; font-size: 15px; line-height: 1.5; font-weight: 600; color: #4a3f55; }
.mg-btns { align-items: center; }
.mg-btns .sp { flex: 1; }
/* 이름표 */
.lb-legend { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
.lb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.lb-card { display: grid; justify-items: center; gap: 4px; padding: 8px 4px; border: 3px solid var(--line); border-radius: 10px; background: #fff; box-shadow: 0 3px 0 var(--line); }
.lb-card .emo { font-size: 40px; line-height: 1.1; }
.lb-tag { display: inline-block; font-weight: 900; font-size: 13px; padding: 2px 10px; border-radius: 999px; border: 2px solid var(--line); }
.lb-tag.t0 { background: #ffd6a8; } .lb-tag.t1 { background: #b8e6ff; } .lb-tag.t2 { background: #c8f2c0; }
.lb-train { margin-top: 10px; font-weight: 800; }
.lb-train .bar { height: 12px; border: 3px solid var(--line); border-radius: 6px; background: #fff; overflow: hidden; margin-top: 4px; }
.lb-train .bar i { display: block; height: 100%; width: 0; background: var(--accent); animation: train 1s linear forwards; }
@keyframes train { to { width: 100%; } }
/* 암호 */
.cd-place { font-weight: 800; font-size: 14px; margin-bottom: 6px; }
.cd-place b { display: inline-block; background: #2b2233; color: #ffd84a; border-radius: 5px; padding: 0 6px; }
.cd-slots { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 10px; }
.cd-col { display: grid; justify-items: center; gap: 4px; }

// ===== util.js =====
// 공용 도구 함수
const Util = (() => {
  // 고정 시드 난수 (NPC 배치가 매번 같도록)
  function rng(seed) {
    let s = seed >>> 0;
    return () => {
      s = (s + 0x6D2B79F5) >>> 0;
      let t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // 받침 유무에 따라 조사 선택: josa('사서 선생님', '을/를') -> '사서 선생님을'
  function josa(word, pair) {
    const [withBatchim, without] = pair.split('/');
    const last = word.charCodeAt(word.length - 1);
    if (last < 0xAC00 || last > 0xD7A3) return word + without;
    return word + ((last - 0xAC00) % 28 ? withBatchim : without);
  }

  // 랭킹용 이름 가리기: 김민수 -> 김○○
  function maskName(name) {
    if (!name) return '';
    return name[0] + '○'.repeat(Math.max(1, name.length - 1));
  }

  // 주관식 비교용: 띄어쓰기 제거, 소문자
  function normalize(s) {
    return String(s || '').replace(/\s+/g, '').toLowerCase();
  }

  function shuffle(arr, rand = Math.random) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rand() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function formatTime(ms) {
    const total = Math.max(0, Math.floor(ms / 1000));
    const m = Math.floor(total / 60);
    const s = total % 60;
    return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  }

  function gradeGroup(grade) {
    return Number(grade) <= 3 ? 'low' : 'high';
  }

  function groupLabel(group) {
    return group === 'low' ? '저학년 (1~3학년)' : '고학년 (4~6학년)';
  }

  async function sha256(text) {
    const data = new TextEncoder().encode(text);
    const buf = await crypto.subtle.digest('SHA-256', data);
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  // 브라우저 저장소가 막혀 있어도 게임이 멈추지 않도록 감싼다
  const storage = {
    get(key, fallback) {
      try {
        const v = localStorage.getItem(key);
        return v == null ? fallback : JSON.parse(v);
      } catch (e) { return fallback; }
    },
    set(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch (e) { return false; }
    },
    remove(key) {
      try { localStorage.removeItem(key); } catch (e) { /* 무시 */ }
    }
  };

  // 미션 코스: 단계(stage)마다 미션 번호. 한 단계의 미션은 어느 쪽 먼저 해도 되고,
  // 다음 단계는 앞 단계 미션을 모두 끝내야 열린다. 마지막에는 정문에서 로봇 교장선생님 재부팅.
  const COURSES = {
    full: { stages: [[1], [2, 3], [4, 8], [5, 6], [7]] },   // 8: 후관 3층 (방송실 미션과 같은 단계)
    short: { stages: [[1], [3, 4], [6], [7]] }      // 10분 미션: 2층(과학실·컴퓨터실) 없이
  };
  function course(mode) {
    const c = COURSES[mode === 'm10' ? 'short' : 'full'];
    const list = [].concat(...c.stages);
    const prereq = {};
    c.stages.forEach((s, i) => s.forEach(o => { prereq[o] = i ? c.stages[i - 1].slice() : []; }));
    return { stages: c.stages, list, prereq, has: o => list.includes(o) };
  }

  return { rng, josa, maskName, normalize, shuffle, formatTime, gradeGroup, groupLabel, sha256, esc, clone, storage, course };
})();

// ===== daynight.js =====
// 시간대에 따른 밝기 (기기 시계 기준)
// 새벽 06:00~07:30, 낮 07:30~17:00, 노을 17:00~18:30, 밤 18:30~06:00
const DayNight = (() => {
  let forced = null;

  function phase(d) {
    if (forced) return forced;
    d = d || new Date();
    const h = d.getHours() + d.getMinutes() / 60;
    if (h >= 6 && h < 7.5) return 'dawn';
    if (h >= 7.5 && h < 17) return 'day';
    if (h >= 17 && h < 18.5) return 'sunset';
    return 'night';
  }

  const LABEL = { dawn: '새벽', day: '낮', sunset: '노을', night: '밤' };

  // 시험용: DayNight.force('night') / DayNight.force(null)
  function force(p) { forced = p || null; }

  return { phase, force, label: p => LABEL[p || phase()] };
})();

// ===== store.js =====
// 기록·랭킹·콘텐츠 저장소.
// 지금은 브라우저 안(localStorage)에 저장하는 임시 버전(LocalStore)이다.
// 서버(Supabase)를 연결하면 같은 함수 이름을 가진 ServerStore로 바꾸기만 하면 된다.
// 함수는 모두 Promise를 돌려주도록 맞춰 두어, 서버 버전으로 바꿔도 호출부를 고칠 필요가 없다.

const LocalStore = (() => {
  const KEY = 'rp_db_v1';
  const CONTENT_KEY = 'rp_content_v1';
  const ADMIN_KEY = 'rp_admin_hash_v1';

  function load() {
    return Util.storage.get(KEY, { players: [], attempts: [], seq: 1 });
  }
  function save(db) { Util.storage.set(KEY, db); }

  function playerKey(p) { return [p.grade, p.cls, p.num, p.name].join('|'); }

  async function startAttempt(player) {
    const db = load();
    let row = db.players.find(r => r.key === playerKey(player));
    if (!row) {
      row = { id: db.seq++, key: playerKey(player), grade: player.grade, cls: player.cls, num: player.num, name: player.name, createdAt: Date.now() };
      db.players.push(row);
    }
    const attempt = { id: db.seq++, playerId: row.id, mode: player.mode || 'm30', startedAt: Date.now(), finishedAt: null, durationMs: null, steps: [], status: 'playing' };
    db.attempts.push(attempt);
    save(db);
    return { attemptId: attempt.id, playerId: row.id };
  }

  // 미션 순서(코스 단계)대로 완료됐는지 확인하기 위한 기록
  async function completeStep(attemptId, order) {
    const db = load();
    const a = db.attempts.find(x => x.id === attemptId);
    if (!a || a.status !== 'playing') return false;
    const c = Util.course(a.mode);
    const done = a.steps.map(s => s.order);
    if (!c.has(order) || done.includes(order)) return false;
    if (!c.prereq[order].every(o => done.includes(o))) return false;
    a.steps.push({ order, at: Date.now() });
    save(db);
    return true;
  }

  // 이어하기용: 도전이 아직 진행 중인지
  async function getAttempt(attemptId) {
    const a = load().attempts.find(x => x.id === attemptId);
    return a ? { id: a.id, status: a.status, mode: a.mode, startedAt: a.startedAt, steps: a.steps.map(s => s.order) } : null;
  }
  async function abandonAttempt(attemptId) {
    const db = load();
    const a = db.attempts.find(x => x.id === attemptId);
    if (a && a.status === 'playing') { a.status = 'quit'; a.finishedAt = Date.now(); save(db); }
    return true;
  }

  // 제한 시간: 30분/10분 모드. 탐험(free) 모드는 랭킹에 넣지 않는다.
  const LIMITS = { m30: 30 * 60 * 1000, m10: 10 * 60 * 1000, free: 0 };

  // penaltyMs: 힌트 토큰이 없을 때 힌트를 써서 더해진 시간
  async function finishAttempt(attemptId, opts = {}) {
    const db = load();
    const a = db.attempts.find(x => x.id === attemptId);
    if (!a) return null;
    if (a.status === 'playing') {
      a.finishedAt = Date.now();
      a.penaltyMs = Math.max(0, Math.round(opts.penaltyMs || 0));
      a.durationMs = a.finishedAt - a.startedAt + a.penaltyMs;
      const limit = LIMITS[a.mode] || 0;
      if (opts.timeout) a.status = 'timeout';
      else if (a.steps.length !== Util.course(a.mode).list.length) a.status = 'invalid';
      else if (a.mode === 'free') a.status = 'explore';
      else if (limit && a.durationMs > limit + 5000) a.status = 'timeout';
      else a.status = 'cleared';
      save(db);
    }
    const p = db.players.find(x => x.id === a.playerId);
    const group = Util.gradeGroup(p.grade);
    const board = buildRanking(db, group, Infinity, { mode: a.mode === 'free' ? 'all' : a.mode });
    const mine = board.find(r => r.playerId === p.id);
    return { durationMs: a.durationMs, penaltyMs: a.penaltyMs || 0, status: a.status, mode: a.mode, bestMs: mine ? mine.bestMs : null, rank: mine ? mine.rank : null, total: board.length, group };
  }

  // 랭킹 만들기: 코스의 미션을 모두 깬 기록만, 학생별 최고 기록
  //  mode: 'all' | 'm30' | 'm10'  (탐험 모드는 랭킹에 넣지 않는다)
  function buildRanking(db, group, limit, opts = {}) {
    const mode = opts.mode || 'all';
    const best = new Map();
    for (const a of db.attempts) {
      if (a.status !== 'cleared' || a.mode === 'free') continue;
      if (mode !== 'all' && a.mode !== mode) continue;
      const cur = best.get(a.playerId);
      if (!cur || a.durationMs < cur.ms) best.set(a.playerId, { ms: a.durationMs, at: a.finishedAt, mode: a.mode });
    }
    const rows = [];
    for (const [playerId, r] of best) {
      const p = db.players.find(x => x.id === playerId);
      if (!p || Util.gradeGroup(p.grade) !== group) continue;
      rows.push({ playerId, grade: p.grade, cls: p.cls, name: p.name, bestMs: r.ms, at: r.at, mode: r.mode });
    }
    rows.sort((x, y) => x.bestMs - y.bestMs || x.at - y.at);
    rows.forEach((r, i) => { r.rank = i + 1; });
    return rows.slice(0, limit);
  }

  // 접속자 수: 게임에 입장한 학생 수 (같은 학생은 한 번만 센다)
  async function getVisitStats() {
    const db = load();
    const d = new Date(); d.setHours(0, 0, 0, 0);
    const today = new Set(db.attempts.filter(a => a.startedAt >= d.getTime()).map(a => a.playerId));
    const total = new Set(db.attempts.map(a => a.playerId));
    return { today: today.size, total: total.size };
  }

  // 학생 화면용: 이름을 가린 랭킹
  async function getRanking(group, limit = 30, opts = {}) {
    return buildRanking(load(), group, limit, opts).map(r => ({
      rank: r.rank, label: r.grade + '-' + r.cls + ' ' + r.name, bestMs: r.bestMs, mode: r.mode
    }));
  }

  // ---- 관리자 ----
  async function adminHasPassword() { return !!Util.storage.get(ADMIN_KEY, null); }
  async function adminSetPassword(pw) { Util.storage.set(ADMIN_KEY, await Util.sha256('rp:' + pw)); return true; }
  async function adminCheck(pw) { return Util.storage.get(ADMIN_KEY, null) === await Util.sha256('rp:' + pw); }

  async function adminListRecords() {
    const db = load();
    return db.players.map(p => {
      const mine = db.attempts.filter(a => a.playerId === p.id);
      const cleared = mine.filter(a => a.status === 'cleared');
      const best = cleared.reduce((m, a) => (m == null || a.durationMs < m ? a.durationMs : m), null);
      const last = mine.reduce((m, a) => Math.max(m, a.startedAt), 0);
      return { id: p.id, grade: p.grade, cls: p.cls, num: p.num, name: p.name, bestMs: best, tries: mine.length, clears: cleared.length, lastAt: last };
    });
  }

  async function adminDeletePlayer(playerId) {
    const db = load();
    db.players = db.players.filter(p => p.id !== playerId);
    db.attempts = db.attempts.filter(a => a.playerId !== playerId);
    save(db);
    return true;
  }

  async function adminResetAll() {
    save({ players: [], attempts: [], seq: 1 });
    return true;
  }

  // 저장된 콘텐츠가 지금 게임 구조(version 2)와 다르면 기본값을 쓴다.
  // 빠진 항목은 기본값으로 채운다.
  function normalizeContent(c) {
    const d = DEFAULT_CONTENT;
    if (!c || c.version !== d.version || !Array.isArray(c.missions) || c.missions.length !== d.missions.length) return Util.clone(d);
    for (const k in d) if (c[k] == null) c[k] = Util.clone(d[k]);
    c.common = Object.assign({}, d.common, c.common);
    c.signs = Object.assign({}, Util.clone(d.signs), c.signs);
    c.missions.forEach((m, i) => { const dm = d.missions[i]; for (const k in dm) if (m[k] == null) m[k] = Util.clone(dm[k]); m.kind = dm.kind; m.order = dm.order; });
    return c;
  }
  async function getContent() {
    return normalizeContent(Util.storage.get(CONTENT_KEY, null));
  }
  async function adminSaveContent(content) { Util.storage.set(CONTENT_KEY, content); return true; }
  async function adminResetContent() { Util.storage.remove(CONTENT_KEY); return true; }

  return {
    mode: 'local',
    startAttempt, completeStep, getAttempt, abandonAttempt, finishAttempt, getRanking, getVisitStats,
    adminHasPassword, adminSetPassword, adminCheck, adminListRecords, adminDeletePlayer, adminResetAll,
    getContent, adminSaveContent, adminResetContent, normalizeContent
  };
})();

// 서버 버전: Supabase의 rp_ 함수(supabase/schema.sql)를 부른다.
// config.json 에 supabaseUrl, supabaseAnonKey 를 넣고 build.py 를 실행하면 자동으로 이쪽을 쓴다.
const ServerStore = (() => {
  const cfg = window.RP_CONFIG || {};
  let adminPw = null;
  let contentCache = null;
  async function rpc(fn, args) {
    const r = await fetch(String(cfg.supabaseUrl).replace(/\/$/, '') + '/rest/v1/rpc/' + fn, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: cfg.supabaseAnonKey, Authorization: 'Bearer ' + cfg.supabaseAnonKey },
      body: JSON.stringify(args || {})
    });
    if (!r.ok) throw new Error(fn + ' ' + r.status + ' ' + (await r.text()).slice(0, 200));
    const t = await r.text();
    return t ? JSON.parse(t) : null;
  }
  return {
    mode: 'server',
    startAttempt: p => rpc('rp_start_attempt', { p_grade: p.grade, p_cls: p.cls, p_num: p.num, p_name: p.name, p_mode: p.mode || 'm30' }),
    completeStep: (id, order) => rpc('rp_complete_step', { p_attempt: id, p_order: order }),
    getAttempt: id => rpc('rp_get_attempt', { p_attempt: id }),
    abandonAttempt: id => rpc('rp_abandon_attempt', { p_attempt: id }),
    finishAttempt: (id, opts = {}) => rpc('rp_finish_attempt', { p_attempt: id, p_timeout: !!opts.timeout, p_penalty: Math.round(opts.penaltyMs || 0) }),
    getRanking: (group, limit = 30, opts = {}) => rpc('rp_ranking', { p_group: group, p_mode: opts.mode || 'all', p_limit: limit }),
    getVisitStats: () => rpc('rp_visit_stats'),
    adminHasPassword: () => rpc('rp_admin_has_password'),
    async adminSetPassword(pw) { const ok = await rpc('rp_admin_set_password', { p_pw: pw }); if (ok) adminPw = pw; return ok; },
    async adminCheck(pw) { const ok = await rpc('rp_admin_check', { p_pw: pw }); if (ok) adminPw = pw; return ok; },
    adminListRecords: () => rpc('rp_admin_records', { p_pw: adminPw }),
    adminDeletePlayer: id => rpc('rp_admin_delete_player', { p_pw: adminPw, p_id: id }),
    adminResetAll: () => rpc('rp_admin_reset', { p_pw: adminPw }),
    async getContent() {
      // 서버에 저장된 콘텐츠 (없거나 연결이 안 되면 기본값). 한 번 받으면 잠시 기억해 둔다.
      if (contentCache && Date.now() - contentCache.at < 60000) return Util.clone(contentCache.c);
      let c = null;
      try { c = await rpc('rp_get_content'); } catch (e) { c = null; }
      c = LocalStore.normalizeContent(c);
      contentCache = { c, at: Date.now() };
      return Util.clone(c);
    },
    async adminSaveContent(c) { const ok = await rpc('rp_admin_save_content', { p_pw: adminPw, p_content: c }); contentCache = null; return ok; },
    async adminResetContent() { const ok = await rpc('rp_admin_reset_content', { p_pw: adminPw }); contentCache = null; return ok; }
  };
})();

const Store = (window.RP_CONFIG && window.RP_CONFIG.supabaseUrl && window.RP_CONFIG.supabaseAnonKey) ? ServerStore : LocalStore;

// ===== audio.js =====
// 레트로 칩튠 배경음악과 효과음 (Web Audio로 직접 합성, 음원 파일 없음)
const Sound = (() => {
  let ctx = null;
  let master = null;
  let musicGain = null;
  let muted = Util.storage.get('rp_muted', false);
  let track = null;       // 'outdoor' | 'indoor' | null
  let timer = null;
  let step = 0;
  let nextTime = 0;

  const NOTE = n => 440 * Math.pow(2, (n - 69) / 12);

  // 16분음표 기준 패턴. 0 = 쉼표
  const TRACKS = {
    // 첫 화면: 밝은 행진곡 느낌
    title: {
      bpm: 120,
      lead: [72, 0, 72, 74, 76, 0, 76, 0, 77, 76, 74, 0, 72, 0, 0, 0,
             74, 0, 74, 76, 77, 0, 79, 0, 81, 79, 77, 0, 76, 0, 0, 0,
             79, 0, 79, 77, 76, 0, 74, 0, 72, 0, 76, 0, 79, 0, 84, 0,
             83, 0, 81, 0, 79, 0, 77, 0, 76, 0, 74, 0, 72, 0, 0, 0],
      bass: [48, 0, 0, 0, 55, 0, 0, 0, 48, 0, 0, 0, 55, 0, 0, 0,
             53, 0, 0, 0, 57, 0, 0, 0, 53, 0, 0, 0, 57, 0, 0, 0,
             55, 0, 0, 0, 59, 0, 0, 0, 55, 0, 0, 0, 59, 0, 0, 0,
             55, 0, 0, 0, 53, 0, 0, 0, 48, 0, 0, 0, 48, 0, 0, 0]
    },
    outdoor: {
      bpm: 132,
      lead: [72, 0, 76, 0, 79, 0, 76, 0, 74, 0, 77, 0, 81, 0, 77, 0, 76, 0, 79, 0, 84, 0, 79, 0, 77, 76, 74, 0, 72, 0, 0, 0,
             72, 0, 76, 0, 79, 0, 76, 0, 74, 0, 77, 0, 81, 0, 79, 77, 76, 0, 74, 0, 72, 0, 74, 0, 76, 0, 74, 0, 72, 0, 0, 0],
      bass: [48, 0, 0, 0, 55, 0, 0, 0, 50, 0, 0, 0, 57, 0, 0, 0, 52, 0, 0, 0, 55, 0, 0, 0, 53, 0, 0, 0, 55, 0, 0, 0,
             48, 0, 0, 0, 55, 0, 0, 0, 50, 0, 0, 0, 57, 0, 0, 0, 53, 0, 0, 0, 55, 0, 0, 0, 48, 0, 0, 0, 48, 0, 0, 0]
    },
    indoor: {
      bpm: 104,
      lead: [69, 0, 72, 0, 76, 0, 0, 0, 74, 0, 72, 0, 71, 0, 0, 0, 72, 0, 76, 0, 79, 0, 0, 0, 77, 0, 76, 0, 74, 0, 0, 0,
             69, 0, 72, 0, 76, 0, 0, 0, 74, 0, 72, 0, 71, 0, 72, 0, 74, 0, 72, 0, 71, 0, 67, 0, 69, 0, 0, 0, 0, 0, 0, 0],
      bass: [45, 0, 0, 0, 52, 0, 0, 0, 50, 0, 0, 0, 52, 0, 0, 0, 48, 0, 0, 0, 55, 0, 0, 0, 53, 0, 0, 0, 52, 0, 0, 0,
             45, 0, 0, 0, 52, 0, 0, 0, 50, 0, 0, 0, 52, 0, 0, 0, 53, 0, 0, 0, 52, 0, 0, 0, 45, 0, 0, 0, 45, 0, 0, 0]
    }
  };

  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = muted ? 0 : 0.5;
    master.connect(ctx.destination);
    musicGain = ctx.createGain();
    musicGain.gain.value = 0.35;
    musicGain.connect(master);
  }

  function tone(freq, start, dur, type, vol, dest, slideTo) {
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, start);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, start + dur);
    g.gain.setValueAtTime(vol, start);
    g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    o.connect(g); g.connect(dest || master);
    o.start(start); o.stop(start + dur + 0.02);
  }

  function schedule() {
    if (!ctx || !track) return;
    const t = TRACKS[track];
    const sixteenth = 60 / t.bpm / 4;
    while (nextTime < ctx.currentTime + 0.15) {
      const i = step % t.lead.length;
      if (t.lead[i]) tone(NOTE(t.lead[i]), nextTime, sixteenth * 1.8, 'square', 0.12, musicGain);
      if (t.bass[i]) tone(NOTE(t.bass[i]), nextTime, sixteenth * 3.5, 'triangle', 0.3, musicGain);
      if (i % 8 === 4) noise(nextTime, 0.05, 0.05, musicGain);
      nextTime += sixteenth;
      step++;
    }
  }

  function noise(start, dur, vol, dest) {
    const len = Math.floor(ctx.sampleRate * dur);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = ctx.createBufferSource();
    const g = ctx.createGain();
    src.buffer = buf;
    g.gain.setValueAtTime(vol, start);
    g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    src.connect(g); g.connect(dest || master);
    src.start(start);
  }

  function playMusic(name) {
    if (!ctx || track === name) return;
    track = name;
    step = 0;
    nextTime = ctx.currentTime + 0.05;
    if (!timer) timer = setInterval(schedule, 50);
  }

  function stopMusic() {
    track = null;
    if (timer) { clearInterval(timer); timer = null; }
  }

  function sfx(name) {
    if (!ctx || muted) return;
    const t = ctx.currentTime;
    switch (name) {
      case 'jump': tone(330, t, 0.15, 'square', 0.15, null, 660); break;
      case 'spin': [523, 659, 784, 1047].forEach((f, i) => tone(f, t + i * 0.05, 0.08, 'square', 0.12)); break;
      case 'talk': tone(880, t, 0.04, 'square', 0.06); break;
      case 'pick': tone(988, t, 0.06, 'square', 0.12); tone(1319, t + 0.06, 0.1, 'square', 0.12); break;
      case 'correct': [523, 659, 784].forEach((f, i) => tone(f, t + i * 0.08, 0.14, 'square', 0.14)); break;
      case 'wrong': tone(160, t, 0.3, 'sawtooth', 0.12, null, 100); break;
      case 'part': [659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, t + i * 0.07, 0.12, 'square', 0.13)); break;
      case 'clear':
        [523, 523, 523, 659, 784, 0, 659, 784, 1047].forEach((f, i) => { if (f) tone(f, t + i * 0.12, 0.2, 'square', 0.14); });
        [262, 330, 392, 523].forEach((f, i) => tone(f, t + i * 0.24, 0.3, 'triangle', 0.25));
        break;
      case 'door': noise(t, 0.12, 0.12); tone(220, t, 0.12, 'square', 0.06, null, 110); break;
    }
  }

  function setMuted(m) {
    muted = m;
    Util.storage.set('rp_muted', m);
    if (master) master.gain.value = m ? 0 : 0.5;
  }

  return { init, playMusic, stopMusic, sfx, setMuted, isMuted: () => muted, current: () => track };
})();

  function onEmblem(fn) { if (EMBLEM.complete && EMBLEM.naturalWidth) fn(); else EMBLEM.addEventListener('load', fn); }

  function hash(x, y, s) {
    let h = (x * 374761393 + y * 668265263 + s * 1442695041) | 0;
    h = (h ^ (h >>> 13)) * 1274126177;
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }

  function drawTile(g, t, tx, ty, below) {
    const x = tx * T, y = ty * T;
    switch (t) {
      case TILE.GRASS:
      case TILE.FLOWER: {
        px(g, x, y, T, T, '#5fae4b');
        for (let i = 0; i < 6; i++) {
          const a = hash(tx, ty, i), b = hash(tx, ty, i + 9);
          px(g, x + Math.floor(a * 15), y + Math.floor(b * 15), 1, 2, '#4c9a3c');
        }

          const cols = ['#ffd84a', '#ff7aa8', '#ffffff'];

            px(g, fx + 1, fy + 2, 1, 1, '#3d8a30');

      case TILE.PATH:

        for (let i = 0; i < 4; i++) px(g, x + Math.floor(hash(tx, ty, i) * 15), y + Math.floor(hash(tx, ty, i + 5) * 15), 2, 1, '#c4a974');
        break;
      case TILE.FIELD:
      case TILE.LINE:
        px(g, x, y, T, T, '#c98f5a');
        for (let i = 0; i < 5; i++) px(g, x + Math.floor(hash(tx, ty, i) * 15), y + Math.floor(hash(tx, ty, i + 7) * 15), 1, 1, '#b57c48');

        break;

          px(g, x + ((r * 7 + tx * 3) % 16), y + r * 4, 1, 3, '#ad7a46');
        }
        break;
      case TILE.HALL:
        px(g, x, y, T, T, '#e6e1d3');
        px(g, x, y, T, 1, '#d2ccbb'); px(g, x, y, 1, T, '#d2ccbb');
        if ((tx + ty) % 2 === 0) px(g, x + 1, y + 1, 15, 15, '#ebe7da');

        px(g, x, y + 7, T, 1, '#6b5aa0');

          px(g, x, y + 4, T, 12, '#f1e3c4');

        px(g, x + 1, y + 3, 14, 7, '#2f7d3b');

        break;
      case TILE.HEDGE:        // 울타리를 따라 심은 산울타리
        px(g, x, y, T, T, '#3f7f3a');
        for (let i = 0; i < 5; i++) px(g, x + Math.floor(hash(tx, ty, i) * 12), y + Math.floor(hash(tx, ty, i + 9) * 12), 4, 4, i % 2 ? '#4f9a46' : '#356e31');
        px(g, x, y + 14, T, 2, '#2c5a29');
        break;
      case TILE.SIDEWALK:     // 학교 밖 인도
        px(g, x, y, T, T, '#c9c3b6');
        px(g, x, y + 7, T, 1, '#b3ad9f'); px(g, x + 7, y, 1, 7, '#b3ad9f'); px(g, x + 3, y + 8, 1, 8, '#b3ad9f');
        break;
      case TILE.FOREST:       // 학교 동쪽 숲
        px(g, x, y, T, T, '#2f6a33');
        for (let i = 0; i < 4; i++) px(g, x + Math.floor(hash(tx, ty, i) * 11), y + Math.floor(hash(tx, ty, i + 9) * 11), 6, 5, i % 2 ? '#3d8040' : '#26582a');
        break;
      case TILE.CLIFF:        // 높이가 다른 곳 사이의 옹벽
        px(g, x, y, T, T, '#a8a49a');
        for (let r = 0; r < 4; r++) px(g, x, y + r * 4 + 3, T, 1, '#8c887e');
        px(g, x, y, T, 3, '#c9c5bb'); px(g, x + T - 3, y, 3, T, '#77736a');
        break;
      case TILE.LOWPAVE:      // 한 층 낮은 마당
        px(g, x, y, T, T, '#a9abb1');
        for (let r = 0; r < 4; r++) px(g, x, y + r * 4 + 3, T, 1, '#9b9da3');
        if (hash(tx, ty, 3) < 0.25) px(g, x + 5, y + 8, 4, 3, '#e3e4e8');
        break;
      case TILE.GARDEN:       // 텃밭 (흙 이랑 + 채소)
        px(g, x, y, T, T, '#7a5a3a');
        for (let r = 0; r < 2; r++) {
          px(g, x, y + r * 8, T, 3, '#8d6a45');
          for (let c = 0; c < 4; c++) px(g, x + 1 + c * 4, y + r * 8 + 3, 3, 3, (tx + c + r) % 3 ? '#4f9a3d' : '#7fc25e');
        }
        px(g, x, y + T - 1, T, 1, '#5e4329');
        break;
      case TILE.OSTAIR:       // 바깥 계단
        px(g, x, y, T, T, '#bdb9ae');
        for (let i = 0; i < 4; i++) { px(g, x, y + i * 4, T, 3, '#d4d0c6'); px(g, x, y + i * 4 + 3, T, 1, '#8c887e'); }
        px(g, x, y, 1, T, '#9aa0a8'); px(g, x + T - 1, y, 1, T, '#9aa0a8');
        break;
      case TILE.MAT:          // 늘봄교실 놀이 매트
        px(g, x, y, T, T, ['#f7c6c6', '#c6e2f7', '#d8f2c4', '#fbe7a8'][(tx + ty * 3) % 4]);
        px(g, x, y, T, 1, 'rgba(0,0,0,0.06)'); px(g, x, y, 1, T, 'rgba(0,0,0,0.06)');
        break;
    }
  }

  // 바깥 맵의 건물: 위는 지붕, 아래쪽은 세워 그린 정면(창문·현관)
  // b.doors = [{ x, w, kind }]  (kind: 'main' 중앙현관 | 'glass' | 'plain')
  // b.style = 'brick' 이면 빨간 벽돌 + 크림색 띠 (대교초 건물)
  function drawBuilding(g, b) {
    if (b.cells) return drawBlock(g, b);
    const x = b.x * T, y = b.y * T, w = b.w * T, h = b.h * T;
    const faceH = b.floors * T;
    const roofH = h - faceH;
    const doors = b.doors || [{ x: b.door, w: b.doorW }];
    const brick = b.style === 'brick';
    // 지붕 (평평한 옥상)
    px(g, x, y, w, roofH, b.roof);
    for (let ry = 0; ry < roofH; ry += 8) px(g, x, y + ry + 7, w, 1, shade(b.roof, -12));
    for (let rx = 0; rx < w; rx += 32) px(g, x + rx + 31, y, 1, roofH, shade(b.roof, -12));
    px(g, x, y, w, 2, shade(b.roof, 28)); px(g, x, y, 2, roofH, shade(b.roof, 18)); px(g, x + w - 2, y, 2, roofH, shade(b.roof, -20));
    px(g, x, y + roofH - 3, w, 3, shade(b.roof, -35));
    (b.roofItems || []).forEach(r => { px(g, x + r[0] * T, y + r[1] * T, r[2] * T, r[3] * T, shade(b.roof, -22)); px(g, x + r[0] * T + 2, y + r[1] * T + 2, r[2] * T - 4, r[3] * T - 4, shade(b.roof, 10)); });
    // 정면 벽
    b.windows = [];
    px(g, x, y + roofH, w, faceH, b.wall);
    if (brick) {
      for (let yy = 0; yy < faceH; yy += 3) {
        px(g, x, y + roofH + yy + 2, w, 1, shade(b.wall, -22));
        for (let xx = (yy / 3) % 2 ? 0 : 3; xx < w; xx += 6) px(g, x + xx, y + roofH + yy, 1, 2, shade(b.wall, -16));
      }
    }
    px(g, x, y + roofH, w, 2, shade(b.wall, -30));
    const inDoor = (wx, ww) => doors.some(d => wx + ww > d.x * T - 6 && wx < (d.x + d.w) * T + 6);
    for (let f = 0; f < b.floors; f++) {
      const fy = y + roofH + f * T;
      if (brick) { px(g, x, fy, w, 2, '#ecd59a'); px(g, x, fy + 2, w, 1, '#c9ae6e'); }
      else px(g, x, fy + T - 1, w, 1, shade(b.wall, -20));
      const step = b.winStep || 16;
      for (let wx = x + 5; wx + 11 < x + w - 3; wx += step) {
        if (f === b.floors - 1 && inDoor(wx, 11)) continue;
        px(g, wx, fy + 4, 11, 9, brick ? '#f4f1e8' : '#33495e');
        px(g, wx + 1, fy + 5, 9, 7, '#8fc3e6');
        b.windows.push({ x: wx + 1, y: fy + 5, w: 9, h: 7 });
        px(g, wx + 1, fy + 5, 3, 2, '#d4ecfa');
        px(g, wx + 5, fy + 4, 1, 9, brick ? '#f4f1e8' : '#33495e');
        px(g, wx + 1, fy + 8, 9, 1, brick ? '#f4f1e8' : '#33495e');
      }
    }
    // 꼭대기 색 띠 (빨강·주황·노랑·초록)
    if (b.stripes) {
      const cols = ['#e23b3b', '#ff8a2a', '#ffd23a', '#46b866'];
      b.stripes.forEach((sx, i) => px(g, x + sx * T, y + roofH + 3, 6, T - 3, cols[i % 4]));
    }
    // 현관
    for (const d of doors) {
      const dx = d.x * T, dw = d.w * T, dy = y + h - T;
      if (d.kind === 'main') {
        // 중앙현관: 돌기둥과 넓은 차양
        px(g, dx - 10, dy - 9, dw + 20, 5, '#6f7279'); px(g, dx - 10, dy - 9, dw + 20, 1, '#9fa3ab');
        px(g, dx - 8, dy - 4, 4, T + 4, '#d6d2c8'); px(g, dx + dw + 4, dy - 4, 4, T + 4, '#d6d2c8');
        px(g, dx + 4, dy - 8, dw - 8, 2, '#6fd3c7');
      } else {
        px(g, dx - 3, dy - 6, dw + 6, 6, '#c9c4b8'); px(g, dx - 3, dy - 6, dw + 6, 1, '#e8e4da');
      }
      px(g, dx, dy, dw, T, '#4a5160');
      px(g, dx + 2, dy + 2, dw / 2 - 3, T - 2, '#8fc3e6');
      px(g, dx + dw / 2 + 1, dy + 2, dw / 2 - 3, T - 2, '#8fc3e6');
      px(g, dx + dw / 2 - 1, dy + 1, 2, T - 1, '#c0c6cc');
    }
    // 간판 판 (글자는 화면 위에 따로 그림)
    if (b.name) {
      const sw = Math.min(w - 16, b.name.length * 9 + 16);
      const sx = b.signX != null ? b.signX * T - sw / 2 : x + (w - sw) / 2;
      px(g, sx, y + roofH - 13, sw, 11, '#f7f2e3');
      px(g, sx, y + roofH - 13, sw, 1, '#c8b98f');
      px(g, sx, y + roofH - 3, sw, 1, '#a39370');
      b.signRect = { x: sx, y: y + roofH - 13, w: sw, h: 11 };
    }
  }

  // 항공사진 모양 그대로의 건물 (칸 모양이 자유로운 덩어리)
  // b = { cells: Set('x,y'), roof, wall, face(정면 높이 칸), floors, style, doors: Set('x,y'), stripes: [x], ribs }
  // 각 세로줄의 아래쪽 face칸은 정면(벽·창문), 그 위는 옥상으로 그린다.
  function drawBlock(g, b) {
    b.windows = [];
    const has = (x, y) => b.cells.has(x + ',' + y);
    const cols = {};
    for (const k of b.cells) { const [x, y] = k.split(',').map(Number); (cols[x] = cols[x] || []).push(y); }
    const faceRows = new Set();
    for (const xs in cols) {
      const x = +xs, ys = cols[x].sort((a, c) => a - c);
      const runs = [];
      let s0 = ys[0], p0 = ys[0];
      for (const y of ys.slice(1)) { if (y === p0 + 1) { p0 = y; continue; } runs.push([s0, p0]); s0 = p0 = y; }
      runs.push([s0, p0]);
      for (const [y0, y1] of runs) {
        const f = b.face ? Math.min(b.face, Math.max(1, y1 - y0)) : 0;
        for (let y = y1 - f + 1; y <= y1; y++) faceRows.add(x + ',' + y);
      }
    }
    const isFace = (x, y) => faceRows.has(x + ',' + y);
    // 옥상
    for (const k of b.cells) {
      const [tx, ty] = k.split(',').map(Number);
      if (isFace(tx, ty)) continue;
      const x = tx * T, y = ty * T;
      px(g, x, y, T, T, b.roof);
      if (b.ribs) for (let i = 1; i < T; i += 4) px(g, x + i, y, 1, T, shade(b.roof, -14));
      else { if ((tx + ty) % 2 === 0) px(g, x + 2, y + 2, T - 4, T - 4, shade(b.roof, 5)); px(g, x, y + T - 1, T, 1, shade(b.roof, -8)); }
      if (!has(tx, ty - 1)) { px(g, x, y, T, 3, shade(b.roof, 30)); px(g, x, y + 3, T, 1, shade(b.roof, -25)); }
      if (!has(tx - 1, ty) || (isFace(tx - 1, ty) && !isFace(tx, ty))) px(g, x, y, 2, T, shade(b.roof, 22));
      if (!has(tx + 1, ty) || (isFace(tx + 1, ty) && !isFace(tx, ty))) px(g, x + T - 2, y, 2, T, shade(b.roof, -28));
    }
    (b.roofItems || []).forEach(r => { px(g, r[0] * T, r[1] * T, r[2] * T, r[3] * T, shade(b.roof, -30)); px(g, r[0] * T + 2, r[1] * T + 2, r[2] * T - 4, r[3] * T - 4, shade(b.roof, 15)); });
    // 정면
    const brick = b.style === 'brick';
    for (const xs in cols) {
      const tx = +xs;
      const rows = cols[tx].filter(y => isFace(tx, y)).sort((a, c) => a - c);
      if (!rows.length) continue;
      // 이어진 정면 덩어리마다
      let i = 0;
      while (i < rows.length) {
        let j = i; while (j + 1 < rows.length && rows[j + 1] === rows[j] + 1) j++;
        const ya = rows[i] * T, yb = (rows[j] + 1) * T, h = yb - ya, x = tx * T;
        px(g, x, ya, T, h, b.wall);
        if (brick) for (let yy = 0; yy < h; yy += 3) {
          px(g, x, ya + yy + 2, T, 1, shade(b.wall, -22));
          for (let xx = (yy / 3) % 2 ? 0 : 3; xx < T; xx += 6) px(g, x + xx, ya + yy, 1, 2, shade(b.wall, -16));
        } else for (let yy = 0; yy < h; yy += 8) px(g, x, ya + yy + 7, T, 1, shade(b.wall, -14));
        px(g, x, ya, T, 2, shade(b.wall, -35));
        const fl = b.floors || 1, fh = h / fl;
        const door = b.doors && b.doors.has(tx + ',' + rows[j]);
        for (let f = 0; f < fl; f++) {
          const fy = Math.round(ya + f * fh);
          if (brick) { px(g, x, fy, T, 2, '#ecd59a'); px(g, x, fy + 2, T, 1, '#c9ae6e'); }
          if (door && f === fl - 1) continue;
          const wh = Math.max(4, Math.round(fh) - 6);
          px(g, x + 2, fy + 3, 12, wh, brick ? '#f4f1e8' : '#3d4654');
          px(g, x + 3, fy + 4, 10, wh - 2, '#8fc3e6');
          b.windows.push({ x: x + 3, y: fy + 4, w: 10, h: wh - 2 });
          px(g, x + 3, fy + 4, 3, 2, '#d4ecfa');
          px(g, x + 8, fy + 3, 1, wh, brick ? '#f4f1e8' : '#3d4654');
        }
        if (b.stripes && b.stripes.includes(tx)) {
          const cols4 = ['#e23b3b', '#ff8a2a', '#ffd23a', '#46b866'];
          px(g, x + 1, ya + 3, 4, Math.round(fh) - 4, cols4[b.stripes.indexOf(tx) % 4]);
        }
        if (!isFace(tx - 1, rows[i])) px(g, x, ya, 1, h, shade(b.wall, 25));
        if (!isFace(tx + 1, rows[i])) px(g, x + T - 1, ya, 1, h, shade(b.wall, -40));
        if (door) {
          const dy = yb - Math.round(fh);
          px(g, x, dy - 3, T, 3, '#c9c4b8'); px(g, x, dy - 3, T, 1, '#e8e4da');
          px(g, x + 1, dy, T - 2, yb - dy, '#4a5160');
          px(g, x + 2, dy + 2, T - 4, yb - dy - 2, '#8fc3e6'); px(g, x + 7, dy + 1, 2, yb - dy - 1, '#c0c6cc');
        }
        px(g, x, yb - 2, T, 2, shade(b.wall, -45));
        i = j + 1;
      }
    }
    if (b.name && b.signAt) {
      const sw = b.name.length * 9 + 16;
      const sx = b.signAt[0] * T - sw / 2, sy = b.signAt[1] * T;
      px(g, sx, sy, sw, 11, '#f7f2e3'); px(g, sx, sy, sw, 1, '#c8b98f'); px(g, sx, sy + 10, sw, 1, '#a39370');
      b.signRect = { x: sx, y: sy, w: sw, h: 11 };
    }
  }

  // 모래 놀이터 둘레의 알록달록한 타이어
  function makeTireBorder(w, h) {
    const [c, g] = canvas(w * T, h * T);
    const cols = ['#e23b3b', '#ff8a2a', '#ffd23a', '#46b866', '#3d6fe9', '#8a4fd8'];
    let i = 0;
    const tire = (x, y) => { px(g, x, y, 6, 6, '#2b2b2b'); px(g, x + 1, y + 1, 4, 4, cols[i++ % cols.length]); px(g, x + 2, y + 2, 2, 2, '#2b2b2b'); };
    for (let x = 0; x <= w * T - 6; x += 6) { tire(x, 0); tire(x, h * T - 6); }
    for (let y = 6; y <= h * T - 12; y += 6) { tire(0, y); tire(w * T - 6, y); }
    return c;
  }
  // 위에서 본 자동차 (위쪽이 앞)
  function makeCarTop(col) {
    const [c, g] = canvas(14, 24);
    px(g, 1, 2, 12, 20, col); px(g, 2, 1, 10, 2, col); px(g, 2, 21, 10, 2, col);
    px(g, 2, 5, 10, 4, '#2c3a4a'); px(g, 3, 6, 8, 1, '#6fa8d8'); px(g, 2, 16, 10, 3, '#2c3a4a');
    px(g, 3, 10, 8, 5, shade(col, 18));
    px(g, 0, 4, 1, 4, '#222'); px(g, 13, 4, 1, 4, '#222'); px(g, 0, 16, 1, 4, '#222'); px(g, 13, 16, 1, 4, '#222');
    px(g, 2, 0, 3, 1, '#fff6c4'); px(g, 9, 0, 3, 1, '#fff6c4'); px(g, 2, 23, 3, 1, '#e23b3b'); px(g, 9, 23, 3, 1, '#e23b3b');
    return c;
  }

  // 체육시설 바닥: 위쪽 농구 코트 + 아래쪽 네트 코트 (항공사진처럼 세로 방향)
  function makeCourtMarks(w, h) {
    const [c, g] = canvas(w * T, h * T);
    const W2 = 'rgba(255,255,255,0.9)';
    const CW = w * T, CH = h * T;
    const bTop = 6, bBot = Math.round(CH * 0.63), bx = 6, bw = CW - 12;   // 농구 코트
    const mid = (bTop + bBot) / 2, cx = CW / 2;
    // 자유투 구역은 조금 진한 색
    g.fillStyle = 'rgba(30, 110, 100, 0.45)';
    g.fillRect(cx - 14, bTop, 28, 38); g.fillRect(cx - 14, bBot - 38, 28, 38);
    g.strokeStyle = W2; g.lineWidth = 1;
    g.strokeRect(bx + 0.5, bTop + 0.5, bw - 1, bBot - bTop - 1);
    g.beginPath(); g.moveTo(bx, Math.round(mid) + 0.5); g.lineTo(bx + bw, Math.round(mid) + 0.5); g.stroke();
    g.beginPath(); g.arc(cx, mid, 12, 0, Math.PI * 2); g.stroke();
    for (const top of [true, false]) {
      const y0 = top ? bTop : bBot, dir = top ? 1 : -1;
      g.strokeRect(cx - 14 + 0.5, top ? y0 + 0.5 : y0 - 38 + 0.5, 27, 37);                   // 자유투 구역
      g.beginPath(); g.arc(cx, y0 + dir * 38, 12, top ? 0 : Math.PI, top ? Math.PI : Math.PI * 2); g.stroke();   // 자유투 원
      g.beginPath(); g.moveTo(bx + 5, y0); g.lineTo(bx + 5, y0 + dir * 22);                    // 3점 라인
      g.arc(cx, y0 + dir * 22, cx - bx - 5, top ? Math.PI : 0, top ? 0 : Math.PI, !top);
      g.lineTo(bx + bw - 5, y0); g.stroke();
    }
    // 아래쪽 네트 코트 (배드민턴·족구)
    const nTop = bBot + 14, nBot = CH - 8, nx = 14, nw = CW - 28, nm = (nTop + nBot) / 2;
    g.strokeRect(nx + 0.5, nTop + 0.5, nw - 1, nBot - nTop - 1);
    g.beginPath(); g.moveTo(nx + 6.5, nTop); g.lineTo(nx + 6.5, nBot); g.moveTo(nx + nw - 6.5, nTop); g.lineTo(nx + nw - 6.5, nBot); g.stroke();
    g.beginPath(); g.moveTo(cx + 0.5, nTop); g.lineTo(cx + 0.5, nm - 14); g.moveTo(cx + 0.5, nm + 14); g.lineTo(cx + 0.5, nBot); g.stroke();
    g.beginPath(); g.moveTo(nx, nm - 14 + 0.5); g.lineTo(nx + nw, nm - 14 + 0.5); g.moveTo(nx, nm + 14 + 0.5); g.lineTo(nx + nw, nm + 14 + 0.5); g.stroke();
    // 네트와 기둥
    px(g, nx - 4, Math.round(nm) - 1, nw + 8, 2, '#f4f4f4');
    for (let x = nx; x < nx + nw; x += 3) px(g, x, Math.round(nm) - 1, 1, 2, '#9aa0a8');
    px(g, nx - 6, Math.round(nm) - 4, 3, 6, '#3d4654'); px(g, nx + nw + 3, Math.round(nm) - 4, 3, 6, '#3d4654');
    return c;
  }

  // 운동장 선 (트랙 레인 + 축구장)
  function makeFieldMarks(w, h, fx, fy, fw, fh) {
    const [c, g] = canvas(w * T, h * T);
    const W2 = 'rgba(255,255,255,0.85)', W1 = 'rgba(255,255,255,0.45)';
    const ring = (x, y, ww, hh, r, col) => { g.strokeStyle = col; g.lineWidth = 1; g.beginPath(); g.roundRect(x + 0.5, y + 0.5, ww - 1, hh - 1, r); g.stroke(); };
    for (let i = 0; i < 4; i++) ring(6 + i * 6, 6 + i * 6, w * T - 12 - i * 12, h * T - 12 - i * 12, h * T / 2 - 6 - i * 6, W1);
    const X = fx * T, Y = fy * T, FW = fw * T, FH = fh * T;
    g.strokeStyle = W2; g.lineWidth = 1;
    g.strokeRect(X + 0.5, Y + 0.5, FW - 1, FH - 1);
    g.beginPath(); g.moveTo(X + FW / 2 + 0.5, Y); g.lineTo(X + FW / 2 + 0.5, Y + FH); g.stroke();
    g.beginPath(); g.arc(X + FW / 2, Y + FH / 2, 22, 0, Math.PI * 2); g.stroke();
    for (const side of [0, 1]) {
      const bx = side ? X + FW - 50 : X, gx = side ? X + FW - 18 : X;
      g.strokeRect(bx + 0.5, Y + FH / 2 - 52, 50, 104);
      g.strokeRect(gx + 0.5, Y + FH / 2 - 24, 18, 48);
    }
    return c;
  }

  function shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    const r = Math.max(0, Math.min(255, (n >> 16) + amt));
    const gr = Math.max(0, Math.min(255, ((n >> 8) & 255) + amt));
    const b = Math.max(0, Math.min(255, (n & 255) + amt));
    return '#' + ((r << 16) | (gr << 8) | b).toString(16).padStart(6, '0');
  }

  // ---------- 캐릭터 ----------
  // pal: { skin, hair, shirt, pants, shoes, hat?, glasses?, coat?, long? }
  function makeChar(pal) {
    const dirs = ['down', 'up', 'left', 'right'];
    const frames = {};
    for (const d of dirs) {
      frames[d] = [0, 1].map(f => {
        const [c, g] = canvas(16, 16);
        paintChar(g, pal, d, f);
        return c;
      });
    }
    return frames;
  }

  function paintChar(g, p, dir, f) {
    const hair = p.hair, skin = p.skin;
    // 다리
    const l1 = f ? 1 : 0, l2 = f ? 0 : 1;
    if (dir === 'left' || dir === 'right') {
      px(g, 6, 12, 4, 2, p.pants);
      px(g, f ? 5 : 6, 14, 2, 1, p.pants); px(g, f ? 9 : 8, 14, 2, 1, p.pants);
      px(g, f ? 4 : 6, 15, 3, 1, p.shoes); px(g, f ? 9 : 8, 15, 3, 1, p.shoes);
    } else {
      px(g, 5, 12, 6, 1, p.pants);
      px(g, 5, 13, 2, 2 - l1, p.pants); px(g, 9, 13, 2, 2 - l2, p.pants);
      px(g, 5, 15 - l1, 2, 1, p.shoes); px(g, 9, 15 - l2, 2, 1, p.shoes);
    }
    // 몸
    const body = p.coat || p.shirt;
    px(g, 4, 8, 8, 4, body);
    px(g, 4, 11, 8, 1, shade(body, -25));
    if (p.coat) { px(g, 7, 8, 2, 4, p.shirt); }
    if (dir === 'down' && p.badge) px(g, 9, 9, 1, 1, p.badge);
    // 팔
    if (dir === 'left') { px(g, 6, 8 + (f ? 1 : 0), 2, 3, shade(body, -15)); px(g, 6, 11 + (f ? 1 : 0), 2, 1, skin); }
    else if (dir === 'right') { px(g, 8, 8 + (f ? 1 : 0), 2, 3, shade(body, -15)); px(g, 8, 11 + (f ? 1 : 0), 2, 1, skin); }
    else {
      px(g, 3, 8, 1, 3, shade(body, -15)); px(g, 12, 8, 1, 3, shade(body, -15));
      px(g, 3, 11, 1, 1, skin); px(g, 12, 11, 1, 1, skin);
    }
    // 머리
    px(g, 4, 1, 8, 7, skin);
    px(g, 4, 0, 8, 3, hair);
    px(g, 3, 1, 1, 5, hair); px(g, 12, 1, 1, 5, hair);
    if (p.long) { px(g, 3, 6, 1, 4, hair); px(g, 12, 6, 1, 4, hair); }
    if (dir === 'up') { px(g, 4, 1, 8, 6, hair); if (p.long) px(g, 4, 7, 8, 2, hair); }
    else if (dir === 'left') { px(g, 8, 1, 4, 5, hair); px(g, 5, 4, 1, 2, '#2b2233'); }
    else if (dir === 'right') { px(g, 4, 1, 4, 5, hair); px(g, 10, 4, 1, 2, '#2b2233'); }
    else {
      px(g, 4, 3, 8, 1, hair);
      px(g, 6, 4, 1, 2, '#2b2233'); px(g, 9, 4, 1, 2, '#2b2233');
      px(g, 7, 6, 2, 1, shade(skin, -40));
      if (p.glasses) { px(g, 5, 4, 3, 1, p.glasses); px(g, 8, 4, 3, 1, p.glasses); }
    }
    if (p.hat) { px(g, 3, 0, 10, 2, p.hat); if (dir === 'down') px(g, 3, 2, 10, 1, shade(p.hat, -30)); }
  }

  function randomStudentPalette(rand) {
    const skins = ['#f6cfa5', '#f3c79b', '#eebd8f'];
    const hairs = ['#1e1a22', '#2b1d14', '#5a341d', '#7a4a24'];
    const shirts = ['#e8533f', '#3d9be9', '#46b866', '#f2b632', '#9b6ad6', '#ff8fb1', '#2fb3b3', '#ffffff', '#f08a3c'];
    const pants = ['#2f4f7f', '#3a3a4a', '#594a3a', '#4a6a9a'];
    const pick = a => a[Math.floor(rand() * a.length)];
    return { skin: pick(skins), hair: pick(hairs), shirt: pick(shirts), pants: pick(pants), shoes: '#222', long: rand() < 0.45 };
  }

// ===== world.js =====
// 대교초등학교 맵
//  · 바깥: 항공사진(선생님이 좌우를 뒤집어 보낸 방향)을 그대로 따라 그렸다. 위가 후관 쪽, 아래가 운동장.
//    항공사진 좌표(px) → 칸: ((x - 80) / 20, (y - 30) / 20)
//  · 실내: 2026 교실 배치도 좌표로 만든 뒤, 바깥 방향에 맞게 좌우를 뒤집는다(mirror).
//    배치도의 위쪽 줄 = 운동장 쪽(남), 아래쪽 줄(교실) = 안뜰 쪽(북).
const World = (() => {
  const { T, TILE } = Sprites;

  function newMap(id, name, w, h, fill, music) {
    const tiles = new Uint8Array(w * h).fill(fill);
    return { id, name, w, h, tiles, music, buildings: [], objects: [], warps: [], labels: [], zones: [], npcDefs: [], darkZones: [] };
  }
  function set(m, x, y, t) { if (x >= 0 && y >= 0 && x < m.w && y < m.h) m.tiles[y * m.w + x] = t; }
  function get(m, x, y) { if (x < 0 || y < 0 || x >= m.w || y >= m.h) return TILE.VOID; return m.tiles[y * m.w + x]; }
  function rect(m, x, y, w, h, t) { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) set(m, i, j, t); }
  function room(m, x, y, w, h, floor) { rect(m, x, y, w, h, TILE.WALL); rect(m, x + 1, y + 1, w - 2, h - 2, floor); }

  let objSeq = 1;
  function obj(m, kind, tx, ty, opts = {}) {
    const img = Sprites.makeObj(kind);
    const o = {
      id: 'o' + (objSeq++), kind, img,
      x: tx * T + (opts.dx || 0), y: ty * T + (opts.dy || 0), w: img.width, h: img.height,
      solid: opts.solid !== false, interact: opts.interact || null, hidden: false
    };
    const hh = opts.hitH != null ? opts.hitH : Math.min(o.h, T);
    o.hit = { x: o.x + (opts.hitX || 0), y: o.y + o.h - hh, w: opts.hitW || o.w, h: hh };
    m.objects.push(o);
    return o;
  }
  function label(m, tx, ty, text) { m.labels.push({ x: tx * T, y: ty * T, text }); }
  function warp(m, tx, ty, to, ax, ay, dir, lock) { m.warps.push({ x: tx, y: ty, to, ax, ay, dir, lock: lock || null }); }
  function sign(m, tx, ty, id) { obj(m, 'sign', tx, ty, { hitH: 5, hitX: 5, hitW: 6, interact: { type: 'sign', id } }); }
  // 수집품 개나리 꽃 (교화, 번호는 학교 전체에서 0~9)
  function star(m, tx, ty, i) { obj(m, 'star', tx, ty, { solid: false, interact: { type: 'star', i } }); }
  function lockDoor(m, tx, ty, key) { obj(m, 'lockdoor', tx, ty, { hitH: 16, interact: { type: 'lock', key } }); }
  function npc(m, def) { m.npcDefs.push(def); }
  function friend(m, id, pal, tx, ty, face) { m.npcDefs.push({ id, role: 'friend', pal, tx, ty, face: face || 'down' }); }
  function zone(m, x, y, w, h, n, key) { m.zones.push({ x, y, w, h, n, key }); }

  // ================= 실내 층 =================
  // 평면도 가로 위치(px) → 칸
  const PX = px => Math.round((px - 85) / 13.5);
  const H_IN = 17;          // 북쪽 방 y0~6 · 복도 y7~9 · 남쪽 방 y10~16

  function floorBase(id, name, w, hallTo) {
    const m = newMap(id, name, w, H_IN, TILE.VOID, 'indoor');
    rect(m, 0, 6, hallTo + 2, 5, TILE.WALL);
    rect(m, 1, 7, hallTo, 3, TILE.HALL);
    return m;
  }

  // 방 하나. side 'N'(복도 북쪽) | 'S'(복도 남쪽). 반환: { x0, x1, ix, iy, iw, ih, door, cx }
  function cell(m, side, px0, px1, name, opts = {}) {
    const x0 = PX(px0), x1 = PX(px1), w = x1 - x0 + 1;
    const y0 = side === 'N' ? 0 : 10;
    const r = { x0, x1, ix: x0 + 1, iy: y0 + 1, iw: w - 2, ih: 5, cx: (x0 + x1 + 1) / 2, side, name };
    const doorRow = side === 'N' ? 6 : 10;
    const kind = opts.kind || 'room';
    if (kind === 'open' || kind === 'bridge' || kind === 'exit') {
      // 복도에서 바깥쪽 끝까지 뚫린 칸 (통로·현관·연결통로)
      rect(m, x0, y0, w, 7, TILE.WALL);
      rect(m, x0 + 1, side === 'N' ? 1 : 10, w - 2, 6, kind === 'bridge' ? TILE.BRIDGE : TILE.HALL);
      const edge = side === 'N' ? 0 : 16;
      const a = Math.floor(r.cx) - 1, b = a + 1;
      if (kind === 'exit' || kind === 'bridge') {
        set(m, a, edge, kind === 'exit' ? TILE.EXIT : TILE.BRIDGE); set(m, b, edge, kind === 'exit' ? TILE.EXIT : TILE.BRIDGE);
        r.edge = edge; r.wa = a; r.wb = b;
      }
      label(m, r.cx, side === 'N' ? 6.35 : 10.35, name);
      return r;
    }
    room(m, x0, y0, w, 7, opts.floor || TILE.WOOD);
    if (kind === 'closed') {
      label(m, r.cx, y0 + 3.5, name);
      return r;
    }
    const dx = x0 + Math.floor(w / 2) - 1;
    set(m, dx, doorRow, TILE.HALL); set(m, dx + 1, doorRow, TILE.HALL);
    r.door = dx;
    label(m, dx + 1, doorRow + 0.35, name);

  let hrSeq = 0;
  function classroom(m, r, opts = {}) {
    const N = r.side === 'N';
    const board = r.iw >= 3 ? obj(m, 'board', r.ix + Math.max(0, Math.floor(r.iw / 2) - 1.5), N ? 0.6 : 15.4, { solid: false }) : null;
    // 반 교실에는 담임 선생님 (칠판 옆)
    if (/^\d-\d+$/.test(r.name)) {
      const k = r.name.split('').reduce((a, ch) => a * 31 + ch.charCodeAt(0), 7);
      m.npcDefs.push({ id: 'hr_' + r.name, role: 'teacher', cls: r.name, name: r.name + ' 담임 선생님', pal: 'hr' + (Math.abs(k) % 8),
        tx: r.ix + r.iw - 1, ty: N ? 0.9 : 14.9, face: N ? 'down' : 'up' });
      hrSeq++;
    }
    const rows = N ? [2, 4] : [12, 14];
    for (const yy of rows) {
      for (let xx = r.ix; xx < r.ix + r.iw; xx += 2) {
        const nearDoor = r.door != null && xx >= r.door - 1 && xx <= r.door + 1 && (N ? yy === 4 : yy === 12);
        if (nearDoor) continue;
        obj(m, opts.desk || 'desk', xx, yy);

    return { board };

  function office(m, r) {
    const yy = r.side === 'N' ? 2 : 13;
    for (let xx = r.ix; xx < r.ix + r.iw - 1; xx += 3) obj(m, 'desk', xx, yy);

  // 계단 칸: ↑(왼쪽 반)과 ↓(오른쪽 반). up/down = 이어지는 층 지도 id
  function stairs(m, side, px0, px1, up, down) {
    const r = cell(m, side, px0, px1, up && down ? '계단 ↑↓' : up ? '계단 ↑' : '계단 ↓', { floor: TILE.HALL });
    const rows = side === 'N' ? [1, 2] : [14, 15];
    const ay = side === 'N' ? 4.4 : 12.4, face = side === 'N' ? 'down' : 'up';
    const half = up && down ? Math.floor(r.iw / 2) : r.iw;
    for (let i = 0; i < r.iw; i++) {
      const goUp = up && (i < half || !down);
      const to = goUp ? up : down;
      for (const yy of rows) {
        set(m, r.ix + i, yy, goUp ? TILE.UP : TILE.DOWN);
        warp(m, r.ix + i, yy, to, r.cx, ay, face);
      }
    }
    return r;
  }
  // 바깥으로 나가는 문 (EXIT 칸 두 개) → 바깥 문 앞 도착 지점 out = [{ax, ay, dir}, ...]
  function exitTo(m, r, out) {
    warp(m, r.wa, r.edge, 'outdoor', out[0].ax, out[0].ay, out[0].dir);
    const o2 = out[1] || out[0];
    warp(m, r.wb, r.edge, 'outdoor', o2.ax, o2.ay, o2.dir);
  }
  // 바깥에서 들어올 때의 실내 도착 지점 (배치도 좌표, 좌우 뒤집기 때 함께 바뀐다)
  function arrive(m, r) { return { map: m.id, ax: r.cx, ay: r.edge === 0 ? 1.6 : 15.2, dir: r.edge === 0 ? 'down' : 'up' }; }
  let OUT = {}, IN = {};
  // 연결통로: 다른 건물 같은 층의 연결통로 칸으로
  function bridgeTo(m, r, to, ax, ay, dir) {
    warp(m, r.wa, r.edge, to, ax, ay, dir);
    warp(m, r.wb, r.edge, to, ax, ay, dir);
  }

    [TILE.EXIT]: '#4a90d9', [TILE.CAFE]: '#a9d0e0', [TILE.CARPET]: '#8b7cc4', [TILE.WALL]: '#4b4458',
    [TILE.FENCE]: '#9aa0a8', [TILE.TREE]: '#2f7d3b', [TILE.UP]: '#ffd84a', [TILE.DOWN]: '#ffd84a',
    [TILE.BUILDING]: '#c0c0c0', [TILE.VOID]: '#2a2533',
    [TILE.PAVE]: '#c3c5ca', [TILE.BRICK]: '#c0684f', [TILE.TRACK]: '#c4463a', [TILE.TURF]: '#46a54d', [TILE.COURT]: '#5fb3a1',
    [TILE.SAND]: '#e6d2a3', [TILE.STEP]: '#b3afa5', [TILE.PILOTI]: '#9a9ba2', [TILE.PARK]: '#9a9ca3', [TILE.BRIDGE]: '#cfd8e0', [TILE.MAT]: '#f2d4c0',
    [TILE.ROAD]: '#5d6168', [TILE.STAND]: '#8fb0f0', [TILE.CANOPY]: '#7fc9bd',
    [TILE.HEDGE]: '#3f7f3a', [TILE.SIDEWALK]: '#c9c3b6', [TILE.CLIFF]: '#8c887e', [TILE.LOWPAVE]: '#aeb0b6', [TILE.GARDEN]: '#7a5a3a', [TILE.OSTAIR]: '#d4d0c6', [TILE.FOREST]: '#2f6a33',
    [TILE.BTREE]: '#2f7d3b', [TILE.PTREE]: '#2f7d3b'
  };
  function minimapImage(m) {
    if (mmCache[m.id]) return mmCache[m.id];
    const c = document.createElement('canvas');
    c.width = m.w * MM; c.height = m.h * MM;
    const g = c.getContext('2d');
    for (let y = 0; y < m.h; y++) for (let x = 0; x < m.w; x++) {
      g.fillStyle = MM_COLORS[World.get(m, x, y)] || '#888';
      g.fillRect(x * MM, y * MM, MM, MM);
    }
    for (const b of m.buildings) {
      if (b.cells) {
        for (const k of b.cells) { const [x, y] = k.split(',').map(Number); g.fillStyle = b.cells.has(x + ',' + (y + 1)) ? b.roof : b.wall; g.fillRect(x * MM, y * MM, MM, MM); }
        if (b.doors) { g.fillStyle = '#5b3b24'; for (const k of b.doors) { const [x, y] = k.split(',').map(Number); g.fillRect(x * MM, y * MM, MM, MM); } }
        continue;
      }
      g.fillStyle = b.roof; g.fillRect(b.x * MM, b.y * MM, b.w * MM, (b.h - b.floors) * MM);
      g.fillStyle = b.wall; g.fillRect(b.x * MM, (b.y + b.h - b.floors) * MM, b.w * MM, b.floors * MM);
      g.fillStyle = '#5b3b24';
      for (const d of (b.doors || [{ x: b.door, w: b.doorW }])) g.fillRect(d.x * MM, (b.y + b.h - 1) * MM, d.w * MM, MM);
    }
    g.fillStyle = 'rgba(60,50,70,0.55)';
    for (const o of m.objects) if (o.solid) g.fillRect(o.hit.x / T * MM, o.hit.y / T * MM, Math.max(1, o.hit.w / T * MM), Math.max(1, o.hit.h / T * MM));
    mmCache[m.id] = c;
    return c;
  }
  let mmKey = '';
  function drawMinimap() {
    const cv = document.getElementById('minimap');
    if (!cv || !map || !player || cv.offsetParent === null) return;
    const img = minimapImage(map);
    const cssW = cv.clientWidth;
    const maxH = parseFloat(getComputedStyle(cv).maxHeight) || 150;
    const k = Math.min(cssW / img.width, maxH / img.height);
    const key = map.id + '|' + cssW + '|' + dpr;
    if (key !== mmKey) {
      mmKey = key;
      cv.style.height = Math.round(img.height * k) + 'px';
      cv.width = Math.round(cssW * dpr); cv.height = Math.round(img.height * k * dpr);
    }
    const g = cv.getContext('2d');
    const z = k * dpr;                   // 미니맵 px → 화면 px
    const ox = (cv.width - img.width * z) / 2;
    g.imageSmoothingEnabled = false;
    g.fillStyle = '#2a2533'; g.fillRect(0, 0, cv.width, cv.height);
    g.drawImage(img, ox, 0, img.width * z, img.height * z);
    const W2 = v => ox + v / T * MM * z, H2 = v => v / T * MM * z;
    // 지금 보이는 화면 범위
    g.strokeStyle = 'rgba(255,255,255,0.85)'; g.lineWidth = Math.max(1, dpr);
    g.strokeRect(W2(Math.max(0, cam.x)), H2(Math.max(0, cam.y)), Math.min(VW, map.w * T) / T * MM * z, Math.min(VH, map.h * T) / T * MM * z);
    // 목표 표시
    const blink = Math.sin(time * 6) > -0.3;
    const targets = hooks.minimapTargets ? hooks.minimapTargets(map.id) : [];
    for (const t of targets) {
      if (!blink) continue;
      const r = (t.kind === 'npc' ? 4 : 3) * dpr;
      g.fillStyle = t.kind === 'npc' ? '#ffd84a' : '#ff9b42';
      g.strokeStyle = '#2b2233'; g.lineWidth = dpr;
      g.beginPath();
      const x = W2(t.x), y = H2(t.y);
      g.moveTo(x, y - r); g.lineTo(x + r, y); g.lineTo(x, y + r); g.lineTo(x - r, y); g.closePath();
      g.fill(); g.stroke();
    }
    // 나
    const px = W2(player.x), py = H2(player.y - 4);
    g.fillStyle = '#ffffff'; g.beginPath(); g.arc(px, py, 4.2 * dpr, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#e8364f'; g.beginPath(); g.arc(px, py, 2.8 * dpr, 0, Math.PI * 2); g.fill();
    // 북쪽 표시
    g.font = `900 ${11 * dpr}px sans-serif`; g.textAlign = 'left'; g.textBaseline = 'top';
    g.lineWidth = 3 * dpr; g.strokeStyle = '#2b2233'; g.strokeText('N', 4 * dpr, 3 * dpr);
    g.fillStyle = '#ffffff'; g.fillText('N', 4 * dpr, 3 * dpr);
  }

  // ---------------- 맵 ----------------
  function renderMap(m) {
    if (mapCache[m.id]) return mapCache[m.id];
    const c = document.createElement('canvas');
    c.width = m.w * T; c.height = m.h * T;
    const g = c.getContext('2d');
    g.imageSmoothingEnabled = false;
    for (let y = 0; y < m.h; y++) {
      for (let x = 0; x < m.w; x++) {
        Sprites.drawTile(g, World.get(m, x, y), x, y, World.get(m, x, y + 1));
      }
    }
    for (const b of m.buildings) Sprites.drawBuilding(g, b);
    mapCache[m.id] = c;
    return c;
  }

  function charFrames(key, pal) {
    if (!charCache[key]) charCache[key] = Sprites.makeChar(pal);
    return charCache[key];
  }

  function spawnNpcs(m, content) {
    const list = [];
    for (const d of m.npcDefs) {
      const n = {
        id: d.id, role: d.role, def: d, x: d.tx * T + T / 2, y: d.ty * T + T - 1, dir: d.face || 'down',
        anim: 0, moving: false, wander: false
      };
      if (d.role === 'robot') {
        n.name = '로봇 교장선생님';
      } else {
        n.frames = charFrames(d.pal, Sprites.NPC_PALETTES[d.pal]);
        if (d.role === 'mission') n.name = content.missions[d.order - 1].npc;
        if (d.role === 'side') n.name = content.sides.find(s => s.id === d.side).npc;
        if (d.role === 'friend') { const f = content.friends.find(x => x.id === d.id); n.name = f ? f.name : d.id; }
        if (d.role === 'teacher') n.name = d.name;
      }
      list.push(n);
    }
    // 분위기 NPC
    const rand = Util.rng(m.id.split('').reduce((a, c) => a * 31 + c.charCodeAt(0), 7));
    let k = 0;
    for (const z of m.zones) {
      for (let i = 0; i < z.n; i++) {
        let tries = 0, tx, ty;
        do {
          tx = z.x + Math.floor(rand() * z.w); ty = z.y + Math.floor(rand() * z.h); tries++;
        } while (tries < 40 && (!walkableTile(m, tx, ty) || objectAt(m, tx * T + 8, ty * T + 12) || nearSpecial(m, list, tx * T + 8, ty * T + 15)));
        if (tries >= 40) continue;
        const teacher = false;   // 교실마다 담임 선생님이 따로 있다
        const pal = teacher ? Sprites.NPC_PALETTES[rand() < 0.5 ? 'teacher1' : 'teacher2'] : Sprites.randomStudentPalette(rand);
        const key = m.id + '_amb' + (k++);
        list.push({
          id: key, role: 'ambient', key: z.key, teacher, frames: charFrames(key, pal),
          x: tx * T + T / 2, y: ty * T + T - 1, dir: ['down', 'left', 'right', 'up'][Math.floor(rand() * 4)],
          anim: rand() * 2, moving: false, wander: rand() < 0.65, zone: z, t: rand() * 3, vx: 0, vy: 0
        });
      }
    }
    return list;
  }

  // 단서·미션 NPC 바로 옆에는 분위기 NPC를 두지 않는다
  function nearSpecial(m, list, x, y) {
    if (list.some(n => n.role !== 'ambient' && Math.hypot(n.x - x, n.y - y) < 32)) return true;
    return m.objects.some(o => o.interact && Math.hypot(o.hit.x + o.hit.w / 2 - x, o.hit.y + o.hit.h - y) < 32);
  }

  function walkableTile(m, tx, ty) {
    return !Sprites.SOLID.has(World.get(m, tx, ty)) && !m.warps.some(w => w.x === tx && w.y === ty);
  }
  function objectAt(m, x, y) {
    return m.objects.some(o => o.solid && !o.hidden && x >= o.hit.x - 2 && x < o.hit.x + o.hit.w + 2 && y >= o.hit.y - 2 && y < o.hit.y + o.hit.h + 2);
  }

  function blocked(m, x, y, hw, hh) {
    const x0 = x - hw, x1 = x + hw, y0 = y - hh, y1 = y;
    for (let ty = Math.floor(y0 / T); ty <= Math.floor((y1 - 0.01) / T); ty++) {
      for (let tx = Math.floor(x0 / T); tx <= Math.floor((x1 - 0.01) / T); tx++) {
        if (Sprites.SOLID.has(World.get(m, tx, ty))) return true;
      }
    }
    for (const o of m.objects) {
      if (!o.solid || o.hidden) continue;
      const h = o.hit;
      if (x1 > h.x && x0 < h.x + h.w && y1 > h.y && y0 < h.y + h.h) return true;
    }
    return false;
  }

  function moveEntity(e, dx, dy, hw, hh) {
    if (dx && !blocked(map, e.x + dx, e.y, hw, hh)) e.x += dx;
    if (dy && !blocked(map, e.x, e.y + dy, hw, hh)) e.y += dy;
  }

  // ---------------- 시작·맵 이동 ----------------
  function init(canvasEl, h) {
    screen = canvasEl;
    sg = screen.getContext('2d');
    buffer = document.createElement('canvas');
    bg = buffer.getContext('2d');
    hooks = h;
    resize();
    window.addEventListener('resize', resize);
    bindInput();
    robotImgs = { broken: Sprites.makeRobot(true), fixed: Sprites.makeRobot(false) };
    requestAnimationFrame(loop);
  }

  function newGame(session) {
    maps = World.build();
    for (const k in mapCache) delete mapCache[k];
    allNpcs = {};
    for (const id in maps) allNpcs[id] = spawnNpcs(maps[id], session.content);
    const pal = Sprites.PLAYER_PALETTES[session.player.charIdx];
    player = {
      x: (maps.outdoor.start ? maps.outdoor.start[0] : 23) * T + 8, y: (maps.outdoor.start ? maps.outdoor.start[1] : 34) * T + 12, dir: maps.outdoor.startDir || 'up', anim: 0, moving: false, z: 0, vz: 0, spin: 0, spinUsed: false,
      frames: Sprites.makeChar(pal)
    };
    loadMap('outdoor');
    fade = 1; fadeDir = -1;
    running = true;
    clearPressed();
  }

  function loadMap(id) {
    map = maps[id];
    safePos = null;
    npcs = allNpcs[id];
    renderMap(map);
    Sound.playMusic(map.music);
    hooks.mapChanged && hooks.mapChanged(map);
    snapCamera();
  }

  function warpTo(w) {
    pendingWarp = w;
    fadeDir = 1;
    Sound.sfx('door');
  }

  function stop() { running = false; }

  // ---------------- 갱신 ----------------
  function loop(ts) {
    const dt = Math.max(0, Math.min(0.05, (ts - last) / 1000 || 0));
    last = ts;
    time += dt;
    if (running) update(dt);
    render();
    requestAnimationFrame(loop);
  }

  function update(dt) {
    // 화면 전환(페이드)
    if (fadeDir) {
      fade += fadeDir * dt * 4;
      if (fadeDir > 0 && fade >= 1) {
        fade = 1;
        const w = pendingWarp; pendingWarp = null;
        loadMap(w.to);
        player.x = w.ax * T; player.y = w.ay * T; player.dir = w.dir; safePos = null;
        snapCamera();
        fadeDir = -1;
      } else if (fadeDir < 0 && fade <= 0) { fade = 0; fadeDir = 0; }
    }

    const modal = hooks.modalOpen();
    const frozen = modal || fadeDir > 0;

    // 플레이어 이동
    let mx = 0, my = 0;
    if (!frozen) {
      if (keys.left) mx -= 1;
      if (keys.right) mx += 1;
      if (keys.up) my -= 1;
      if (keys.down) my += 1;
      if (joy.active && (joy.dx || joy.dy)) { mx = joy.dx; my = joy.dy; }
    }
    const len = Math.hypot(mx, my);
    player.moving = len > 0.01;
    if (player.moving) {
      if (len > 1) { mx /= len; my /= len; }
      if (Math.abs(mx) > Math.abs(my)) player.dir = mx < 0 ? 'left' : 'right';
      else player.dir = my < 0 ? 'up' : 'down';
      moveEntity(player, mx * SPEED * speedK * dt, my * SPEED * speedK * dt, 5, 4);
      player.anim += dt * 8;
    }

    // 점프·공중 회전
    if (!frozen && consume('space')) {
      if (player.z <= 0) {
        player.vz = JUMP_V; player.z = 0.01; player.spinUsed = false; Sound.sfx('jump');
      } else if (!player.spinUsed) {
        player.spinUsed = true; player.spin = SPIN_TIME; player.vz = Math.max(player.vz, 80); Sound.sfx('spin');
      }
    }
    if (player.z > 0) {
      player.vz -= GRAVITY * dt;
      player.z += player.vz * dt;
      if (player.z <= 0) { player.z = 0; player.vz = 0; player.spin = 0; }
    }
    if (player.spin > 0) player.spin = Math.max(0, player.spin - dt);

    // 문·계단
    if (!fadeDir && player.z === 0) {
      const tx = Math.floor(player.x / T), ty = Math.floor((player.y - 2) / T);
      const w = map.warps.find(q => q.x === tx && q.y === ty);
      if (w) {
        const msg = w.lock && hooks.lockedWarp ? hooks.lockedWarp(w) : null;
        if (msg) {
          // 잠긴 문: 문에 들어서기 직전의 안전한 자리로 되돌리고 안내 (어느 방향에서 와도 건물 안에 갇히지 않게)
          if (safePos && safePos.map === map) { player.x = safePos.x; player.y = safePos.y; }
          else { const below = World.get(map, w.x, w.y + 1); if (Sprites.SOLID.has(below)) player.y = w.y * T - 3; else player.y = (w.y + 1) * T + 7; }
          if (time - lockMsgAt > 1.2) { lockMsgAt = time; Sound.sfx('wrong'); hooks.toast(msg); }
        } else warpTo(w);
      } else if (!Sprites.SOLID.has(World.get(map, tx, ty))) safePos = { map, x: player.x, y: player.y };
      // 혹시라도 막힌 칸 안에 들어가 있으면 마지막 안전한 자리로 꺼낸다
      if (Sprites.SOLID.has(World.get(map, tx, Math.floor((player.y - 1) / T))) && safePos && safePos.map === map) { player.x = safePos.x; player.y = safePos.y; }
    }

    // NPC
    for (const n of npcs) updateNpc(n, dt);
    updateConfetti(dt);
