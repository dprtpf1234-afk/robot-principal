<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2a2533">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="로봇 교장">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap" rel="stylesheet">
<title>로봇 교장선생님 구하기! · 대교초등학교</title>
<style>
:root {
  color-scheme: light only;
  --ink: #2b2233; --paper: #fff8e7; --line: #2b2233; --accent: #3c6bd8; --accent2: #ffd84a;
  --ok: #2f9e44; --bad: #d6336c; --muted: #7a6f86;
  --title-font: "Do Hyeon", "Black Han Sans", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #2a2533; font-family: var(--font); color: var(--ink); }
body { user-select: none; -webkit-user-select: none; overscroll-behavior: none; }
canvas#game, #touchUI, #hud { touch-action: none; }
.panel, #admin, #entry, .entry-card { touch-action: pan-y; }
input, textarea, select { user-select: text; -webkit-user-select: text; font-family: var(--font); }
canvas#game { position: fixed; inset: 0; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
.hidden { display: none !important; }
button { font-family: var(--font); cursor: pointer; color: var(--ink); -webkit-text-fill-color: currentColor; }

/* 공통 버튼 */
.primary, .ghost, .danger {
  font-size: 16px; font-weight: 800; padding: 10px 18px; border: 3px solid var(--line); border-radius: 10px;
  box-shadow: 0 4px 0 var(--line); transition: transform .05s;
}
.primary { background: var(--accent2); color: var(--ink); }
.ghost { background: #fff; color: var(--ink); }
.danger { background: var(--bad); color: #fff; }
.primary:active, .ghost:active, .danger:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
button.small { font-size: 13px; padding: 5px 10px; box-shadow: 0 2px 0 var(--line); }
.big { font-size: 20px; padding: 12px 28px; }
.muted { color: var(--muted); }
.ok { color: var(--ok); font-weight: 800; }
.bad { color: var(--bad); font-weight: 800; }
.center { text-align: center; justify-content: center; }
.row { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
p.small, .small { font-size: 13px; }

/* 첫 화면 */
#title { position: fixed; inset: 0; z-index: 30; overflow: hidden; background: #5aa6ec; }
#titleCanvas { position: absolute; inset: 0; image-rendering: pixelated; }
.title-tools { position: absolute; top: max(14px, env(safe-area-inset-top)); right: max(14px, env(safe-area-inset-right)); z-index: 2; display: flex; gap: 8px; }
.fs-btn svg { width: 20px; height: 20px; display: block; }
.fs-btn { display: flex; align-items: center; gap: 6px;
  font-family: var(--title-font); font-size: 17px; color: #fff; background: #2f6ef0; border: 3px solid #1b2f6b; border-radius: 8px; padding: 6px 12px; box-shadow: 0 4px 0 #1b2f6b; }
.fs-ico { width: 14px; height: 14px; border: 2px dashed #fff; border-radius: 2px; display: inline-block; }
.fs-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #1b2f6b; }
.title-head { position: absolute; left: 0; right: 0; top: 4.5vh; display: flex; flex-direction: column; align-items: center; gap: 1.2vh; pointer-events: none; padding: 0 10px; }
.t-badge { font-family: var(--title-font); font-size: clamp(13px, 2.3vh, 22px); color: #3a2a00; background: #ffd84a; border: 3px solid #3a2a00; border-radius: 6px; padding: 3px 14px; box-shadow: 0 3px 0 #3a2a00; }
.t-logo { margin: 0; font-family: var(--title-font); font-weight: 400; color: #ffffff; text-align: center; line-height: 1.05;
  font-size: clamp(34px, min(11vh, 7.2vw), 112px); letter-spacing: .01em;
  text-shadow: 3px 0 0 #1b2f6b, -3px 0 0 #1b2f6b, 0 3px 0 #1b2f6b, 0 -3px 0 #1b2f6b, 3px 3px 0 #1b2f6b, -3px 3px 0 #1b2f6b, 3px -3px 0 #1b2f6b, -3px -3px 0 #1b2f6b,
    0 8px 0 #3a6fd8, 3px 8px 0 #1b2f6b, -3px 8px 0 #1b2f6b, 0 11px 0 #1b2f6b; }
.t-sub { font-family: var(--title-font); font-size: clamp(13px, 2.2vh, 22px); color: #fff; background: #20335c; border-radius: 6px; padding: 4px 14px; border: 2px solid #8fb0f0; }
.title-bottom { position: absolute; left: 0; right: 0; bottom: max(3.5vh, env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; gap: 8px; }
.t-start { font-family: var(--title-font); font-size: clamp(24px, 4.4vh, 44px); color: #fff; background: #2f6ef0; border: 4px solid #1b2f6b; border-radius: 10px;
  padding: 10px 0; width: min(340px, 60vw); box-shadow: 0 6px 0 #1b2f6b, inset 0 -6px 0 #2457c8; animation: pulse 1.6s ease-in-out infinite; }
.t-start:active { transform: translateY(4px); box-shadow: 0 2px 0 #1b2f6b; }
@keyframes pulse { 50% { transform: scale(1.04); } }
.visit-box { position: absolute; left: max(12px, env(safe-area-inset-left)); bottom: max(12px, env(safe-area-inset-bottom)); z-index: 2; background: rgba(32, 40, 70, .88); color: #fff; border: 2px solid #8fb0f0; border-radius: 8px; padding: 6px 12px; font-size: 14px; font-weight: 700; line-height: 1.5; }
.visit-box b { color: #ffd84a; font-size: 16px; font-variant-numeric: tabular-nums; }
.t-hint { font-size: 14px; font-weight: 700; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.45); }

/* 입장 정보 창 */
#entry { position: absolute; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center; background: rgba(20, 30, 60, .45); padding: 12px; overflow: auto; }
.entry-card { position: relative; width: min(430px, 100%); max-height: 100%; overflow: auto; background: var(--paper); border: 3px solid var(--line); border-radius: 12px; box-shadow: 0 6px 0 var(--line); padding: 12px 16px; display: grid; gap: 4px; }
.entry-close { position: absolute; top: 10px; right: 10px; font-weight: 800; font-size: 13px; background: #fff; border: 2px solid var(--line); border-radius: 7px; padding: 3px 8px; color: var(--ink); }
.e-school { font-size: 12px; color: var(--muted); font-weight: 700; }
.e-title { margin: 0; font-family: var(--title-font); font-weight: 400; font-size: 24px; line-height: 1.1; }
.e-sub { color: var(--accent); font-weight: 700; font-size: 13px; margin-bottom: 0; }
.e-label { display: grid; gap: 3px; font-weight: 900; font-size: 13px; margin-top: 1px; }
div.e-label { display: block; }
.e-cols, .e-col { display: grid; gap: 4px; align-content: start; }
.e-label .muted { font-weight: 600; font-size: 12px; }
#gradeNote { display: inline; margin-left: 4px; }
.e-two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.entry-card input, .entry-card select { font-size: 16px; padding: 6px 9px; border: 2px solid var(--line); border-radius: 7px; background: #fff; color: var(--ink); width: 100%; font-weight: 600; }
.entry-card input:focus, .entry-card select:focus { outline: none; border-color: #f2b632; box-shadow: 0 0 0 3px #ffe8a3; }
.seg { display: grid; gap: 5px; }
.seg.six { grid-template-columns: repeat(6, 1fr); }
.seg.three { grid-template-columns: repeat(3, 1fr); }
.seg button { font-weight: 900; font-size: 13px; padding: 6px 3px; background: #fff; border: 2px solid #d8cba8; border-radius: 7px; color: var(--ink); }
.seg button.on { background: #4caf63; color: #fff; border-color: var(--line); box-shadow: 0 3px 0 var(--line); }
.avatars { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
@media (max-width: 480px) { .avatars { grid-template-columns: repeat(4, 1fr); } .seg .gr { display: none; } }
@media (max-width: 600px) { .title-head { top: 70px; } .t-logo { font-size: 30px; } .t-sub { font-size: 12px; } }
.avatars button { background: #fff; border: 2px solid #d8cba8; border-radius: 7px; padding: 2px 1px; display: grid; justify-items: center; gap: 0; color: var(--ink); font-weight: 800; font-size: 11px; }
.avatars button canvas { width: 28px; height: 28px; image-rendering: pixelated; }
.avatars button.on { background: #fff3c4; border-color: var(--line); box-shadow: 0 3px 0 var(--line); }
.mode-desc { margin: 0; font-size: 12px; color: #4a3f55; line-height: 1.45; min-height: 1.45em; }
#startErr { margin: 0; min-height: 0; font-size: 14px; }
#startErr:empty { display: none; }
.e-enter { font-family: var(--title-font); font-size: 22px; color: #fff; background: #2f6ef0; border: 3px solid var(--line); border-radius: 9px; padding: 5px; box-shadow: 0 4px 0 var(--line), inset 0 -4px 0 #2457c8; margin-top: 2px; }
.e-enter:active, .e-rank:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.e-rank { font-weight: 900; font-size: 13px; background: #fff8e7; border: 2px solid var(--line); border-radius: 9px; padding: 6px; box-shadow: 0 3px 0 var(--line); color: var(--ink); margin-top: 3px; }
#adminLink { text-align: center; font-size: 11px; color: #b9b0c4; }

/* 상단 정보 */
#hud { position: fixed; top: 0; left: 0; right: 0; z-index: 10; display: grid; grid-template-columns: auto 1fr auto; grid-template-areas: 'time next side'; align-items: start; gap: 8px; padding: 8px; padding-top: max(8px, env(safe-area-inset-top)); pointer-events: none; }
#hud > * { pointer-events: auto; }
.hud-left { grid-area: time; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
#hudNext { grid-area: next; }
.hud-side { grid-area: side; }
.hud-box { color: var(--ink); background: rgba(255, 248, 231, .95); border: 3px solid var(--line); border-radius: 10px; padding: 4px 10px; font-weight: 800; box-shadow: 0 3px 0 var(--line); }
#hudTime { font-size: 20px; font-variant-numeric: tabular-nums; line-height: 1.1; }
#hudTime small { display: block; font-size: 10px; color: var(--muted); }
.hud-box.warn { background: #ffd6e0; color: #b0123f; }
table.rank td.mode { color: var(--muted); font-size: 13px; }
.hud-timebox { display: flex; align-items: stretch; gap: 10px; }
.hud-place { display: flex; flex-direction: column; justify-content: center; border-left: 2px dashed #d8cba8; padding-left: 10px; }
#hudPlace { font-size: 17px; font-weight: 900; color: #2b5bd7; white-space: nowrap; line-height: 1.15; }
#hudPlace::before { content: '📍'; font-size: 13px; margin-right: 3px; }
#hudPhase { font-size: 11px; color: var(--muted); }
#hudNext { justify-self: center; align-self: start; max-width: 760px; margin-top: 4px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  background: rgba(36, 30, 52, .92); color: #fff; border: 3px solid #ffd84a; border-radius: 12px; padding: 7px 14px; box-shadow: 0 3px 0 #1a1526; font-size: 16px; font-weight: 700; }
#hudNext:empty { display: none; }
#hudNext .star { width: 22px; height: 22px; flex: none; background: #ffd84a; clip-path: polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%); }
#hudNext .mtext b { color: #ffd84a; }
#hudNext .mtext .cnt { display: inline-block; background: #ffd84a; color: #2b2233; border-radius: 6px; padding: 0 6px; margin-left: 4px; font-weight: 900; }
#hudNext .mpill { background: #ffd84a; color: #2b2233; border-radius: 8px; padding: 2px 10px; font-size: 13px; font-weight: 900; white-space: nowrap; }
.hud-right { display: flex; gap: 6px; align-items: center; }
.hud-side { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.map-panel { background: rgba(255, 248, 231, .95); border: 3px solid var(--line); border-radius: 10px; box-shadow: 0 3px 0 var(--line); padding: 5px; display: grid; gap: 5px; width: 220px; }
#minimap { display: block; width: 100%; max-height: 170px; image-rendering: pixelated; border-radius: 5px; background: #2a2533; }
.map-panel.folded #minimap { display: none; }
.inv-panel { background: #fff8e6; border: 3px solid var(--line); border-radius: 10px; box-shadow: 0 3px 0 var(--line); padding: 8px 9px 9px; width: 220px; box-sizing: border-box; }
.inv-panel h4 { margin: 0 0 6px; font-size: 13px; font-weight: 900; color: #2b2233; }
.inv-panel h4 + .inv-grid { margin-bottom: 8px; }
.inv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
.inv-slot { font-size: 11.5px; font-weight: 800; border-radius: 7px; padding: 4px 5px; text-align: center; border: 2px dashed #cdbf9f; color: #a89c84; background: #fffdf6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.inv-slot.on { border: 2px solid #3f9a4a; background: #e3f6dc; color: #22522a; }
.inv-chips { display: flex; flex-wrap: wrap; gap: 5px; }
.inv-chip { font-size: 11.5px; font-weight: 800; border-radius: 7px; padding: 3px 7px; border: 2px dashed #cdbf9f; color: #a89c84; background: #fffdf6; }
.inv-chip.on { border: 2px solid #2b2233; color: #2b2233; background: #fff; }
.inv-chip.tok { border: 2px solid #7b5cd6; color: #4a2fa8; background: #f1ebff; }
.inv-chip.star { border: 2px solid #e2b21f; color: #7a5a00; background: #fff6cc; }
.map-ctrl { display: flex; align-items: center; gap: 5px; }
.map-ctrl #zoomLabel { min-width: 30px; text-align: center; font-weight: 900; font-size: 14px; color: var(--ink); }
.map-ctrl #mapToggle { margin-left: auto; font-size: 12px; padding: 4px 8px; }
.hud-btn.sq { width: 32px; height: 30px; padding: 0; font-size: 20px; line-height: 1; background: #2f6ef0; color: #fff; border-color: #1b2f6b; box-shadow: 0 3px 0 #1b2f6b; }
.hud-btn.sq:disabled { opacity: .4; }
.hud-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
#hudParts { display: flex; gap: 3px; }
#hudParts .slot { width: 12px; height: 12px; border: 2px solid var(--line); border-radius: 3px; background: #ddd2be; }
#hudParts .slot.on { background: var(--accent2); }
.hud-btn { font-size: 13px; font-weight: 800; padding: 6px 10px; border: 3px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); box-shadow: 0 3px 0 var(--line); white-space: nowrap; }
.hud-btn.muted { background: #ddd; color: var(--ink); }
.hud-btn.ico { width: 38px; height: 34px; padding: 0; display: grid; place-items: center; background: #2f6ef0; color: #fff; border-color: #1b2f6b; box-shadow: 0 3px 0 #1b2f6b; }
.hud-btn.ico svg { width: 18px; height: 18px; display: block; }
.hud-btn.ico.muted { background: #8a94a6; }
.side-btns { display: grid; grid-template-columns: 1fr auto; gap: 6px; width: 220px; }
.hud-btn.dex { background: #2f6ef0; color: #ffd84a; border-color: #1b2f6b; box-shadow: 0 3px 0 #1b2f6b; }
.hud-btn { height: 34px; }
/* 도감 */
.panel.dexp { width: min(860px, 100%); }
.dex-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; max-height: 58vh; overflow: auto; padding: 2px; }
.dex-card { background: #fff; border: 3px solid var(--line); border-radius: 10px; padding: 8px; display: grid; grid-template-columns: 44px 1fr; gap: 8px; align-items: start; }
.dex-card.unknown { background: #ece4d2; border-color: #c9bb98; color: var(--muted); }
.dex-card canvas { width: 44px; height: 44px; image-rendering: pixelated; background: #cfe8c4; border-radius: 6px; }
.dex-card.unknown canvas { background: #d8ccb0; }
.dex-card .nm { font-weight: 900; font-size: 14px; line-height: 1.25; }
.dex-card .pl { font-size: 11px; color: var(--accent); font-weight: 800; margin-top: 2px; }
.dex-card.unknown .pl { color: var(--muted); }
.dex-card .pf { grid-column: 1 / -1; font-size: 12px; line-height: 1.45; }
.dex-head { display: flex; align-items: baseline; gap: 10px; }
.dex-bar { flex: 1; height: 12px; border: 3px solid var(--line); border-radius: 6px; background: #fff; overflow: hidden; }
.dex-bar span { display: block; height: 100%; background: #4caf63; }


/* 미션 순서도 */
.flow-panel { background: rgba(255, 248, 231, .95); border: 3px solid var(--line); border-radius: 10px; box-shadow: 0 3px 0 var(--line); padding: 4px 6px 6px; width: 212px; }
.flow-toggle { display: block; width: 100%; text-align: left; background: none; border: 0; font-weight: 900; font-size: 13px; padding: 2px 2px 4px; color: var(--ink); }
.flow-panel.folded { width: auto; padding-bottom: 2px; }
/* 캐릭터가 패널 뒤로 가면 잠깐 숨긴다 */
.flow-panel, .inv-panel { transition: opacity .25s, transform .25s; }
.auto-hide { opacity: 0 !important; transform: scale(.96); pointer-events: none !important; }
.flow-panel.folded .flow-list { display: none; }
.flow-list { display: grid; gap: 1px; justify-items: stretch; }
.fl-stage { display: grid; gap: 3px; }
.fl-stage.multi { grid-template-columns: 1fr 1fr; }
.fl-arrow { text-align: center; font-size: 9px; line-height: 10px; color: var(--muted); }
.fl-node { display: flex; align-items: center; gap: 4px; padding: 4px 5px; border: 2px solid var(--line); border-radius: 7px; background: #fff; font-weight: 800; font-size: 12px; line-height: 1.15; text-align: left; color: var(--ink); min-width: 0; }
.fl-node .fl-lab { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fl-ic { flex: none; width: 17px; height: 17px; display: grid; place-items: center; border-radius: 50%; font-size: 11px; background: #ffd84a; border: 2px solid var(--line); }
.fl-node.done { background: #e2f5e2; color: #3c6b3c; }
.fl-node.done .fl-ic { background: var(--ok); color: #fff; }
.fl-node.lock { background: #ece6d8; color: #9a8f80; border-color: #c9bb98; }
.fl-node.lock .fl-ic { background: none; border-color: transparent; font-size: 10px; }
.fl-node.open { background: #fff7c9; }
.fl-node.focus { outline: 3px solid #2f6ef0; outline-offset: 1px; animation: flpulse 1.2s ease-in-out infinite; }
@keyframes flpulse { 50% { outline-color: #8fb0f0; } }
#hudParts .tok { font-size: 13px; font-weight: 900; margin-right: 4px; white-space: nowrap; }
.credit { position: absolute; right: max(12px, env(safe-area-inset-right)); bottom: max(12px, env(safe-area-inset-bottom)); z-index: 2; color: #fff; font-size: 12px; font-weight: 700; background: rgba(32, 40, 70, .7); border-radius: 6px; padding: 3px 9px; }
.credit:empty { display: none; }

/* 힌트·해설 */
.hint-area { margin: 0 0 10px; }
.hint-btn { font-weight: 900; font-size: 14px; padding: 5px 12px; border: 3px solid #b88a00; border-radius: 999px; background: #fff3c4; color: #5a4300; box-shadow: 0 2px 0 #b88a00; }
.hint-btn small { font-weight: 700; font-size: 12px; margin-left: 4px; }
.hint-btn:disabled { opacity: .75; box-shadow: none; }
.hint-text { margin-top: 6px; background: #fffbe6; border: 2px dashed #d9a400; border-radius: 8px; padding: 6px 10px; font-weight: 700; font-size: 14px; white-space: pre-line; }
.choice.gone { opacity: .3; text-decoration: line-through; }
.explain { margin-top: 6px; background: #eaf5ff; border: 2px solid #8fb0f0; border-radius: 8px; padding: 7px 10px; font-size: 15px; line-height: 1.5; font-weight: 600; }
.explain b { color: var(--accent); margin-right: 4px; }

/* 수첩·팻말 */
.nb-top { display: flex; gap: 6px; flex-wrap: wrap; }
.nb-chip { display: inline-block; background: #fff; border: 2px solid var(--line); border-radius: 999px; padding: 2px 10px; font-weight: 800; font-size: 13px; }
.nb-chip.bad { color: var(--bad); }
.sign-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.sign-head h2 { margin: 0; }
.sign-i { width: 30px; height: 30px; border-radius: 6px; background: #3c8de0; color: #fff; display: grid; place-items: center; font-weight: 900; font-family: Georgia, serif; font-size: 20px; border: 3px solid var(--line); }
.sign-text { white-space: pre-line; background: #fff; border: 3px solid var(--line); border-radius: 10px; padding: 12px 14px; font-size: 16px; line-height: 1.6; font-weight: 600; }
.sign-img { display: block; width: 120px; height: auto; margin: 0 auto 10px; }
.ios-guide { display: grid; gap: 8px; text-align: left; }
.ios-guide b:first-child { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--accent2); border: 2px solid var(--line); margin-right: 6px; }
.ios-share { display: inline-block; border: 2px solid var(--accent); color: var(--accent); border-radius: 5px; padding: 0 5px; font-weight: 900; }

  .e-title { font-size: 26px; }
  .e-sub, .e-school { display: none; }
  .avatars { grid-template-columns: repeat(4, 1fr); }
  .avatars button canvas { width: 28px; height: 28px; }
  .avatars button span { display: none; }
  .seg button { padding: 6px 2px; }
  .e-enter { font-size: 22px; padding: 2px; }
  .e-rank { padding: 5px; font-size: 13px; }
  .avatars button { padding: 2px; }
  .entry-card input, .entry-card select { padding: 6px 9px; font-size: 16px; }
  .mode-desc { font-size: 12px; }
  .panel h2 { font-size: 18px; margin-bottom: 6px; }
  .quiz-who { padding: 1px 8px; margin-bottom: 6px; font-size: 13px; }
  .quiz-rule { font-size: 12px; padding: 3px 8px; margin-bottom: 5px; }
  .quiz-prog { margin-bottom: 3px; }
  .choices { grid-template-columns: 1fr 1fr; gap: 6px; }
  .quiz-feedback { min-height: 20px; margin-top: 6px; font-size: 14px; }
  .quiz .row { margin-top: 4px; }
  .quiz .row button { font-size: 13px; padding: 5px 12px; box-shadow: 0 2px 0 var(--line); }
  .oxbtn { font-size: 32px; padding: 6px; }
  #charPreview { width: 72px; height: 72px; }
  .character .center:not(.row) { display: none; }
  .howto { font-size: 13px; padding: 6px 10px; }
  .row { margin-top: 10px; }
  .big-time { font-size: 36px; }
  .rank-wrap { max-height: 40vh; }
  .rk-row { margin-bottom: 4px; }
  .rk-seg button { padding: 4px 6px; font-size: 12px; }
  .rk-what { margin: 0 0 4px; font-size: 12px; }
  #toast { top: 58px; }
  .map-panel { width: 176px; padding: 4px; }
  .inv-panel { width: 176px; padding: 6px; }
  .inv-slot, .inv-chip { font-size: 10.5px; }
  .side-btns { width: 176px; }
  #minimap { max-height: 96px; }
  .hud-btn.sq { width: 28px; height: 26px; font-size: 17px; }
  .hud-btn { height: 30px; font-size: 12px; padding: 4px 7px; }
  .hud-btn.ico { width: 32px; height: 30px; }
  .dex-grid { max-height: 62vh; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  .flow-panel { width: 176px; padding: 3px 4px 4px; }
  .fl-stage.multi .fl-ic { display: none; }
  .fl-node { font-size: 11px; padding: 2px 4px; }
  .fl-ic { width: 15px; height: 15px; font-size: 10px; }
  .mg-intro { font-size: 13px; margin-bottom: 4px; }
  .lb-card .emo { font-size: 30px; }
  .lb-grid { grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 5px; }
  .rb-grid { width: min(220px, 100%); }
  .rb-add { height: 38px; font-size: 20px; }
  .cd-sig { height: 42px; min-width: 46px; }
  .cd-slot { height: 36px; width: 44px; font-size: 20px; }
  .hint-area { margin-bottom: 6px; }
  .explain { font-size: 13px; padding: 4px 8px; }
  .credit { font-size: 10px; }
}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="title">
  <canvas id="titleCanvas"></canvas>
  <div class="title-tools">
    <button class="fs-btn" id="btnSoundTitle" type="button" title="소리"></button>
    <button class="fs-btn" id="btnFull" type="button"><span class="fs-ico"></span>전체 화면</button>
  </div>
  <div class="title-head">
    <div class="t-badge">대교초등학교 SW·AI 행사 메타버스</div>
    <h1 class="t-logo">로봇 교장선생님 구하기!</h1>
    <div class="t-sub">에피소드 1 · 고장 난 로봇 교장선생님을 깨워라</div>
  </div>
  <div class="credit" id="credit"></div>
  <div class="visit-box" id="visitBox"><div>오늘 접속 <b id="visToday">0</b>명</div><div>누적 접속 <b id="visTotal">0</b>명</div></div>
  <div class="title-bottom">
    <button class="t-start" id="btnStart" type="button">시작하기</button>
    <div class="t-hint">아무 키나 눌러도 시작해요</div>
  </div>

  <div id="entry" class="hidden">
    <form class="entry-card" id="startForm" autocomplete="off">
      <button type="button" class="entry-close" id="entryClose">닫기 ✕</button>
      <div class="e-school">대교초등학교 SW·AI 행사</div>
      <h2 class="e-title">로봇 교장선생님 구하기!</h2>
      <div class="e-sub">에피소드 1 · 고장 난 로봇 교장선생님을 깨워라</div>

      <div class="e-cols"><div class="e-col">
      <div class="e-label">학년 <span class="muted" id="gradeNote">학년에 맞는 문제가 나와요</span></div>
      <div class="seg six" id="gradeSeg"></div>
      <div class="e-two">
        <label class="e-label">반<select id="inClass"><option value="">고르기</option></select></label>
        <label class="e-label">이름<input id="inName" type="text" maxlength="4" placeholder="예: 김하늘"></label>
      </div>
      </div><div class="e-col">

      <div class="e-label">캐릭터</div>
      <div class="avatars" id="avatarGrid"></div>

      <div class="e-label">모드</div>
      <div class="seg three" id="modeSeg">
        <button type="button" data-m="m30">30분 미션</button>
        <button type="button" data-m="m10">10분 미션</button>
        <button type="button" data-m="free">탐험</button>
      </div>
      <p class="mode-desc" id="modeDesc"></p>
      <p id="startErr" class="bad"></p>
      <button type="submit" class="e-enter">입장하기</button>
      <button type="button" class="e-rank" id="btnRankStart">최고 기록 보기 (학년군별)</button>
      </div></div>
      <div id="adminLink">v3.14</div>
    </form>
  </div>
</div>

<div id="hud" class="hidden">
  <div class="hud-left">
    <div class="hud-box hud-timebox"><div id="hudTime">00:00</div><div class="hud-place"><div id="hudPlace"></div><div id="hudPhase"></div></div></div>
    <div class="flow-panel" id="flowPanel"><button class="flow-toggle" id="flowToggle">순서도 ▾</button><div class="flow-list" id="flowList"></div></div>
  </div>
  <div id="hudNext" class="hud-box"></div>
  <div class="hud-side">
    <div class="hud-right">
      <div id="hudParts" class="hud-box"></div>
      <button class="hud-btn ico" id="btnSound" title="소리"></button>
      <button class="hud-btn ico" id="btnFullGame" title="전체 화면"><svg viewBox="0 0 20 20"><path d="M2 7V2h5M13 2h5v5M18 13v5h-5M7 18H2v-5" fill="none" stroke="currentColor" stroke-width="2.6"/></svg></button>
      <button class="hud-btn ico home" id="btnHome" title="처음 화면"><svg viewBox="0 0 20 20"><path d="M2 10L10 3l8 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/><path d="M5 9v8h4v-5h2v5h4V9" fill="currentColor"/></svg></button>
    </div>
    <div class="map-panel" id="mapPanel">
      <canvas id="minimap"></canvas>
      <div class="map-ctrl">
        <button class="hud-btn sq" id="zoomOut" title="작게 보기">−</button>
        <span id="zoomLabel">1x</span>
        <button class="hud-btn sq" id="zoomIn" title="크게 보기">+</button>
        <button class="hud-btn" id="mapToggle">접기</button>
      </div>
    </div>
    <div class="side-btns">
      <button class="hud-btn dex" id="btnDex">도감 0/31</button>
      <button class="hud-btn note" id="btnNote">수첩</button>
    </div>
    <div class="inv-panel" id="invPanel"></div>
  </div>
</div>

<div id="touchUI" class="hidden">
  <div id="joystick"><div id="joyKnob"></div></div>
  <button class="tbtn off" id="btnTalk">대화</button>
  <button class="tbtn" id="btnJump">점프</button>
</div>

<div id="dialog" class="hidden"><div id="dlgWho"></div><div id="dlgText"></div><div class="dlg-foot"><span id="dlgPage"></span><span class="dlg-btns"><button class="dlg-btn" id="dlgSkip" type="button">건너뛰기</button><button class="dlg-btn go" id="dlgNext" type="button">다음 ▶</button></span></div></div>
<div id="modal" class="hidden"><div id="modalBody" class="panel"></div></div>
<div id="toast"></div>
<div id="rotate">기기를 가로로 돌려 주세요 ↻</div>
<div id="admin" class="hidden"></div>

<script>
window.RP_CONFIG = /*__CONFIG__*/;
/*__SCRIPTS__*/
</script>
<script>
// 세로 화면 안내 (게임 중일 때만)
(function () {
  const rot = document.getElementById('rotate');
  setInterval(() => rot.classList.toggle('need', document.getElementById('title').classList.contains('hidden')), 500);
})();
</script>
</body>
</html>
